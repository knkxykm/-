<style>
/* layout: one-screen reader — a thin ruled band on top, a vertical (tategaki) text field that pages right-to-left, a page bar below; the 渡り廊下 lamp is the only warm color */
:root{
  --paper:#f2f4f7;
  --sheet:#fbfcfd;
  --ink:#1e222a;
  --muted:#667085;
  --rule:#d5dae3;
  --ai:#2c4a74;
  --lamp:#b8862f;
  --font-text:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;

  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1117;--sheet:#131720;--ink:#dce1e9;--muted:#8a93a6;--rule:#272d39;--ai:#9fb8dc;--lamp:#e2b65f;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1117;--sheet:#131720;--ink:#dce1e9;--muted:#8a93a6;--rule:#272d39;--ai:#9fb8dc;--lamp:#e2b65f;color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* top band */
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--paper);min-width:0}
.work{font-family:var(--font-title);font-weight:700;font-size:17px;letter-spacing:.18em;white-space:nowrap;margin:0}
.where{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.tools{display:flex;gap:6px;flex:none}
.btn{font:500 13px/1 var(--font-ui);letter-spacing:.06em;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:3px;padding:8px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ai);color:var(--ai)}
.btn[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--sheet)}
.btn:focus-visible,.toc a:focus-visible,.pane:focus-visible,.next-ch:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.sizes{display:flex}
.sizes .btn{border-radius:0;margin-left:-1px}
.sizes .btn:first-child{border-radius:3px 0 0 3px;margin-left:0}
.sizes .btn:last-child{border-radius:0 3px 3px 0}

/* reading field */
.stage{min-height:0;position:relative;background:var(--sheet)}
.pane{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;writing-mode:vertical-rl;scroll-behavior:smooth;
  padding-block:0;padding-inline:clamp(20px,5vh,48px);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
@media (prefers-reduced-motion:reduce){.pane{scroll-behavior:auto}}
.text{max-inline-size:40em;margin-inline:auto;block-size:auto;font-family:var(--font-text);font-size:var(--fs);line-height:1.95;letter-spacing:.05em;
  padding-block:clamp(20px,6vw,64px);font-feature-settings:"palt" 0}

.text h3.sec{margin-block:3.2em 1.6em;font-family:var(--font-title);font-weight:700;font-size:1.15em;letter-spacing:.14em;display:flex;gap:.9em;align-items:baseline;text-wrap:balance}

.chap-title{margin:0;font-family:var(--font-title);font-weight:700;font-size:1.9em;letter-spacing:.2em;line-height:1.3}

.fin{font-family:var(--font-title);color:var(--muted);letter-spacing:.3em;font-size:14px}

/* page bar */
.pager{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--rule);background:var(--paper)}
.track{position:relative;height:2px;background:var(--rule);border-radius:1px;direction:rtl}
.fill{position:absolute;inset-block:0;right:0;width:0;background:var(--ai);border-radius:1px}
.dot{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;margin-right:-4.5px;border-radius:50%;background:var(--lamp);right:0;box-shadow:0 0 8px 1px color-mix(in srgb,var(--lamp) 50%,transparent)}
.pct{font:12px/1 var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.pgbtn{font:500 13px/1 var(--font-ui);letter-spacing:.08em}

/* contents drawer */
.toc{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:1fr minmax(0,380px);background:color-mix(in srgb,var(--ink) 28%,transparent)}
.toc[hidden]{display:none!important}
.toc-panel{grid-column:2;background:var(--paper);border-left:1px solid var(--rule);overflow-y:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.toc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.toc-head h2{margin:0;font-family:var(--font-title);font-size:18px;letter-spacing:.2em}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.toc .ch>a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--ink);font-family:var(--font-title);font-weight:700;font-size:16px;letter-spacing:.08em}
.toc .ch>a .l{color:var(--ai);font-weight:500;font-size:13px;letter-spacing:.2em;min-width:4em}
.toc .ch[aria-current="true"]>a{color:var(--ai)}
.toc ul{list-style:none;margin:6px 0 0;padding:0 0 0 calc(4em + 10px);display:flex;flex-direction:column;gap:4px}
.toc ul a{color:var(--muted);text-decoration:none;font-family:var(--font-text);font-size:14px;letter-spacing:.04em}
.toc ul a:hover,.toc .ch>a:hover{color:var(--ai)}
.toc-note{margin-top:22px;font-size:12px;line-height:1.7;color:var(--muted);letter-spacing:.04em;border-top:1px solid var(--rule);padding-top:14px}

@media (max-width:560px){
  .work{font-size:15px;letter-spacing:.12em}
  .where{display:none}
  .bar{gap:8px}
  .btn{padding:8px 9px}
  .toc{grid-template-columns:0 1fr}
}
</style>

<template id="t-prologue" data-label="序章" data-title="月の夜、宿を見つける"><header class="chap-head"><p class="chap-label">序章</p><h2 class="chap-title">月の夜、宿を見つける</h2></header><h3 class="sec" id="prologue-1"><span class="num">一</span><span class="name">圏外</span></h3><p>帰りたくなかった。</p><p>理由なら、いくつもあったような気がする。</p><p>でも、どれも口にすると大げさだった。</p><p>仕事が嫌だったとか。誰かと喧嘩したとか。人生を捨てたかったとか。</p><p>そんなことではない。</p><p>ただ。</p><p>いつもとは違う場所に居たかった。</p><div class="sep" aria-hidden="true">◇</div><p>夕暮れの雪山は、音が少なかった。</p><p>自分の足音と、遠くの風。それだけ。</p><p>人の気配のない細い山道が、木々の間を白く、どこまでも続いている。</p><p>ポケットから携帯電話を出した。</p><p>圏外。</p><p>地図を開いても現在地の青い点が、うまく定まらない。</p><p>行ったり来たりして、やがて灰色の円の中で止まった。</p><p class="q">「……まずいな」</p><p>来た道を振り返る。</p><p>足跡が、雪でほとんど消えていた。</p><p>少しだけ現実から離れるつもりだった。本当に離れられるとは、思っていなかった。</p><p>風が強くなる。視界が白く霞む。</p><p class="q">「……戻ろう」</p><p>来たと思う方へ、数分歩いた。</p><p>見覚えのある景色は、出てこなかった。</p><p>木も、雪も、岩も、さっき見たものと同じようで、全部違うようにも見えた。</p><div class="sep" aria-hidden="true">◇</div><p>小さな羽音がした。</p><p>白いものが、視界を横切る。</p><p class="q">「……鳥？」</p><p>雪の上に、小さな白い鳥が降りた。</p><p>丸い。真っ白。雪に紛れてしまいそうな白さの中で、黒い目だけが、こちらを見ている。</p><p class="q">「ぴ」</p><p>黙って見返す。</p><p class="q">「ぴ！」</p><p>鳥は数歩先へ跳ねた。振り返る。また跳ねる。また振り返る。</p><p class="q">「……ついて来いってこと？」</p><p class="q">「りょうかい！」</p><p>鳥が、言った。</p><p class="q">「……喋った」</p><p>鳥は、走り出した。短い足で、ととと、と。雪の上に、小さな足跡が点々と続いていく。</p><p class="q">「ちょっと、待って」</p><p>気がつくと、その足跡を追いかけていた。</p><p>風の向こうから、鈴の音がしたような気がした。</p><h3 class="sec" id="prologue-2"><span class="num">二</span><span class="name">右へ一歩</span></h3><p>林は深くなっていた。</p><p>夕闇が、木々の根元から少しずつ滲み出している。雪の白さだけが、まだかろうじて道らしいものを浮かび上がらせていた。</p><p>小鳥が、急に止まった。</p><p class="q">「ぴ」</p><p>その先に、人影があった。</p><p>白い衣だった。雪の中に立っているのに、不思議なほど輪郭がはっきりと見える。周りの白と、その人の白が、混ざらない。</p><p class="q">「そこで止まって」</p><p>穏やかな声だった。大きくはないのに、風の中でもよく通る。</p><p>足が、止まった。</p><p class="q">「右へ一歩」</p><p>理由を訊くより先に、身体が動いていた。</p><p>右へ、一歩。</p><p>その直後だった。</p><p>さっきまで立っていた場所の雪が、音もなく崩れた。沈むように、吸い込まれるように。その下で、細い沢の水が、黒く光って流れていた。</p><p>声が、出なかった。</p><p class="q">「うん。その反応で正しい」</p><p>その人が、近づいてきた。</p><p>穏やかな顔だちの青年だった。けれど、この雪山を歩くには、妙に軽装に見える。寒そうな様子は、どこにもなかった。</p><p class="q">「歩ける？」</p><p class="q">「……たぶん」</p><p class="q">「『たぶん』ね」</p><p>青年は少し屈んで、こちらの靴と手元を見た。診るように。数えるように。</p><p class="q">「指は動く？」</p><p>手袋の中で、指を握ってみた。冷たい。でも、動く。</p><p class="q">「はい」</p><p class="q">「うん。ゆっくり行こう。ふらついたら、すぐ言って」</p><p>青年は、手を差し出さなかった。</p><p>代わりに数歩先へ進んで、振り返った。</p><p>鳥がさっきそうしたように。</p><p class="q">「宿がある。まずそこまで行こう」</p><p class="q">「宿？」</p><p class="q">「そう」</p><p>白い鳥が、ぱたぱたと青年の肩に飛び乗った。</p><p class="q">「ぴ！」</p><p class="q">「よく見つけたね」</p><p>鳥が、胸を張った。見るからに得意そうだった。</p><p class="q">「あの鳥、あなたの……？」</p><p class="q">「うちの仲居」</p><p class="q">「……仲居」</p><p class="q">「仕事のできる仲居だよ」</p><p class="q">「ぴ！」</p><p>青年が、こちらを見た。</p><p class="q">「名前だけ訊いてもいい？」</p><p>名前を名乗った。</p><p>青年は、その名前を一度だけ、確かめるように呼んだ。宿帳に書き込む前に、字を確かめる人のように。</p><p class="q">「僕は冴月。あとは中で」</p><p class="q">「事情とか、訊かないんですか」</p><p>冴月さんは、もう歩き出していた。</p><p class="q">「凍えてる人に立ち話させる趣味はないな」</p><p>少し間があった。</p><p class="q">「話したくなったら、後で聞くよ」</p><p>話さなくてもいい、という意味だと分かった。それだけで、雪の中を歩く足が、少し軽くなった。</p><h3 class="sec" id="prologue-3"><span class="num">三</span><span class="name">真宵家</span></h3><p>林が、切れた。</p><p>そこに古い建物があった。</p><p>和館と洋館が混ざったような、大きな宿だった。瓦の屋根に雪が厚く積もり、その下に並んだ窓の向こうで、暖かい色の灯りが揺れている。煙突から、細い煙が一本、夜の空へ立ち昇っていた。</p><p class="q">「……こんなところに」</p><p class="q">「真宵家」</p><p class="q">「まよいが」</p><p class="q">「名前通りになったね」</p><p class="q">「……笑えないです」</p><p class="q">「それは失礼」</p><p>冴月さんは、少しも失礼だとは思っていない顔で、そう言った。</p><p>玄関の戸が、内側から開いた。</p><p>白い丸が、三つ転がり出てきた。</p><p class="q">「ぴ！」</p><p class="q">「ぴぴ！」</p><p class="q">「おきゃくさま！」</p><p class="q">「……増えた」</p><p class="q">「たくさんいるよ」</p><div class="sep" aria-hidden="true">◇</div><p>冴月さんが、玄関の戸を閉めた。</p><p>風の音が、急に遠くなった。</p><p>古い木の匂いがした。薪が燃える匂いと、どこかで鍋が煮えている匂い。奥の方から、だれかが弾いているのか、ピアノの音が、途切れ途切れに流れてきていた。</p><p class="q">「靴、そのままでいいよ」</p><p>小鳥たちが、自分の体より大きな手拭いを引きずるようにして運んできた。</p><p class="q">「ぴ！」</p><p>受け取る。乾いていて、温かかった。</p><p class="q">「……ありがとう」</p><p>小鳥が、固まった。</p><p class="q">「…………」</p><p class="q">「ほめられた！」</p><p>三羽まとめて、土間の上で騒ぎ出した。羽をばたつかせて、くるくる回る。</p><p class="q">「はいはい。仕事して」</p><p class="q">「りょうかい！」</p><p>小鳥たちが、ぱっと散っていった。</p><p class="q">「歩けると言ったけど、あとで身体の具合も確認しよう」</p><p class="q">「医者がいるんですか」</p><p>一拍、あった。</p><p class="q">「いる」</p><p>言い方が、わずかに重かった。その重さが何なのかは、分からなかった。</p><p class="q">「……まあ、今夜は呼ばずに済むといいね」</p><p>廊下の奥から、声がした。</p><p class="q">「冴月」</p><p class="q">「はい」</p><p class="q">「食えるのか、そいつ」</p><p>厨房の暖簾をくぐって、大きな人が顔を出していた。</p><p>ぶっきらぼうな声だった。腕まくりした太い腕と、前掛け。こちらを見る目は、客を見る目というより、食材の具合を確かめるような目だった。</p><p class="q">「……たぶん」</p><p class="q">「また『たぶん』か」</p><p class="q">「僕と同じところ拾ったね」</p><p class="q">「胃が動くなら先に食わせる」</p><p class="q">「……え」</p><p class="q">「キミの飯だ。来い」</p><p>大きな人は、それだけ言って、暖簾の奥へ戻っていった。</p><p class="q">「台所守の雪鬼」</p><p class="q">「……台所守」</p><p class="q">「怖く見えるけど、ご飯はおいしい」</p><p>厨房の奥から、声だけが返ってきた。</p><p class="q">「聞こえてるぞ」</p><h3 class="sec" id="prologue-4"><span class="num">四</span><span class="name">空席</span></h3><p>温かい汁物。炊きたての米。焼いた魚。小鉢が二つ。</p><p>派手なものは、何もなかった。</p><p class="q">「全部食えとは言わねえ」</p><p>雪鬼さんが、こちらの前に器を並べながら言った。</p><p class="q">「食える分だけ食え」</p><p class="q">「ありがとうございます」</p><p class="q">「礼は食ってからでいい」</p><p>汁を、一口すすった。</p><p>温かかった。</p><p>それだけで、妙に泣きそうになった。</p><p>泣かなかった。黙って、次の一口をすすった。それから米を。魚を。一つずつ。食べるということの順番を、一つずつ思い出すように。</p><div class="sep" aria-hidden="true">◇</div><p>食堂の奥に、一つだけ空いた席があった。</p><p>窓に近い、一番奥の席。他の椅子とは違う、古い椅子。卓へきちんと寄せられていて、その前にだけ、小さな白い器が一つ置かれている。</p><p>中身は、空だった。</p><p>見ていると、雪鬼さんの声がした。</p><p class="q">「……そこはいい」</p><p class="q">「？」</p><p class="q">「冷めるぞ」</p><p>それだけだった。怒っている声ではなかった。でも、それ以上見るものではないと、教えてくれる声だった。</p><p>器に、目を戻した。</p><div class="sep" aria-hidden="true">◇</div><p>食堂の入口から、小さな足音が来た。</p><p>子どもだった。</p><p>白い髪の、小さな子。水色の前掛けをして、自分の肩幅より少し広い盆を、両手で水平に持っている。盆の上で、湯気の立つ湯飲みが一つ。歩き方が静かで、中身がほとんど揺れていなかった。</p><p class="q">「食後に飲めそうなら」</p><p>湯飲みが、こちらの前に置かれた。甘い匂いがした。</p><p class="q">「ありがとうございます」</p><p class="q">「どういたしまして」</p><p>子どもは、少し考える顔をした。</p><p class="q">「……甘いものが苦手だったら、言ってください。次から変えるので」</p><p class="q">「次？」</p><p>子どもが、小首を傾げた。</p><p class="q">「今夜だけで帰るのは、難しいでしょう？」</p><p class="q">「……ああ」</p><p>窓の外は、もう真っ暗だった。雪は止んでいない。</p><p class="q">「でも、ずっといる必要もない」</p><p>穏やかな声だった。子どもの声なのに、妙に落ち着いている。</p><p class="q">「朝になってから考えればいいと思います」</p><p>後ろから、冴月さんの声がした。</p><p class="q">「雪音。客室、空いてる？」</p><p class="q">「東の二番が暖まっています」</p><p>梁の上から、雪鳥の声が降ってきた。</p><p class="q">「ふとん！　ぴ！」</p><p class="q">「完璧」</p><p>湯飲みを両手で包んだ。熱すぎず、ぬるすぎず。手のひらに、ちょうどよかった。</p><h3 class="sec" id="prologue-5"><span class="num">五</span><span class="name">満月対応</span></h3><p>東の二番は、ちゃんと暖まっていた。</p><p>布団が一組。小さなランプ。窓の外では、雪が音もなく降り続けている。</p><p>雪鳥が一羽、湯たんぽを押しながら入ってきた。布団の足元にそれを潜り込ませて、満足そうに一つ頷く。</p><p class="q">「ぴ」</p><p class="q">「ありがとう」</p><p class="q">「ぴぴ」</p><p>雪鳥が、部屋を出ようとした。</p><p>そのときだった。</p><p>遠くで、笛が鳴った。</p><p>一音。長く、細く。雪の夜を縫うように。</p><p>雪鳥が、止まった。</p><p class="q">「？」</p><p>もう一度。笛。</p><p>雪鳥の羽が、まん丸に逆立った。</p><p class="q">「……ぴ」</p><p>今度の「ぴ」は、低かった。</p><p>廊下で、急に足音が増えた。一つではなく、いくつも。小さなものも、大きなものも。</p><p class="q">「全館、満月対応」</p><p>冴月さんの声だった。</p><p>雪鳥が、姿勢を正した。</p><p class="q">「りょうかい！」</p><p>そのまま、部屋を飛び出していった。</p><p class="q">「……満月？」</p><div class="sep" aria-hidden="true">◇</div><p>廊下に出た。</p><p>さっきまで宿だった場所が、数十秒で、まるで別の場所になっていた。</p><p>雪鳥たちが、猫のような速さで廊下を行き来する。窓が、一つずつ閉まっていく。札が運ばれていく。誰も走っていないのに、すべてが速かった。</p><p class="q">「西、へいさ！」</p><p class="q">「ぴ！」</p><p class="q">「客室、さん！」</p><p>梁の上で、一羽が顔を上げた。</p><p class="q">「東側結界、現在異常ありません。客室二番の来訪者が、廊下へ出ています」</p><p>低く、よく通る声だった。落ち着いた、大人の声。</p><p>固まった。</p><p class="q">「……喋れるんだ」</p><p class="q">「ぴ？」</p><p>冴月さんが、廊下の角から現れた。</p><p>手には、細い杖。さっきまでは持っていなかったものだ。</p><p class="q">「部屋に戻って」</p><p>穏やかな声だった。ただ、さっきより半音ほど低かった。</p><p class="q">「何が起きてるんですか」</p><p>外で、何か大きなものが、雪を踏む音がした。</p><p>重い音だった。足の裏から、床を通して伝わってくるような。</p><p>冴月さんが、窓を見た。</p><p class="q">「満月には、山が少し騒ぐ」</p><p class="q">「……少し？」</p><p>窓の外に、大きな白い影が見えた。</p><p>冴月さんは、それを見て、ひとつ息を吐いた。</p><p class="q">「……今日は、少し多いね」</p><h3 class="sec" id="prologue-6"><span class="num">六</span><span class="name">おいで</span></h3><p>窓のすぐ外に、それはいた。</p><p>白かった。人のようでもあり、狐のようでもある。輪郭が、雪と夜の境で滲んでいる。顔があるはずの場所が、うまく見えなかった。</p><p>それなのに、目が合ったと分かった。</p><p>音が、一瞬、消えた。</p><p>雪鳥たちの声も。廊下の足音も。外の重い音も。全部が、厚い硝子の向こうへ遠ざかったように。</p><p>白い影が、手を上げた。</p><p>襲いかかる手ではなかった。</p><p>こちらへ来い、と、招く手だった。</p><p class="q">「――おいで」</p><p>声だったのか、頭の中で鳴ったのか、分からなかった。</p><p>暖かい声だった。それが、一番怖かった。</p><p>足が、前へ出ようとした。</p><p>出なかった。足の裏が床に貼りついたように、動かなかった。進むことも、逃げることもできずに、廊下の隅で、ただ震えていた。</p><p>冴月さんが、こちらを見た。</p><p class="q">「うん。そのままでいい」</p><p>命令と呼ぶには、穏やかすぎる声だった。でも、その声で、消えていた音が少しずつ戻ってきた。</p><p>冴月さんが、袖から札を一枚抜いて、窓へ投げた。</p><p>札が、硝子に貼りつく。淡い光。</p><p>白い影の輪郭が、崩れた。</p><p>雪に戻るように、音もなく。最後まで、手を上げたままだった。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「冴月！」</p><p>外から、雪鬼さんの声がした。</p><p class="q">「いま行く」</p><p>冴月さんは返事をしてから、こちらを見た。</p><p class="q">「ここからは、一つだけ覚えて」</p><p class="q">「……何を」</p><p class="q">「あれは、倒すために追わなくていい」</p><p>冴月さんが、窓の外を見た。</p><p class="q">「朝まで、こっちへ来させなければいい」</p><div class="sep" aria-hidden="true">◇</div><p>その後のことは、あまりよく覚えていない。</p><p>雪鳥に言われた窓を閉めた。渡された札を、指されたところへ置いた。小さな白いものが廊下に入り込もうとするたびに、雪鳥が叫び、冴月さんが淡い光を投げて、それは雪へ戻った。</p><p>誰も、何も倒さなかった。</p><p>ただ、来させなかった。</p><div class="sep" aria-hidden="true">◇</div><p>最後の影が雪へ崩れたとき、遠くで、また笛が鳴った。</p><p>窓の向こう。屋根の上。</p><p>赤い影があった。</p><p>顔は見えない。笛を口に当てて、月を背にして、ただそこに立っていた。</p><p>冴月さんが、屋根を見上げた。</p><p>珍しく、眉のあたりに嫌そうな色が浮かんでいた。</p><p class="q">「……また君か」</p><p>赤い影が、笑ったように見えた。</p><p>それから、雪が、強くなった。</p><h3 class="sec" id="prologue-7"><span class="num">七</span><span class="name">渡り廊下の灯り</span></h3><p>東の二番に戻っても、眠れなかった。</p><p>布団に潜って、目を閉じる。瞼の裏で、窓の外の白い影が、まだ手を上げていた。</p><p>おいで、と。</p><p>冷や汗と共に、夢の狭間から起き上がった。</p><div class="sep" aria-hidden="true">◇</div><p>廊下の灯りは、半分だけ落とされていた。</p><p>札の貼られた窓が、静かに並んでいる。さっきまであれほど行き来していた雪鳥たちの姿は、もうどこにもなかった。</p><p>廊下の突き当たりに、戸が一枚あった。</p><p>その隙間から、細く灯りが漏れていた。</p><p>戸を開けると、屋根のある、長い渡り廊下だった。両側は林。柱と柱の間から、雪が斜めに吹き込んでくる。板の上に、自分の足跡だけが残っていく。</p><p>その先に、灯りがひとつ。</p><p>足音がした。こちらではない方から。</p><p class="q">「お。迷子？」</p><p>灯りの方から、背の高い人が歩いてきた。</p><p>白い髪だった。雪音さんの白とも、雪の白とも違う、少し癖のある、ふわりとした白。眼鏡。白衣の袖を肘までまくっていて、腕は雪焼けしたような、健康な色をしている。片手に、黒いマグカップ。</p><p>頭の上で、白い耳が一度だけ動いた。</p><p class="q">「……違います」</p><p class="q">「じゃ、見学者？」</p><p class="q">「それも違います」</p><p class="q">「ふうん」</p><p>その人は、こちらの顔を少しだけ覗き込んだ。</p><p>ほんの一瞬だった。それなのに、顔色も、震えの残った指先も、裸足に近いような靴の履き方も、全部見られた気がした。</p><p class="q">「満月の夜に、廊下で震えてた顔だ」</p><p class="q">「……見てたんですか」</p><p class="q">「見てなくても分かるよ。今夜は、みんなそういう顔になる」</p><p>それから、林の方へ目をやった。</p><p class="q">「俺は、仕事から戻ったら終わってた。……間に合わなかったな」</p><p>悔しそうな声ではなかった。ただ、間に合いたかった人の声だった。</p><p>声は軽かった。軽いのに、こちらへ投げてくるのではなく、手の届くところへそっと置いていくような話し方だった。</p><p class="q">「あの。お名前を聞いてもいいですか」</p><p class="q">「鏡。ここでは、教授って呼ばれてる」</p><p class="q">「ここの、教授……」</p><p class="q">「いや？」</p><p>一拍、あった。</p><p class="q">「職場は別。ここには下宿してるだけ」</p><p>それから、こちらを見た。</p><p class="q">「それで、迷子じゃない人の名前は？」</p><p>名前を名乗った。</p><p>鏡さんは、それを一度だけ口の中で転がしてから、呼んだ。冴月さんとは違う呼び方だった。字を確かめるのではなく、もう覚えた、という呼び方。</p><p class="q">「寝られないんだろ」</p><p class="q">「……はい」</p><p class="q">「ココアでも飲む？」</p><div class="sep" aria-hidden="true">◇</div><p>渡り廊下の先は、離れになっていた。</p><p>思っていたより、暖かかった。本棚。古い長椅子。小さな炉の上で、鉄瓶が湯気を立てている。部屋の真ん中に、場違いなほど立派な椅子が一脚あって、白と黒の縞の毛皮が、背もたれに無造作に掛けてあった。</p><p class="q">「座って。そこの長椅子」</p><p>渡された湯飲みから、甘い匂いがした。</p><p class="q">「客用。俺のは黒いの」</p><p>両手で包む。熱すぎず、ぬるすぎず。</p><p class="q">「……あったかい」</p><p class="q">「だろ」</p><p>鏡さんは自分の椅子に腰を下ろした。椅子が、低く軋む。椅子の脇から、白地に黒い縞の尾が床へ垂れて、ゆっくりと一度だけ揺れた。</p><p class="q">「さっきの、窓の外のやつ。怖かった？」</p><p class="q">「……怖かったです」</p><p class="q">「うん。それでいい」</p><p>鏡さんは、マグの縁越しにこちらを見た。</p><p class="q">「怖いって分かる人は、ちゃんと帰れる」</p><p>どういう意味か、訊こうとした。</p><p>先に、瞼が重くなった。ココアの甘さが、胸の真ん中まで降りてきていた。</p><p class="q">「あー、そこで寝ないでね。風邪ひく」</p><p class="q">「……すみません」</p><p class="q">「謝んなくていいよ。戻ろ。送る」</p><div class="sep" aria-hidden="true">◇</div><p>渡り廊下を、二人分の足跡が戻っていった。</p><p>鏡さんは、こちらの歩く速さに合わせていた。急かさない。追い越さない。半歩うしろを、ただついてくる。</p><p>東の二番の前で、鏡さんは止まった。</p><p class="q">「ここまで」</p><p class="q">「……おやすみなさい」</p><p class="q">「おやすみ。また明日」</p><p>また明日、と言われた。</p><p>明日があることを、当たり前みたいに。</p><div class="sep" aria-hidden="true">◇</div><p>布団に戻ってから、一度だけ、窓の方へ顔を向けた。</p><p>渡り廊下の先の灯りが、まだ点いていた。</p><p>雪の向こうで、小さく、消えずに。</p><p>それを見ているうちに、眠っていた。</p><p class="card">『雪の真宵家』</p></template>
<template id="t-ch1" data-label="第一章" data-title="空席のある宿"><header class="chap-head"><p class="chap-label">第一章</p><h2 class="chap-title">空席のある宿</h2></header><h3 class="sec" id="ch1-1"><span class="num">一</span><span class="name">朝の足跡</span></h3><p>夢ではなかった。</p><p>窓の外に残った、巨大な足跡が証拠だった。</p><p>朝の光の中で、雪の上の凹みは思っていたよりずっと大きかった。昨夜、窓の外で見たものは本当にそこにいたのだ。</p><div class="sep" aria-hidden="true">◇</div><p>食堂は、湯気で白く霞んでいた。</p><p>昨夜の騒ぎが嘘のように、平常の朝だった。鍋の音。器の音。廊下の向こうで、雪鳥たちが布団を干している。</p><p class="q">「座れ」</p><p>雪鬼さんが、鍋の前から言った。</p><p class="q">「おはようございます」</p><p class="q">「おん」</p><p>味噌汁が出てきた。</p><p class="q">「昨日より顔色がマシだな」</p><p class="q">「昨日のあれは、よくあるんですか」</p><p class="q">「満月ならな」</p><p class="q">「よくあるんだ……」</p><p class="q">「キミ、飯食うときくらい怪異の話やめられねえのか」</p><p class="q">「気になります」</p><p class="q">「腹の方が先だ」</p><p>黙って、椀を持った。</p><p>食べながら、また食堂の奥を見た。</p><p>例の席。今朝は、白い器が置かれていなかった。椅子だけが、卓へきちんと寄せられている。</p><p class="q">「……あの席、誰の席ですか」</p><p>雪鬼さんの手が、ふと止まった。</p><p class="q">「昔の名残だ」</p><p class="q">「誰の？」</p><p class="q">「朝飯食ってから聞け」</p><p>それ以上は、答えてくれなかった。鍋の前で、雪鬼さんの手がまた動き出す。</p><div class="sep" aria-hidden="true">◇</div><p>冴月さんが、食堂に入ってきた。</p><p>手には帳面。</p><p class="q">「おはよう」</p><p class="q">「おはようございます」</p><p class="q">「道は、昼には確認できると思う」</p><p>黙った。</p><p>帰れるかもしれない。それを喜べばいいのか、残念がればいいのか、分からなかった。</p><p class="q">「急いで帰る？」</p><p class="q">「……まだ、分かりません」</p><p>冴月さんは、少しも困った顔をしなかった。</p><p class="q">「それなら、分かるまで休めばいい」</p><p>それから、帳面を閉じて、こちらを見た。</p><p class="q">「ただし」</p><p class="q">「……はい」</p><p class="q">「帰れるようになったかどうかは、毎日伝える」</p><p>毎日。</p><p>それは、引き止める言葉ではなかった。追い出す言葉でもなかった。</p><p class="q">「ここにいることと、帰れないことは別だから」</p><p>冴月さんはそう言って、雪鬼さんから汁の椀を受け取った。いつもの朝の、いつもの一杯を受け取るような手つきで。</p><div class="sep" aria-hidden="true">◇</div><p>食堂の入口を、白い頭が通り過ぎようとした。</p><p class="q">「鏡。弁当」</p><p class="q">「んー、ありがと」</p><p>雪鬼さんが、竹の皮の包みを放った。白衣ではなく外套を着た鏡さんが、振り向きもせずに片手でそれを受け取る。</p><p>それから、こちらに気づいた。</p><p class="q">「お。ちゃんと寝た顔だ」</p><p class="q">「分かるんですか」</p><p class="q">「分かる。ココア、効いたろ」</p><p>それだけ言って、鏡さんは玄関の方へ歩いていった。仕事へ行くのだろう。職場は別、と言っていた。</p><p>一度も立ち止まらなかった。</p><p>それなのに、通り過ぎるあいだに、椀の中身の減り方まで見ていかれた気がした。</p><h3 class="sec" id="ch1-2"><span class="num">二</span><span class="name">白飛びの写真</span></h3><p>食堂の横に、小さな喫茶席があった。</p><p>暗い色の木材と西洋硝子でできた、穏やかな場所だった。窓から朝の光が斜めに差し込んで、磨かれたカウンターの上に、細長い光の帯を作っている。</p><p>カウンターの向こうで、雪音さんが踏み台に乗っていた。そうしてようやく、天板の上に肩が出る。</p><p class="q">「昨日は眠れましたか」</p><p class="q">「思ったより」</p><p class="q">「それならよかった」</p><p>雪音さんは、棚に並んだ缶を小さな指で一つずつ指した。</p><p class="q">「珈琲と、紅茶と、お茶があります。おまかせもできます」</p><p>少し迷った。</p><p>選ぶということが、どこか面倒だった。山に来る前は、ずっとそうだった。でも、缶の一つから漂ってくる香りに、身体がそちらへ傾いた。</p><p class="q">「……紅茶を」</p><p class="q">「はい」</p><p>雪音さんは前掛けのポケットから小さな札を出して、《紅茶》と書いた。小さくて、きちんとした字だった。</p><p>その札を、注文の束の横ではなく、カウンターの端の小さな箱にしまった。捨てる札では、ないらしい。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「雪音さんは、ずっとここに？」</p><p>雪音さんは、茶葉を量る手を止めずに、少し考えた。</p><p class="q">「『ずっと』という言葉は、ここでは少し難しいですね」</p><p class="q">「そうなんですか」</p><p class="q">「僕が知らない頃の真宵家もあります」</p><p>雪音さんの目が、一瞬だけ、喫茶席の奥へ向いた。</p><p class="q">「でも、僕が知っている真宵家は、だいたいこんな感じです」</p><p>そのとき、廊下から雪鳥が一羽、盆を運んできた。自分の体より大きな盆だった。敷居を越えようとして、つまずきかける。</p><p>盆が、傾いた。</p><p>雪音さんが、踏み台の上から手を伸ばして、その端を支えた。</p><p class="q">「……だいたい」</p><p>ふんわりとした勘定に、笑ってしまった。</p><div class="sep" aria-hidden="true">◇</div><p>紅茶を待つ間、棚を眺めていた。</p><p>缶と缶の間に、古い写真立てが一つあった。</p><p>写っているものは、ほとんど見えなかった。雪で白く飛んで、人がいるのかどうかも分からない。</p><p>ただ、真ん中に。</p><p>白い影が舞っていた。</p><p class="q">「……この写真」</p><p>雪音さんが、紅茶を置きながら、同じ写真を見た。</p><p class="q">「昔の満月ですね」</p><p class="q">「昨日みたいな？」</p><p>雪音さんは、しばらく黙って、写真を見ていた。</p><p class="q">「……たぶん、少し違います」</p><p class="q">「何が？」</p><p class="q">「僕は、その頃を知らないから」</p><p>それ以上は、言わなかった。</p><p>紅茶は温かかった。白い影の写真の前で、湯気が細く立ち昇っていた。</p><h3 class="sec" id="ch1-3"><span class="num">三</span><span class="name">処置室</span></h3><p>午後、雪鳥が一羽、客室に飛び込んできた。</p><p class="q">「しんさつ！」</p><p class="q">「……誰の？」</p><p class="q">「あなた！」</p><p class="q">「流暢だね」</p><p class="q">「ぴ！」</p><div class="sep" aria-hidden="true">◇</div><p>処置室は、館の奥にあった。</p><p>扉の前に、古い柱が一本立っている。その前を通り過ぎて、雪鳥が扉を嘴で叩いた。</p><p>青白い、静かな部屋だった。</p><p>館の他の部屋のような、木の温かさがない。棚に並んだ瓶。紙の束。清潔な布。冷たい光が、高い窓から入っている。</p><p>その光の中に、誰かがいた。</p><p>長い髪だった。月の光を布にしたような、淡い白。前髪が顔にかかり、その奥で銀色の丸い眼鏡が光っている。白衣のような長い外套。黒い手袋。</p><p>大きな身体だった。椅子に座っていても、それが分かる。</p><p class="q">「座れ」</p><p>低く、よく通る声だった。</p><p>言われたとおり、向かいの椅子に座った。</p><p class="q">「……月白さん？」</p><p class="q">「誰から聞いた」</p><p class="q">「雪鳥から」</p><p>眼鏡の奥の目が、扉の近くの雪鳥へ向いた。</p><p class="q">「ぴ」</p><p class="q">「……まあいい」</p><div class="sep" aria-hidden="true">◇</div><p>診察は、静かだった。</p><p>手首に、手袋越しの指が触れる。脈を数えている。それから、目を覗き込まれる。手のひらを返されて、指先の色を見られる。</p><p>一つずつ。急がずに。</p><p class="q">「昨日、呼ばれたか」</p><p class="q">「……何に？」</p><p class="q">「外のものに」</p><p>窓の外の白い影を、思い出した。招く手。暖かい声。</p><p class="q">「……『おいで』って」</p><p>手首に触れていた指が、一瞬だけ止まった。</p><p class="q">「行ったか」</p><p class="q">「行ってません」</p><p class="q">「そうか」</p><p>指が、また動き始めた。</p><p class="q">「あれは、何なんですか」</p><p class="q">「今説明しても、間違って覚える」</p><p class="q">「……教えてくれない？」</p><p class="q">「教えないんじゃない」</p><p>眼鏡越しに、こちらを見た。淡い氷の色の目だった。</p><p class="q">「まだ俺にも、君が何を見たのか分からない」</p><p>沈黙があった。</p><p>分からないことを、分からないと言う人だった。それが、妙に安心できた。</p><div class="sep" aria-hidden="true">◇</div><p>月白さんが、記録に何かを書き込んだ。角の立った、整った字だった。</p><p class="q">「怪異汚染なし。凍傷なし。睡眠不足」</p><p class="q">「……最後だけ、普通ですね」</p><p class="q">「普通の異常が、一番多い」</p><p>少し、間があった。</p><p class="q">「帰ろうと思えば、帰れる」</p><p class="q">「……まだ帰りたくないと言ったら？」</p><p class="q">「好きにしろ」</p><p>少し、意外だった。医者なら、早く帰れと言うのだろうと思っていた。</p><p class="q">「ただし」</p><p class="q">「……また『ただし』」</p><p class="q">「この家にいる理由と、外へ帰れない理由を混ぜるな」</p><p>黙った。</p><p>言い返せなかった。混ぜていないと、言い切れなかったから。</p><p>月白さんが、扉を開けた。</p><p class="q">「診察は終わりだ」</p><div class="sep" aria-hidden="true">◇</div><p>扉を出たところに、あの古い柱があった。</p><p>低いところに、細い傷があった。小刀で横に引いたような、短い線。その少し上にもう一本。また少し上に。子どもの背丈を測った跡だと、すぐに分かった。線の横には、日付らしい小さな刻み。</p><p>この家にも、子どもが育ったことがあるのだ。</p><p>振り返ると、月白さんも、その柱を見ていた。</p><p>一瞬だけ。</p><p class="q">「……行け」</p><p>扉が、閉まった。</p><p>廊下で待っていた雪鳥が、足元で胸を張った。</p><p class="q">「つきしろせんせい、です！」</p><p class="q">「……先生」</p><p class="q">「しんさつするひと！」</p><p>月白先生。</p><p>口の中で、一度だけ言ってみた。さっきの冷たい部屋の、冷たくない声に、その呼び方は思いのほか似合っている気がした。</p><h3 class="sec" id="ch1-4"><span class="num">四</span><span class="name">覚えている場所</span></h3><p>次の日の午後、雪鳥が小さな札をくわえてきた。</p><p class="q mark">《自由時間》</p><p>それだけが、小さくきちんとした字で書いてあった。</p><p>裏返すと、小さな字で続きがあった。帳場。厨房。喫茶席。館内。どこで過ごしてもいい、ということらしい。</p><p>冴月さんは帳場で宿帳を整理しているはずだった。雪鬼さんは、きっと厨房で野菜を切っている。館の奥には、まだ開けたことのない扉がいくつもある。</p><p>足が向いたのは、喫茶席だった。</p><div class="sep" aria-hidden="true">◇</div><p>扉を開けると、雪音さんが踏み台の上から顔を上げた。</p><p class="q">「昨日と同じでいいですか」</p><p>昨日。紅茶。</p><p>言っていないのに、覚えていてくれた。カウンターの端の、小さな箱。捨てる札ではないと思った、あの札の行き先。</p><p>たった一日で、ここは自分のことを一つ覚えている場所になっていた。</p><p class="q">「……はい。同じで」</p><div class="sep" aria-hidden="true">◇</div><p>窓際の席で、紅茶を飲んでいた。</p><p>雪音さんは、カウンターの向こうで湯飲みを一つずつ拭いている。</p><p>訊くべきかどうか、しばらく迷っていた。</p><p>今朝、食堂で聞いた名前があった。</p><p>雪鳥が一羽、例の席の前で小さな白い器をつついて、「せつこのぶん！」と言ったのだ。雪鬼さんが黙ってその雪鳥をつまみ上げて、厨房へ連れていった。怒ってはいなかった。ただ、その名前を、その場に残さないようにしただけに見えた。</p><p class="q">「……セツコって、誰ですか」</p><p>雪音さんの手が、ほんの一瞬止まった。</p><p>拭いていた湯飲みを、そっと棚に戻す。</p><p class="q">「……どこで聞きました？」</p><p class="q">「食堂で」</p><p class="q">「そうですか」</p><p>雪音さんは、少し考えていた。踏み台の上で、前掛けの裾を小さな手でつまんでいる。</p><p class="q">「僕から話すより、知っている人から聞いた方がいいと思います」</p><p class="q">「……知っている人？」</p><p class="q">「冴月さんとか」</p><p>それから、声を落とした。</p><p class="q">「……月白先生とか」</p><p>月白先生。</p><p>処置室の扉の前の、あの柱を思い出した。一瞬だけ、そちらを見ていた眼鏡の横顔も。</p><p>雪音さんは、それ以上は言わなかった。言わないことを、隠しているという感じではなかった。自分が話すべきことと、話すべきではないことを、ただ、きちんと分けているように見えた。</p><p class="q">「……ありがとう」</p><p class="q">「いえ」</p><p>雪音さんは、もう一度湯飲みを手に取った。</p><p>紅茶は、昨日と同じ味がした。</p><h3 class="sec" id="ch1-5"><span class="num">五</span><span class="name">足跡の向き</span></h3><p>その次の朝、冴月さんは食堂に入ってくるなり、こちらの席の前で足を止めた。</p><p class="q">「下山路、一応通れるようになった」</p><p>毎日伝える、とこの人は言った。そのとおりにしているだけの声だった。</p><p>黙った。</p><p class="q">「帰りたいなら、送るよ」</p><p>汁の椀を持ったまま、しばらく、湯気を見ていた。</p><p>帰れる。</p><p>そう分かった途端、喉の奥で何かが引っかかった。</p><p>帰りたくないのではなかった。でも、ここで言いかけて、でも言い切ってもらえなかったものが、いくつかあった。空いた席のこと。誰かの名前のこと。処置室の扉の前の、柱のこと。</p><p>それを残したまま、山を下りる姿が、うまく思い描けなかった。</p><p class="q">「……もう少しだけ、いてもいいですか」</p><p class="q">「もちろん」</p><p>即答だった。</p><p class="q">「……理由、訊かないんですね」</p><p class="q">「宿泊延長に、立派な理由が必要かな？」</p><p class="q">「普通は」</p><p class="q">「じゃあ、うちは普通じゃないんだろうね」</p><p>冴月さんは口の端で笑って、それから笑いを引っ込めた。</p><p class="q">「でも、帰りたくなったら言って」</p><div class="sep" aria-hidden="true">◇</div><p>午後、雪の中庭に出た。</p><p>踏み固められた道が、屋根から離れたところをぐるりと回っている。その道の脇で、雪鳥が一羽、雪を掘っていた。</p><p>小さな足で、一生懸命に。雪が後ろへ、ぱっぱと飛んでいく。</p><p class="q">「何してるの」</p><p class="q">「さがしもの！」</p><p class="q">「何を？」</p><p class="q">「わすれた！」</p><p>…………。</p><p class="q">「ぴ！」</p><p>笑ってしまった。雪鳥は、言い終えると、また雪を掘り始めた。忘れたものを、忘れたまま探している。それでも、掘る手を止めない。</p><p>そのときだった。</p><p>遠くで、笛の音がした。</p><p>一音だけ。すぐに、消えた。</p><p>振り返った。</p><p>誰もいなかった。林の縁にも、屋根の上にも。赤い影は、どこにも見えない。</p><p>ただ、雪の上に足跡があった。</p><p>人の足跡ではなかった。小さくて、細長くて、点々と一列に並んでいる。狐の足跡にも見えた。</p><p>さっきまで、そこには何もなかったはずだった。</p><p>足跡の続く先を、目で辿った。</p><p>山の方ではなかった。</p><p>林の方から、雪庭を横切って、真宵家の方へ。</p><p>帰る場所を、そこしか知らないように。</p><p>雪鳥が、掘るのをやめて、その足跡を黙って見つめていた。</p><h3 class="sec" id="ch1-6"><span class="num">六</span><span class="name">亡くなったとは</span></h3><p>夜の食堂は、暖かかった。</p><p>最初の夜と同じように、汁物と、炊きたての米と、焼いた魚。でも、もう泣きそうにはならなかった。一口ずつ思い出さなくても、箸が勝手に次の器へ向かう。</p><p class="q">「キミ、そこ取れ」</p><p>雪鬼さんが、鍋の前から言った。</p><p>考えるより先に、手が動いていた。卓の端の塩の壷を、雪鬼さんの手元へ渡す。</p><p>雪鬼さんは、何も言わずに受け取った。</p><p>雪音さんが、湯飲みを運びながら、小さく笑った。</p><p class="q">「慣れましたね」</p><p class="q">「……何に？」</p><p class="q">「ここに」</p><p>一拍、あった。</p><p>その言葉が嬉しいのか、少し怖いのか、すぐには分からなかった。</p><div class="sep" aria-hidden="true">◇</div><p>食堂の奥を見た。</p><p>例の席は、今夜も空いていた。</p><p>椅子は卓へ寄せられていて、床は拭かれていて、誰も座っていない。</p><p class="q">「……誰も、座らないんですね」</p><p>冴月さんが、食堂に入ってくるところだった。足を止めたので、聞こえていたのかもしれない。</p><p class="q">「……あの席」</p><p>冴月さんへ向けて、もう一度、言った。</p><p>冴月さんが、席を見た。</p><p>長い間は、取らなかった。</p><p class="q">「そうだね」</p><p class="q">「セツコさんの席？」</p><p>食堂の音が、一段低くなった。</p><p>雪鬼さんは、手を止めなかった。鍋の前で、同じ速さで汁を注ぎ続けている。雪音さんは、盆を持ったまま、目を伏せた。梁の上の雪鳥だけが、不思議そうに首を傾げていた。</p><p class="q">「……どこで名前を？」</p><p class="q">「何度か、聞きました」</p><p>冴月さんは、少し考えた。</p><p class="q">「昔、ここにいた人だよ」</p><p>昔、ここにいた。</p><p>宿帳が何十年分もありそうなこの宿で、昔という言葉がどれくらい昔を指すのか、分からなかった。</p><p class="q">「……亡くなった？」</p><p>一拍。</p><p>冴月さんは、答えなかった。</p><p>答える前に、館のどこかで、小さな鈴が鳴った。</p><p>雪鳥が一羽、食堂に飛び込んできた。</p><p class="q">「支配人」</p><p>全員が、その鳥を見た。低く、よく通る声だった。</p><p class="q">「処置室より連絡です。月白さまが、満月夜行の記録を確認したいと」</p><p class="q">「分かった。すぐ行く」</p><p class="q">「……月白先生が？」</p><p>冴月さんは、立ち上がりかけて、こちらを見た。</p><p class="q">「セツコの話は」</p><p>少し間があった。</p><p class="q">「今度、ちゃんとしよう」</p><p>冴月さんは、食堂を出ていった。</p><div class="sep" aria-hidden="true">◇</div><p>空いた席を、見ていた。</p><p>昔、ここにいた人。</p><p>冴月さんは、そう言った。</p><p>亡くなったとは、言わなかった。</p><div class="sep" aria-hidden="true">◇</div><p>空席の上の壁に、小さな古い写真が掛かっていた。</p><p>喫茶席の棚の写真より、いくらかよく見えた。</p><p>満月。</p><p>雪の上で踊る、白い影。</p><p>その隣に、笛を吹く、赤い影。</p><p>最初の夜、屋根の上にいた赤い影を思い出した。</p><p>窓の外で、雪が、音もなく降りつづけていた。</p><div class="sep" aria-hidden="true">◇</div><p>部屋へ戻る途中、渡り廊下の戸の隙間に、灯りが見えた。</p><p>足が、そちらへ向いた。</p><p>離れの戸を叩くと、内側から「開いてるよー」と声がした。鏡さんは立派な椅子の上で胡坐をかいて、膝に薄い機械を載せていた。</p><p class="q">「こんばんは、今日はどうだった？」</p><p class="q">「……セツコさんって、誰なんでしょう」</p><p>鏡さんの尾が、一度だけ止まった。</p><p>ほんの一瞬だった。すぐにまた、床の上でゆっくり揺れはじめる。</p><p class="q">「それはね、俺が言うと怒られるやつ」</p><p class="q">「知ってるんですね」</p><p class="q">「知ってる」</p><p>否定しなかった。誤魔化しもしなかった。知っていて、言わない。そう決めている人の、平らな声だった。</p><p class="q">「冴月さんは、今度ちゃんと話すって」</p><p class="q">「なら、ちゃんと話してくれるよ。あの人、約束は守るから」</p><p>鏡さんは機械を閉じて、立ち上がった。鉄瓶の方へ歩いていく。</p><p class="q">「代わりに、ココアは出せる」</p><p>湯気の向こうで、鏡さんが笑った。</p><p>客用の湯飲みは、最初の夜と同じものだった。最初の夜と同じ場所に置かれた。長椅子の、こちらが座った側。手を伸ばせばすぐ届くところに。</p><p>離れの窓の外で、林の枝が雪の重さに小さくしなっていた。</p><p class="end">（第一章　終）</p><div class="sep" aria-hidden="true">◇</div><p>暗い場所で、歌声がした。</p><p class="q">「欲というものはね」</p><p>白い蛇の影が、一瞬だけ雪の上をよぎった。</p><p class="q">「なくせば楽になる、というほど」</p><p>間。</p><p class="q">「簡単なものではないんだよ」</p></template>
<template id="t-ch2" data-label="第二章" data-title="欲のある人"><header class="chap-head"><p class="chap-label">第二章</p><h2 class="chap-title">欲のある人</h2></header><h3 class="sec" id="ch2-1"><span class="num">一</span><span class="name">帳場の札</span></h3><p>朝の帳場は、紙の匂いがした。</p><p>玄関に近いその小さな部屋には、いつも乾いた靴が揃えてある。自分の靴も、そこにあった。着いた夜には雪を吸って重くなっていたはずの靴が、今は形を取り戻して、つま先をこちらへ向けている。</p><p>戸の向こうで、誰かが雪をかいていた。</p><p>ざく、ざく、と一定の音。</p><p>そこに紙をめくる乾いた音が重なる。</p><p>冴月さんが、机に地図を広げていた。</p><p>一応通れると言われた日の夜に、また雪が降った。それから二日、帳場の札は伏せられたままだった。</p><p>その札が、表になっている。</p><p class="q mark">《下山路・通行可》</p><p class="q">「今日は送れるよ」</p><p>冴月さんは顔を上げて、それだけ言った。誰かに言い聞かせるような調子でも、引き止めるような調子でもなかった。天気を告げるのと同じ声だった。</p><p>札を見る。見ているうちに、文字の意味が少し遅れて届いた。</p><p class="q">「靴も乾いた。荷物に仲居が入っていないことも確認した」</p><p class="q">「ぴ」</p><p>足元の荷物の口から、白くて丸いものが半分だけ顔を出していた。黒い目が、当然のようにこちらを見上げている。</p><p class="q">「そこまで」</p><p class="q">「大事だからね」</p><p>冴月さんは雪鳥を両手ですくい上げて床へ降ろし、荷物の口を結び直した。それから、その荷物を机のこちら側へ置いた。</p><p>帳場の奥へは、戻さなかった。</p><p>その置き方が、この人の答えなのだと思った。帰るなら、手を伸ばせばいい。冴月さんは、ここへ留める理由を一つも作らない。</p><p>帰れる。</p><p>そう分かった途端、喉の奥で何かが引っかかった。帰りたくない、とはっきり口にできるほどのものではない。けれど、今日の自分が荷物を背負って山道を下りていく姿も、うまく思い描けなかった。</p><p>道はある。靴もある。足りないのはたぶん、歩き出すための何かだった。</p><p class="q">「……帰る準備をしながら、考えたいです」</p><p>言ってから、我ながらずいぶん中途半端な答えだと思った。</p><p>冴月さんは笑わなかった。首もかしげなかった。わずかに顔を傾けて、引き出しの位置を確かめるように、渡したばかりの荷物を見た。</p><p class="q">「じゃあ、荷物はここに置こうか。持っていきたくなったら、すぐ取れる」</p><p class="q">「邪魔になりませんか」</p><p class="q">「出発する人の荷物だからね。帳場の仕事のうち」</p><p>出発する人。</p><p>まだ出発していないのに、冴月さんはそう呼んだ。ここにいることと、いつか出ていくことが、帳場の上では何の矛盾もなく並んでいるらしかった。</p><p>それで少し、息が楽になった。決めていないことを、決めていないまま置いておける場所が、この世にはあるらしい。</p><p>そのとき、戸の外から短い歌声が聞こえた。</p><p>言葉までは聞き取れない。雪に吸われて、旋律の端だけが届く。雪かきの音が止んだ。</p><p>帳場の隅や棚の上にいた雪鳥たちが、いっせいに玄関を振り返った。</p><p class="q">「おかえり！」</p><h3 class="sec" id="ch2-2"><span class="num">二</span><span class="name">傘</span></h3><p>玄関の内側には、雪を払うための小さな土間がある。</p><p>開いた戸から、冷気と一緒に黒紫の衣の裾が入ってきた。長い黒髪。その内側に、淡い灰桜の色が差している。雪明かりを背にしているせいか、輪郭が淡く滲んで見えた。</p><p>その人は傘を閉じ、軽く一度振って雪を落とした。</p><p class="q">「ただいま。留守の間に、客が増えたね」</p><p class="q">「うちのお客さんだよ。こちらは夜澄」</p><p>冴月さんが、こちらと戸口を順に示す。</p><p class="q">「よろしく、お客様」</p><p class="q">「よろしくお願いします」</p><p>声は低く、穏やかだった。古い本を読み上げるような、角の取れた話し方をする。</p><p>雪鳥が一羽、閉じた傘の先へ飛びついた。引っ張る。傘のほうが、ずっと大きい。</p><p class="q">「それは私が持とう」</p><p class="q">「おしごと！」</p><p class="q">「では、一緒に」</p><p>夜澄さんが重さを支え、雪鳥が先端を運ぶ。ほとんど夜澄さんが持っているのに、雪鳥は胸を張っている。通り道を空けようと、少し横へ避けた。</p><p>その横を通り過ぎるとき、夜澄さんがこちらを見た。</p><p class="q">「帰りたくなかったのかい」</p><p>一拍、言葉が遅れた。</p><p class="q">「……どうして」</p><p class="q">「欲というものはね、口より少し正直なんだよ」</p><p>責める響きはなかった。歌の一節を口ずさむように、ただそう言った。</p><p>言い返そうとして、言葉が見つからなかった。否定するには、思い当たることが多すぎた。雪山へ来た理由。さっき、帳場に荷物を置いたままにしたこと。</p><p class="q">「……そうかもしれません」</p><p class="q">「そう。今は、ということにしておこうか」</p><p>夜澄さんは、それ以上踏み込まなかった。踏み込まないと決めている人の止まり方だった。</p><p class="q">「私にも分からない欲はある。人のものも、自分のものもね」</p><p class="q">「全部分かるわけじゃないんですね」</p><p class="q">「全部分かっていたら、もう少し上手に暮らしているかもしれないね」</p><p>そう言って傘立てへ傘を入れようとし、隣の傘を倒した。</p><p>からん、と乾いた音が土間に響く。</p><p class="q">「まず傘からだね」</p><p>冴月さんが言った。</p><p class="q">「そうらしい」</p><p>夜澄さんは真面目な顔で傘を拾い直した。雪鳥がそれを手伝おうとして、もう一本倒した。</p><p>笑ってしまった。欲を読むという人が、傘立て一つに手こずっている。それを見たら、さっきの一言でこわばっていた肩が、いつの間にか降りていた。</p><h3 class="sec" id="ch2-3"><span class="num">三</span><span class="name">湯気の食堂</span></h3><p>翌朝の食堂は、湯気で白く霞んでいた。</p><p>長い卓に、白い器が伏せて並んでいる。厨房の方から、お玉が鍋の縁に当たる小さな音がした。出汁の匂いと、炊きたての米の匂いが混ざっている。</p><p>席に着くと、雪鬼さんが鍋の前から顔だけこちらへ向けた。</p><p class="q">「キミ、今日はどっちだ」</p><p class="q">「何がですか」</p><p class="q">「飯。汁。両方でもいい」</p><p>どっち、と聞かれて、自分の腹に聞いてみる。山に来る前の朝は、何を食べたか覚えていないことが多かった。選ぶこと自体が、少しずつ面倒になっていたのだと思う。</p><p>今は、温かい汁の匂いの方に、身体が傾いていた。</p><p class="q">「ご飯を少しで、汁物を多めに」</p><p class="q">「おん。足りなきゃ言え」</p><p>それだけで、雪鬼さんは大きな碗に汁をなみなみと注いだ。茶碗のご飯は、言ったとおり少ない。多い方も少ない方も、ちょうど頼んだだけだった。</p><p class="q">「……ぴったりですね」</p><p class="q">「聞いたからな」</p><p>一口すする。喉から胸、胸から腹へ、温かさが順に降りていく。</p><p>そこへ、雪音さんが盆を持ってきた。水色の前掛け。歩き方が精密で、湯飲みの中身がほとんど揺れない。</p><p class="q">「前と同じものにしますか」</p><p>覚えていてくれたのだと思った。最初の朝に頼んだものを、この人はそのまま持っていてくれている。</p><p>それが嬉しかった。嬉しかったのに、今朝の身体は別のものを欲しがっていた。</p><p class="q">「……今日は、お湯を」</p><p class="q">「分かりました」</p><p>雪音さんは迎えるように頷き、前掛けのポケットから注文の札を出した。裏返して、《お湯》と書き足す。</p><p>表に書かれた前の飲み物の文字は、消さなかった。</p><p class="q">「覚えてくれていたのに」</p><p>思わず口から出た。謝るような響きになったのが、自分でも分かった。</p><p>雪音さんは札から顔を上げて、少し不思議そうに首を傾げた。</p><p class="q">「覚えていたら、変えちゃいけませんか？」</p><p>……そう言われると、どこにもそんな決まりはなかった。</p><p class="q">「……そんなことないですね」</p><p class="q">「よかった」</p><p>雪音さんは目だけで笑って、湯を注ぎに戻っていった。</p><p>札の裏表に、前の欲しいものと今日の欲しいものが、並んで残る。どちらかが間違いだったわけではない。そう書いてある気がした。</p><p>湯を待つ間、食堂の奥へ目をやった。</p><p>例の席。</p><p>窓に近い、一番奥の席には今日も誰もいない。椅子が一脚、きちんと卓へ寄せてあるだけだ。</p><p>雪鬼さんが鍋を離れ、布巾を持ってそちらへ歩いていった。椅子を一度引いて、床を拭く。椅子を戻す。座面の向きまで、もとのとおりに。</p><p class="q">「そこも毎日？」</p><p>雪鬼さんは布巾を畳みながら、こちらを見ずに答えた。</p><p class="q">「埃は、座る奴がいるかどうかなんか気にしない」</p><p>それ以上は何も言わず、鍋の前へ戻っていく。</p><p>座る人がいない席なのか。いつか座る人の席なのか。その一言だけでは、どちらとも読めなかった。ただ、拭かれた床だけが、朝の光で少し濡れて光っていた。</p><p>運ばれてきた湯は、熱すぎず、ぬるすぎず、手のひらにちょうどよかった。</p><h3 class="sec" id="ch2-4"><span class="num">四</span><span class="name">布巾の落ちる席</span></h3><p>その日の午後は、何も予定がなかった。</p><p>客室の窓辺に座っていれば、たぶん誰も来ない。回廊へ行けば、夜澄さんがいるはずだった。どちらも悪くなかった。けれど今日は、誰かと話したいわけでも、完全に一人になりたいわけでもなかった。</p><p>足が向かったのは、食堂の横の小さな喫茶席だった。</p><p>昼の仕込みが終わったあとらしく、客はいない。雪音さんがカウンターの内側で、洗った布巾を一枚ずつ畳んでいた。角と角を合わせ、指で折り目を押さえる。それを何度も、同じ速さで繰り返している。</p><p class="q">「注文は、後でも大丈夫ですよ」</p><p>こちらが何か言うより先に、雪音さんはそう言った。</p><p class="q">「少し、誰かのいるところにいたくて」</p><p>口にしてみると、ずいぶん子どもっぽい理由に聞こえた。</p><p>雪音さんは布巾を畳む手を止めなかった。止めないまま、顔だけで窓際の席を示した。</p><p class="q">「じゃあ、そこ。僕が布巾を落としたら教えてください」</p><p class="q">「落とす予定なんですか」</p><p class="q">「予定にはないです」</p><p>指された席に座る。カウンターから近すぎず、遠すぎない。窓の外では、雪が音もなく横に流れていた。</p><p>話しかけられない。話しかけなくてもいい。それでも、布の擦れる音が規則正しく続いていて、その音があるだけで、ここが空っぽの部屋ではないと分かる。</p><p>こういう場所を、ずいぶん長いこと探していなかった気がした。誰かに気を遣わずにすむ距離で、誰かが普通に働いている場所。</p><p>しばらくして、扉が開いた。</p><p class="q">「雪音、ココアの粉、まだある？」</p><p>鏡さんだった。今日は仕事が休みなのか、白衣ではなく、厚手の黒い上着を着ている。</p><p class="q">「棚の二段目です」</p><p class="q">「さんきゅ」</p><p>鏡さんは粉の缶を受け取ってから、窓際のこちらに気づいた。</p><p class="q">「お」</p><p>それだけだった。</p><p>話しかけてはこなかった。いちばん奥の、こちらから一番遠い卓に座って、分厚い本を開いた。本の向こうで、白い耳だけが時々動いた。</p><p>近くに来ない。でも、帰りもしない。</p><p>いくつ畳んだだろう。</p><p>雪音さんの膝の上から、一枚、音もなく布巾が滑り落ちた。</p><p class="q">「あ」</p><p>雪音さんの手が止まる。足元を見て、それからこちらを見た。</p><p class="q">「……助かりました」</p><p>照れたように、でも律儀に頭を下げる。それがおかしくて、少し笑った。</p><p>奥の卓で、鏡さんが本から顔を上げた。こちらを見て、それから雪音さんを見て、何も言わずに本へ戻った。口の端が、少しだけ上がっていた。</p><p class="q">「予定には、なかったんですよね」</p><p class="q">「なかったです」</p><p>拾い上げた布巾を、雪音さんは畳み直しの山の方へ置いた。落としたものを何事もなかったように混ぜないところが、この人らしい気がした。</p><p>そのあと、注文はしなかった。雪音さんも、それについては何も言わなかった。布巾の山が一つでき、二つでき、窓の外の雪の流れが、少しずつ斜めになっていった。</p><p>席を立ったとき、奥の卓の鏡さんも、本を閉じた。</p><p>こちらが扉を出るまで、その本は、もう開かれなかった。</p><p>その夜、記録の紙には一行だけ書いた。</p><p class="q mark">《人のいる席で過ごした。》</p><h3 class="sec" id="ch2-5"><span class="num">五</span><span class="name">古い歌</span></h3><p>雪庭に面した廊下の戸は、開いていた。</p><p>夕方の光が、庭の雪を薄明に染めている。戸の脇の釘には、誰のものでもない外套が掛けてあった。遠くで、誰かが雪を払っている。</p><p class="q">「庭の灯りまでなら歩けるよ。どうする？」</p><p>後ろから来た冴月さんが、外套を指した。</p><p>少し迷ってから、外套を借りた。袖を通すと、家の中の温度がまだ布に残っている。靴が雪を踏む。きゅっ、と小さく鳴る。</p><p>灯りのそばで立ち止まると、庭の端から歌が聞こえた。</p><p>昨日、帳場で聞いた声だ。今度は、言葉が聞き取れた。</p><p class="q">「月の夜、狐は舞い、紅鸞が笛を吹く」</p><p>短い旋律だった。最後の音だけが、行き先を探すように庭の空気に残って、それから雪へ溶けた。</p><p>庭の端、小さな石灯籠の影に、夜澄さんが立っていた。</p><p class="q">「その歌、ここで作ったんですか」</p><p class="q">「ここで覚えた音に、私が言葉を置いた」</p><p class="q">「続きを聞いても？」</p><p>夜澄さんは口を開きかけた。</p><p>閉じた。</p><p class="q">「……今日は、ここまでにしよう」</p><p class="q">「忘れた？」</p><p class="q">「覚えているから、少し難しい」</p><p>その声は穏やかなままだった。けれど忘れた人の顔ではなかった。歌の続きがどこかにあって、そこへ手を伸ばせば届くことも分かっていて、それでも伸ばさない人の顔だった。</p><p>何か言おうとして、足元に目が落ちた。</p><p>雪が、ほんの少し沈んでいる。</p><p>小さな獣の足跡だった。林の方から、点々と続いている。その先は――館へ向かっていた。</p><p>見ているうちに、最後の足跡の先に、もう一つ、雪が小さく凹んだ。誰もいないのに。</p><p>近づこうとするより先に、夜澄さんが一歩下がった。</p><p>足跡の進みが、遅くなった。次の凹みが、なかなか生まれない。</p><p class="q">「何かしました？」</p><p class="q">「近くにいると、少し吸ってしまうんだ」</p><p class="q">「何を」</p><p class="q">「今は、動きたがる力を。長く傍にいれば、それだけでは済まない」</p><p>夜澄さんは、もう一歩離れた。</p><p>しばらくして、足跡がまた、ゆっくり進み始めた。館の方へ。誰かに呼ばれているように。あるいは、帰るところをそこしか知らないように。</p><p>夜澄さんはそれを止めなかった。止めないために、離れたのだと分かった。</p><p class="q">「君も寒くなる前に戻るといい」</p><p class="q">「夜澄さんは」</p><p class="q">「一曲、歌ってから」</p><p>今度は、言葉のない歌だった。</p><p>白い息が、夜気へほどけていく。旋律はさっきと同じところで始まり、さっきと同じところで途切れた。その先へは行かない。行かないまま、最初からもう一度、静かに歌い直している。</p><p>館の灯りの方へ戻りながら、一度だけ振り返った。</p><p>夜澄さんの立っている場所と、足跡の続く場所のあいだに、雪だけが広く空いていた。</p><h3 class="sec" id="ch2-6"><span class="num">六</span><span class="name">今日の記録</span></h3><p>夕食の片付けが始まった食堂で、最後の碗を置いたときだった。</p><p>冴月さんが、こちらの席へ来た。手には何も持っていない。帳場以外でこの人が手ぶらでいるのを、初めて見た気がした。</p><p class="q">「この前の話。待たせているね」</p><p class="q">「セツコさん？」</p><p class="q">「うん。あの席を使っていた、この家の大事な人」</p><p>冴月さんは、食堂の奥を見なかった。見なくてもどの席のことか、二人とも分かっていた。</p><p class="q">「今は、どこに？」</p><p>冴月さんは、空席ではなく、こちらを見た。</p><p class="q">「話せるところを、今確認している。身体に関わる話もあるから」</p><p class="q">「勝手に話せない」</p><p class="q">「そう。君のことも、他のお客さんには勝手に話さない」</p><p>そこまで言うと、冴月さんは卓に残っていた皿を一枚、受け取った。片付けのついでのような仕草だった。</p><p class="q">「でも、忘れてはいないよ。約束したからね」</p><p>死んだ人の話をする声ではなかった。かといって、すぐに帰ってくる人の話をする声でもなかった。そのどちらでもないところに、誰かがいる。分かったのは、それだけだった。</p><div class="sep" aria-hidden="true">◇</div><p>客室に戻ると、文机の上に《今日の記録》の紙が置いてあった。</p><p>この宿に来てから、毎晩置かれている紙だ。書けと言われたことは一度もない。書かなくても、翌朝には新しい紙に替わっている。</p><p>筆を取って、少し考えた。</p><p>帰ったら。</p><p>その言葉を、頭の中で初めて最後まで言ってみた気がした。ここへ来る前は、「帰ったら」の先にはいつも、やらなければならないことが列になって並んでいた。道が分からなくなるほど、長い列だった。</p><p>大きな決心は、まだない。</p><p>帰ったら。</p><p>まず、湯を沸かそうか。</p><p>あの朝、雪音さんが運んできた湯の温度を思い出す。熱すぎず、ぬるすぎず。あれを自分で、自分の台所で、自分のために沸かすところを。</p><p>紙に小さく書いた。</p><p class="q mark">《湯》</p><p>それだけだった。それだけで、いい気がした。</p><p>戸の外で、小さな足音が止まる。</p><p class="q">「おやすみ！」</p><p class="q">「おやすみ」</p><p>足音が遠ざかる。廊下の灯りが一つ、落とされる気配がした。</p><p>けれど、帳場の灯りは残っていた。閉じた戸の隙間から、うっすらと蜂蜜色に延びている。あの灯りの下で、出発する人の荷物が今夜も待っている。</p><p>廊下の突き当たりにも、灯りが一つあった。渡り廊下の戸の隙間から漏れる、細い灯り。</p><p>そういえば、と思った。</p><p>あの灯りが消えているのを、この宿に来てから、一度も見たことがない。</p><p>灯りを落とす。</p><p>眠りに落ちる少し手前、遠くで、笛が一音だけ鳴った。</p><p>すぐに、途切れた。</p><p class="end">（第二章　終）</p></template>
<template id="t-ch3" data-label="第三章" data-title="赤い笛吹き"><header class="chap-head"><p class="chap-label">第三章</p><h2 class="chap-title">赤い笛吹き</h2></header><h3 class="sec" id="ch3-1"><span class="num">一</span><span class="name">小鉢</span></h3><p>厨房の入口には、冷ましている小鉢が並んでいた。</p><p>煮物の湯気が、ふわりと天井へ昇っていく。昼どきの館は、朝より音が多い。皿が重なる音。水を切る音。廊下を渡る雪鳥の、小さな足音。</p><p>その中に、赤い袖が一つ混ざっていた。</p><p>袖は、音もなく小鉢へ伸びた。指先が器の縁に届く少し手前で、雪鬼さんが皿を奥へ引いた。</p><p class="q">「惜しかった」</p><p class="q">「見えてんだよ」</p><p>雪鬼さんはこちらを振り向きもしなかった。</p><p class="q">「あ」</p><p>声が出たのは、こちらの方だった。</p><p>最初の満月の夜。屋根の上にいた、赤い影。窓越しに一度だけ見たその輪郭を、身体の方が先に覚えていた。</p><p>その影が今は、厨房の椅子を後ろ向きにして、背もたれに顔を乗せて座っている。</p><p class="q">「あ。窓のひと」</p><p>目が、嬉しそうに細くなる。久しぶりに知り合いを見つけたような顔だった。</p><p class="q">「あなた、満月の騒ぎを起こした人ですよね」</p><p class="q">「起こしてないよ？」</p><p class="q">「笛を吹いたら起きた」</p><p class="q">「うん」</p><p class="q">「起こしてるじゃないですか」</p><p class="q">「起きただけだよ」</p><p>言葉に詰まった。</p><p>ごまかしている声ではなかった。雪が降ったから庭が白い、というのと同じ調子で、この人はそう言った。だからこそ、どこから問い詰めればいいのか分からなくなる。</p><p>その間に、雪鬼さんが小鉢を一つ、赤い袖の前へ置いた。</p><p>それから、箸。</p><p class="q">「椅子、戻せ」</p><p class="q">「はあい」</p><p>椅子がくるりと回って、正しい向きになる。赤い袖の人は手を合わせてから、ごく普通に食べ始めた。箸の持ち方がきれいだった。</p><p class="q">「……ここで食べるんですね」</p><p class="q">「おいしいからね」</p><p>満月の夜に館中を守りの構えに変えた相手が、冷ましていた煮物を嬉しそうに口に運んでいる。それを出したのが、あの夜いちばん前に立っていた雪鬼さんだというのが、もっと分からなかった。</p><p>雪鬼さんは鍋の前に戻りながら、背中越しに言った。</p><p class="q">「飯を出すのと、話が済んだのは別だ」</p><p>箸が、一度だけ止まった。</p><p>すぐにまた動き出す。さっきより、ひと呼吸ぶんゆっくりと。</p><p>その一拍を、見なかったことにはできなかった。</p><h3 class="sec" id="ch3-2"><span class="num">二</span><span class="name">干し札</span></h3><p>午後の玄関前では、雪鳥たちが小さな札を干していた。</p><p>軒から軒へ紐が渡され、そこに木の札がいくつも吊るされている。雪鳥が一枚くわえては飛び上がり、紐に引っ掛けて、また降りてくる。乾いた木が触れ合って、からからと軽い音を立てた。</p><p>その一羽を、赤い袖が追いかけていた。</p><p>雪鳥は短い足で、ととと、と逃げる。追う方は雪の上でも足音が軽い。その気になればすぐ捕まえられそうなのに、必ず一歩だけ手前で止まっている。</p><p class="q">「ねえ、もう一回その歩き方して」</p><p class="q">「おしごと！」</p><p class="q">「ぼくも手伝う」</p><p class="q">「結構です」</p><p>やけに流暢だった。</p><p>いつもは「ぴ」と「おしごと」くらいしか言わないのに、断るときだけは、すっかり整った言葉が出てくるらしい。思わず口元を押さえた。</p><p>戸口に、冴月さんが立っていた。</p><p class="q">「ヒノエ」</p><p>呼ばれた名前で、赤い袖が止まる。大きな声ではなかった。それでも、雪庭の空気が一度、きちんと畳まれたような気がした。</p><p class="q">「手伝うなら、その紐の向こう側」</p><p class="q">「遊ぶなら？」</p><p class="q">「仕事が終わってからね」</p><p>ヒノエは唇を尖らせてから、紐の端を持った。持った途端、雪鳥がその手元を見上げて、満足そうに一つ頷いた。</p><p>冴月さんの隣へ、そっと寄った。</p><p class="q">「追い返さないんですか」</p><p class="q">「話がある相手を、どこへ？」</p><p>冴月さんは、本当に不思議そうにこちらを見た。追い返すという選択肢が、始めからこの人の手元にはないらしかった。</p><p class="q">「危なくないですか」</p><p class="q">「危なくなることはある。だから、笛の置き場所も決める」</p><p>それを聞いていたのか、ヒノエが懐から笛を出した。</p><p>紅い房のついた龍笛だった。あの夜、雪の向こうで鳴っていた音が、こんなに小さなものから出ていたとは思わなかった。</p><p>冴月さんが、玄関脇の棚を指す。ヒノエはそこへ歩いていって、自分で笛を置いた。</p><p class="q">「今、吹いてないのに」</p><p class="q">「今、干してるからね」</p><p>冴月さんの答えは、それだけだった。理屈が通っているのかいないのか、よく分からない。でもヒノエはそれ以上言い返さなかった。</p><p>雪鳥が一羽、札をくわえてヒノエの足元へ走ってくる。それを、赤い袖の手のひらへぐいと押しつけた。</p><p class="q">「そこ！」</p><p>指されたのは、紐のいちばん高いところだった。</p><p class="q">「……おしごとだね」</p><p>ヒノエは、誰にも聞こえないくらいの声でそう言って、背伸びをした。</p><h3 class="sec" id="ch3-3"><span class="num">三</span><span class="name">半円</span></h3><p>次の日の朝も、冴月さんは食堂でこちらの席の前に足を止めた。</p><p class="q">「今日も、道は通れるよ」</p><p>毎日伝える、という約束は、こういう一言で続いていた。</p><div class="sep" aria-hidden="true">◇</div><p>その日の午後、雪庭には踏み固めた道が一本できていた。</p><p>屋根から離れたところに灯りが立ててあって、道はその内側をぐるりと回っている。外套を羽織って、その道を歩いていた。</p><p class="q">「あなた、暇？」</p><p>灯りの向こうで、ヒノエが手を振っていた。</p><p>昨日の小鉢と、干し札のことが頭をかすめた。満月の夜のことも。どれか一つだけでこの相手を決めることは、まだできなかった。</p><p class="q">「……少しなら」</p><p>ヒノエは、ぱっと隣へ並んだ。</p><p>それから、こちらの歩幅に合わせようとして、二歩だけ細かく足を運んだ。雪の上に、小さな鳥の足跡のような印が並ぶ。</p><p class="q">「こう？」</p><p class="q">「普通でいいです」</p><p class="q">「そっか」</p><p>次の一歩から、ヒノエは自分の歩幅に戻った。それでも、こちらより前には出なかった。</p><p>灯りを一つ過ぎたところで、ヒノエが足を止めた。</p><p>庭の真ん中を見ている。そこには何もない。雪が平らに積もって、夕方の光を静かに返しているだけだ。</p><p class="q">「もっと楽しかったんだけどな」</p><p class="q">「雪遊び？」</p><p class="q">「踊るひとがいたからね」</p><p class="q">「今は、いない？」</p><p>ヒノエは答えなかった。</p><p>代わりに、雪の上で足先を動かしはじめた。すっと滑らせて、弧を描く。踊りの一歩目のような、迷いのない動きだった。小さな円になるはずの線が、半分まで来たところで。</p><p>止まった。</p><p class="q">「ここで一回、待つんだよ」</p><p class="q">「誰を」</p><p>ヒノエは足元を見たまま、少し間を置いた。</p><p class="q">「……次の足」</p><p>雪の上に、半円だけが残っている。</p><p>その続きを描くべき何かが、当然そこにあるはずだというように。待つことが、踊りの一部であるように。</p><p>足を踏み入れる気にはなれなかった。かといって、その場を離れる気にもなれなかった。隣に立ったまま、半円と、その先の何もない雪を見ていた。</p><p>ヒノエが、ちらりとこちらを見た。</p><p class="q">「見るのも、まあ、ありだね」</p><p>それから足を引いて、半円の外へ出た。消そうとはしなかった。</p><p>帰り道、灯りの内側を歩きながら、一度だけ振り返った。</p><p>夕暮れの庭の真ん中で、半分だけの円が、誰かの来るのをまだ待っていた。</p><h3 class="sec" id="ch3-4"><span class="num">四</span><span class="name">一音</span></h3><p>夕方の見回りに、一緒に来ないかと誘われた。</p><p>冴月さんは札の束を袖に入れ、雪鳥が二羽、その肩に乗っている。庭の端の低い木立を、灯りをひとつずつ確かめながら歩く。その後ろを、少し遅れてヒノエがついてきていた。</p><p>雪に、浅いくぼみがあった。</p><p>最初はただの吹き溜まりに見えた。それが、ゆっくりと形を変えた。小さな獣の輪郭。耳。丸めた背。前に館へ向かっていた足跡の主かもしれないと思った。</p><p>そのとき、後ろで笛が鳴った。</p><p>短い音だった。鳥の声と間違えそうなほどの。</p><p>その音を聞いた途端、小さな獣の足が伸びた。</p><p>骨が長くなるような伸び方ではなかった。雪の影が、必要より遠くまで引き延ばされたような、落ち着かない形だった。満月の夜に窓の外で見たものと、似ていた。</p><p>立ち止まる。</p><p class="q">「……また」</p><p>振り返ると、ヒノエが笛を口から離したところだった。</p><p class="q">「一音だけだよ」</p><p>冴月さんはその声に返事をせず、袖から札を一枚抜いた。獣の進む先と、こちらの足元の間。そこへ、静かに置く。</p><p class="q">「一音分、膨らんだ」</p><p>笛はもう止まっている。それなのに、影はまだ動いていた。長すぎる足で、雪を搔き、その場で体を揺らしている。音が消えても、膨らんだ形はすぐには戻らないらしかった。</p><p class="q">「こっちの灯りを見て」</p><p>冴月さんの声は、いつもと変わらなかった。</p><p class="q">「手伝えるなら、札を一枚」</p><p>差し出された札を受け取る。薄い木の札で、思ったより軽かった。</p><p class="q">「どこに」</p><p class="q">「その灯りの根元。近づかなくていい」</p><p>指されたのは、獣から十分に離れた場所だった。足元を見ながら歩いて、指定されたところに札を差し込む。雪に沈む手応えが、かすかにあった。</p><p>輪郭の揺れが、狭くなった。</p><p>冴月さんが二枚目を反対側へ置く。雪鳥がその根元を踏み固める。</p><p>影が、縮んでいった。</p><p>長すぎた足が、引き戻されるように折り畳まれる。小さな獣の形になり、それからその形もほどけて、雪のくぼみには小さな足跡だけが残った。</p><p>足跡は館の方へ二歩進んでいた。</p><p>それから、林の方へ逸れていた。</p><p>口を開く前に、一度息を整えた。</p><p class="q">「出していないとしても、こうなったのは音のせいですよね」</p><p>ヒノエは笛を握り直した。</p><p class="q">「……うん。大きくなったのは」</p><p>この人が言葉の途中で詰まるのを、初めて聞いた。</p><p class="q">「止めれば元通り、というわけでもない」</p><p>冴月さんが札の向きを直しながら言った。</p><p>ヒノエは、足跡の消えた林の方を見ていた。</p><p class="q">「前は、次があったんだ」</p><p class="q">「曲の？」</p><p class="q">「音だけじゃない方」</p><p>それ以上は続かなかった。</p><p>冴月さんが、ヒノエの前に手のひらを差し出した。取り上げるのではなく、ただ差し出した。</p><p>ヒノエは少し迷って、それから自分で笛をその手に置いた。</p><p class="q">「今日の見回り、最後まで一緒に来て」</p><p class="q">「怒ってる？」</p><p class="q">「うん。片付けてもらうよ」</p><p>怒っている、とこの人が言うのは、少し意外だった。声は、さっき札を渡してくれたときと同じだったから。怒りは、声ではなく、片付けの分量で表すものらしい。</p><p>ヒノエが、さっきの騒ぎで倒れていた灯りを起こしに行く。</p><p>雪鳥が、その根元を踏み固めた。一羽では足りないと分かると、もう一羽が飛んできて、二羽で並んで踏んだ。</p><h3 class="sec" id="ch3-5"><span class="num">五</span><span class="name">記録棚</span></h3><p>帳場の奥には、天井まで届く棚があった。</p><p>紐で綴じた帳簿。丸めた図面。色の褪せた紙の束。冴月さんが棚の戸を開けると、古い紙と墨の匂いが、ゆっくりと帳場に広がった。</p><p class="q">「温泉の古い図を探してる。日付の札を揃えてもらえる？」</p><p class="q">「読んでもいいものですか」</p><p class="q">「こっちの修繕と催しの帳簿はね。宿帳は僕がやる」</p><p>そう言って冴月さんは、客の名前が並んでいるであろう帳簿を何冊か、別の机へ移した。表紙も開かず、抱えて運ぶだけ。その中にはたぶん、こちらの名前もあるのだろうと思った。</p><p>残された帳簿を、日付の順に並べていく。</p><p>新しいものから手に取った。細く、まっすぐな字だった。</p><p class="q mark">《満月・魔障鎮静》</p><p class="q mark">《東窓、札交換》</p><p class="q mark">《夜食、汁物追加》</p><p>最初の夜のことだと、すぐに分かった。館中の窓が閉められたあの夜が、帳簿の上では三行に収まっている。</p><p class="q">「食事のことも書くんですね」</p><p class="q">「足りなくなる前にね」</p><p>冴月さんは宿帳から顔を上げないまま答えた。</p><p>遡っていく。月ごとに、同じ満月の印がある。そのたびに《魔障鎮静》。札の交換、窓の修繕。何年も前から、この家は月に一度、館を守ってきたらしい。</p><p>しばらく遡ったところで、紙の色が変わった。</p><p>一段古い帳簿だった。表紙が柔らかくなって、指の形に凹んでいる。字も違う。丸みがあって、ところどころで走っている。書いている人が、書くことより先の何かを待ちきれなかったような字だった。</p><p>同じ満月の印。</p><p>その下に、一文字。</p><p class="q mark">《宴》</p><p>指が、そこで止まった。</p><p class="q mark">《舞扇、修繕》 《笛、返却》 《湯籠、三つ不足》</p><p>もう一度、上の一文字へ戻る。</p><p>読み間違いではなかった。前の月も、その前の月も。満月の印の下には必ず、その字があった。</p><p class="q">「……宴？」</p><p>声に出しても、帳場の空気は変わらなかった。冴月さんの筆の音だけが、一拍止まった。</p><p>読まないほうがいいとも、読んではいけないとも言われなかった。だから、次の紙の束へ手を伸ばした。</p><p>折り込まれた図面が一枚、帳簿の間から滑り出た。</p><p>広げると、この館の見取り図だった。本館から、雪の上に三本の道が伸びている。それぞれの先に、小さな湯屋。</p><p class="q mark">《鎮め湯》 《戻り湯》 《迎え湯》</p><p>最後の道だけ、一度引かれた線の上に、別の墨で線が引き直されていた。</p><p class="q">「今、通れないところですよね」</p><p>閉ざされた温泉への道のことは、最初の数日で気づいていた。木戸に鍵の掛かった、雪に埋もれた道。</p><p>冴月さんが筆を置いて、図を覗き込んだ。</p><p class="q">「そう。それを、通れるようにしたい」</p><div class="sep" aria-hidden="true">◇</div><p>三つを並べ終えてから、新しい満月の記録と古い満月の記録を、横に並べてみた。</p><p class="q mark">《魔障鎮静》。《宴》。</p><p>並べると、字の形まで違って見えた。</p><p class="q">「同じ日なのに、全然違う」</p><p class="q">「同じ満月でも、過ごし方が変わった」</p><p>冴月さんは、それだけ言った。いつ、とも、なぜ、とも言わなかった。</p><p>見回りのときのヒノエの声が、耳の奥でもう一度鳴った。前は、次があったんだ。</p><p class="q">「ヒノエが言っていた、次の音と関係がありますか」</p><p>冴月さんは、古い帳簿の方を見た。その丸い字を、しばらく見ていた。</p><p class="q">「あると思う。ヒノエが何を待っているのかは、本人にも聞かないとね」</p><p class="q">「全部、知っているんじゃ」</p><p class="q">「一緒にいたことと、全部分かることは違うよ」</p><p>冴月さんはそう言って、古い帳簿を閉じなかった。棚へも戻さなかった。</p><p>開いたまま、机の上に残しておいた。</p><h3 class="sec" id="ch3-6"><span class="num">六</span><span class="name">二つの見出し</span></h3><p>その夜、食堂の壁の写真を、初めて長いあいだ見た。</p><p>最初の朝からそこに掛かっていた写真だ。例の空席の、ちょうど斜め上。色が少し褪せて、雪の白と月の白がほとんど区別できなくなっている。</p><p>白く舞う影。</p><p>赤い笛吹き。</p><p>初めて見たときは、戦っている写真だと思った。満月の夜の後だったから。窓の外で手を招いていたものと、屋根の上の赤い影を、そのままこの写真に重ねていた。</p><p>そう見えるところを、探していたのかもしれない。</p><p>今見ると、白い影の袖は、誰かを打つためではなく、弧を描くために伸ばされていた。赤い笛吹きは、笛を吹きながら、その弧の先を見ている。</p><p>雪の上の半円を思い出した。</p><p class="q">「何か分かりました？」</p><p>雪音さんが、湯飲みを下げに来ていた。盆を持ったまま、隣で同じ写真を見上げる。</p><p class="q">「昔は、宴だったって」</p><p class="q">「……そうですか」</p><p class="q">「聞いたことは？」</p><p class="q">「あります。でも、写真の中の夜を、見たことはなくて」</p><p>雪音さんは写真から目を離さなかった。その横顔は、話にだけ聞いた場所を思い浮かべている人のものだった。</p><p>二人で、しばらく黙って写真を見た。</p><p class="q">「楽しそうですね」</p><p>雪音さんが言った。</p><p>すぐには頷けなかった。頷いてしまえば、最初の夜に見た窓の外のものも、引き延ばされた足の影も、全部この写真の影にしてしまう気がした。でも、楽しそうではない、とも言えなかった。</p><p class="q">「今の夜も、こうなればいいのに」</p><p>口から出たのは、それだった。</p><p>こと、と卓に湯飲みが置かれた。二人の、ちょうど間に。</p><p>雪鬼さんだった。いつ来たのか分からなかった。</p><p class="q">「湯を直すなら、朝からだ。今日は飲んで寝ろ」</p><p class="q">「まだ手伝うとは」</p><p class="q">「見てるだけでも腹は減る」</p><p>それだけ言って、雪鬼さんは厨房へ戻っていった。湯飲みからは、生姜の匂いがした。</p><p>雪音さんが小さく笑った。</p><p class="q">「雪鬼さんの中では、もう手伝うことになってますね」</p><p class="q">「……そうみたいですね」</p><p>両手で湯飲みを包む。熱すぎない。手のひらに、ちょうどいい。</p><div class="sep" aria-hidden="true">◇</div><p>客室の文机には、今夜も《今日の記録》の紙が置いてあった。</p><p>筆を取って、二つの見出しを並べて書いた。</p><p class="q mark">《魔障鎮静》</p><p class="q mark">《宴》</p><p>あいだには、まだ何も書かなかった。</p><p>書けることがないのではなかった。その二行のあいだに、誰かの次の足や、曲の続きや、温泉への道が、まだ折り込まれたままになっている気がした。無理に広げれば、大事なことを見落としてしまいそうで。</p><div class="sep" aria-hidden="true">◇</div><p>紙を持ったまま、渡り廊下を渡った。</p><p>離れの戸は、叩く前に内側から開いた。足音で分かったのかもしれない。</p><p class="q">「お。夜更かし」</p><p>鏡さんは、こちらの手元の紙を見た。見せるつもりで持ってきたのかどうか、自分でもよく分からなかった。</p><p class="q">「二つの見出し？」</p><p class="q">「どっちも、本当みたいで」</p><p>鏡さんは紙を覗き込んで、しばらく黙っていた。眼鏡の奥の目が、二つの見出しのあいだの空白を、行ったり来たりした。</p><p class="q">「どっちも本当なら、両方書いとけばいいよ」</p><p class="q">「書いてあります」</p><p class="q">「うん。だから、いいと思う」</p><p>鏡さんが、紙をこちらへ返した。</p><p class="q">「片方だけにすると、もう片方が寂しがる」</p><p class="q">「紙が？」</p><p class="q">「紙も、書いた人も」</p><p>紙を受け取る。</p><p>あいだの空白が、さっきより少しだけ、置いておいていい空白に見えた。</p><div class="sep" aria-hidden="true">◇</div><p>灯りを落とす。</p><p>閉じた戸の向こうで、水路を流れる、水のような音。閉ざされた道の、もっと奥の方で。</p><p>たぶん、気のせいだった。</p><p class="end">（第三章　終）</p></template>
<template id="t-ch4" data-label="第四章" data-title="三つの湯"><header class="chap-head"><p class="chap-label">第四章</p><h2 class="chap-title">三つの湯</h2></header><h3 class="sec" id="ch4-1"><span class="num">一</span><span class="name">採水瓶</span></h3><p>朝食の器を片付けた卓に、古い湯の図が広げられた。</p><p>帳場の棚から出てきた、あの折り込まれた図面だ。一晩で折り目がゆるんで、卓の上に平らに落ち着いている。</p><p>その真ん中に、雪鳥が座っていた。</p><p class="q">「そこが、戻り湯」</p><p>冴月さんが言う。</p><p class="q">「ぴ？」</p><p class="q">「君の下」</p><p>雪鳥が横へ跳ねた。白いまん丸が退いたあとに、小さな湯屋の絵が現れる。それでようやく、三つの湯屋が揃って見えた。</p><p>卓の端に、空の瓶が三本並べられていく。</p><p>並べているのは、黒い手袋の手だった。</p><p>月白先生は、瓶の間隔を指一本分ずつ揃えてから、手を離した。</p><p>診察を受けた日から、この人を食堂で見るのは数えるほどしかない。長い髪を背で結び、眼鏡の奥の淡い青い目は、図面ではなく瓶の方を見ていた。</p><p class="q">「全部、直すんですか」</p><p class="q">「まず、二つまで。道と湯口を見てから決める」</p><p>答えたのは冴月さんだった。</p><p class="q">「水が出たことと、使えることを混ぜるな」</p><p>月白先生が、瓶から目を上げずに言った。低くて、よく通る声。誰に向けたともつかない言い方だったが、卓にいた全員がそれを聞いていた。</p><p class="q">「分かれてるんですね」</p><p class="q">「分けて確認する」</p><p>それだけだった。説明を足すつもりはないらしい。ただ、その一言で、三本の瓶が何のために並んでいるのかは分かった。</p><p>どさり、と卓の横に重い音がした。</p><p>雪鬼さんが道具を下ろしたところだった。厚い手袋。巻いた縄。布。それから、竹の皮で包んだ包みがいくつか。</p><p class="q">「飯は包んだ。手伝うなら、食ってから動け」</p><p>手伝うなら、と雪鬼さんは言った。昨夜はもう手伝うことになっていたのに、今朝はまた、こちらに選ばせてくれる。</p><p>冴月さんが、顔だけこちらへ向けた。</p><p class="q">「現地でも、本館でもいいよ。見学だけでも」</p><p>三つの湯屋の絵を、もう一度見た。</p><p>雪に埋もれた道の先。閉ざされた木戸の向こう。昨夜、気のせいだと思った水の音。</p><p class="q">「……行って、手伝いたいです」</p><p class="q">「足元を見られる仕事から頼むよ」</p><p>冴月さんはそう言って、雪鬼さんの道具の山から手袋を一組、こちらへ寄越した。少し大きい。</p><p>月白先生が、その手袋を一瞬だけ見た。それから道具の山に手を入れ、別の一組を取り出して、黙って取り替えた。</p><p>今度のは、ちょうどだった。</p><h3 class="sec" id="ch4-2"><span class="num">二</span><span class="name">数え直し</span></h3><p>鎮め湯への木戸は、重かった。</p><p>雪鬼さんが肩で押すと、長いあいだ閉じていた蝶番が、ぎい、と喉を鳴らすような音を立てた。向こう側には、誰も踏んでいない雪が一面に広がっている。その下を、細い水路が走っているはずだった。</p><p>そこからは、言葉の少ない作業が続いた。</p><p>雪鬼さんが道の雪を除ける。冴月さんが道標を探して、杭を打ち直す。雪鳥たちが縄の端をくわえて飛び、足元を見られる仕事として、こちらは掘り出された石を道の脇へ並べていった。</p><p>道が半分ほど開いたところで、休憩になった。</p><p>雪鬼さんが、竹の皮の包みを二つ差し出した。大きいのと、小さいの。小さい方を取った。</p><p class="q">「足りるのか」</p><p class="q">「これで」</p><p class="q">「……おん」</p><p>それから雪鬼さんは、一人で湯口の方へ先に行ってしまった。冴月さんは道標の前にしゃがみ込んでいる。小さな湯屋の前の軒下では、雪音さんが積み上げた湯籠を前に、指を折っていた。</p><p>その隣に座った。雪音さんは指を止めずに、半人分こちらへ詰めてくれた。</p><p class="q">「……三つ、足りないです」</p><p class="q">「古い帳簿にも、そう書いてあった」</p><p class="q mark">《湯籠、三つ不足》。あの丸い字の帳簿だ。</p><p>雪音さんは、少し驚いたようにこちらを見た。それから籠の山に目を戻して、困ったように眉を下げた。</p><p class="q">「そんなところ、引き継がなくていいのに」</p><p>そのとき、籠の一つが、もぞもぞと動いた。</p><p>顔を出したのは雪鳥だった。黒い目が、なんですか、という顔でこちらを見る。その後ろの籠からもう一羽。さらにその奥からもう一羽。</p><p>三羽とも、籠の中で丸くなって休んでいたらしい。雪鳥を載せた籠は、積み上げた山の、雪音さんからは見えない側に隠れていた。</p><p>雪音さんは、しばらく黙ってその三羽を見ていた。</p><p class="q">「……三つ、ありました」</p><p class="q">「引き継いでないですね」</p><p>雪音さんの肩が、小さく震えた。笑っているのだと、少ししてから分かった。声は出さない。口元を手の甲で押さえて、それでも止まらない。</p><p>それから雪音さんは、最初から籠を数え直し始めた。今度は一つずつ、中を覗いてから。</p><p class="q">「一緒に数えてもいいですか」</p><p class="q">「……お願いします。そっちの山から」</p><p>山を二つに分けて、それぞれ数えた。数え終わって、数を足し合わせる。雪鳥の入っている籠も、ちゃんと数に入れた。</p><p>備品の帳簿に載っている数と、ちょうど揃っていた。</p><p>雪音さんが、前掛けのポケットから小さな帳面を出して、数を書き込む。その横に、小さく《不足なし》と。</p><p>道の奥から、雪鬼さんの声がした。</p><p class="q">「湯口、見えたぞ」</p><h3 class="sec" id="ch4-3"><span class="num">三</span><span class="name">鎮め湯</span></h3><p>翌日の午後、石の浴槽に湯が流れ込み始めた。</p><p>最初は細い糸のようだった。湯口から落ちた水が、乾いた石の底を黒く染めていく。糸は、やがて紐になり、帯になった。湯気が立ち、冷えた空気の中でゆっくりと渦を巻いて昇っていく。</p><p>誰も歓声を上げなかった。</p><p>雪鬼さんは水路の蓋を戻し、冴月さんは入口に札を掛けた。月白先生は浴槽の縁に膝をつき、昨日の瓶の一本で湯をひと口ぶん汲んで、光にかざしている。</p><p class="q">「流れは安定した。湯温の確認が済むまで入るな」</p><p class="q">「足だけは？」</p><p>いつの間に来ていたのか、ヒノエが浴槽の向こう側で、もう靴を脱ぐ手つきになっていた。</p><p class="q">「足も君だろ」</p><p>月白先生は瓶から目を離さなかった。</p><p>ヒノエは一瞬考える顔をして、それから黙って靴を履き直した。反論の余地がないことは、本人にも分かったらしい。</p><p>浴槽の向こう、湯屋の壁際に、雪の塊があった。</p><p>見ているうちに、それが動いた。</p><p>笛は鳴っていない。ヒノエの手は空っぽだった。それでも雪の塊は、小さな獣の形をとり、落ち着かない様子で伸びたり縮んだりを繰り返していた。足が長くなり、また短くなる。尾が、引き延ばされた影のように波打つ。</p><p class="q">「……この前の見回りのときの」</p><p class="q">「似たものだね」</p><p>後ろから、夜澄さんの声がした。湯屋の入口より外。雪の上に、ひとりだけ距離を取って立っていた。</p><p>雪の獣は、落ち着かない足で、浴槽の石の縁へ寄ってきた。</p><p>湯気が、その尾を横切った。</p><p>途端、輪郭の揺れが、ゆっくりになった。波打っていた尾が、少しずつ静まっていく。伸びたり縮んだりの幅が狭くなる。</p><p>消えはしなかった。</p><p class="q">「鎮め湯。過剰な魔障出力を落とす」</p><p>月白先生が、瓶に蓋をしながら言った。</p><p class="q">「元に戻った？」</p><p class="q">「まだだ。落ち着いた状態を、次へつなぐ」</p><p>雪の獣は、湯気の中で静かになった。けれど、出口を探すように、同じ場所を回り始めた。石の縁に沿って、一周。もう一周。自分のつけた足跡を、何度も踏んでいる。</p><p>静かにはなった。でも、どこへ行けばいいのかは、まだ分かっていない。そういう歩き方だった。</p><div class="sep" aria-hidden="true">◇</div><p>小屋の隣に、復旧の記録をつけるための板が掛かっていた。</p><p>冴月さんが筆を差し出したので、受け取って二行だけ書いた。</p><p class="q mark">《流れる。》</p><p class="q mark">《使う前に確認。》</p><p>書いてから、月白先生の言ったことをそのまま書いただけだと気づいた。</p><p>月白先生が、横からその板を見た。何も言わなかった。ただ、消しも、書き足しもしなかった。</p><h3 class="sec" id="ch4-4"><span class="num">四</span><span class="name">戻り湯</span></h3><p>戻り湯の湯面は、鏡のように平らだった。</p><p>三方を低い木の壁に囲まれた、小さな湯屋だった。最後の詰まりを雪鬼さんが取り除くと、湯は音もなく槽へ届いた。波も立たず、ただ水位だけがゆっくりと上がっていく。</p><p>月白先生が札の位置を確かめ、小さく頷いた。</p><p>戸口に、あの雪の獣がいた。</p><p>鎮め湯で同じ場所を回っていた、あの獣だ。いつの間にか、ここまでついてきていたらしい。</p><p>雪鳥が一羽、戸口の脇にいた。追い立てもせず、道を塞ぎもせず、ただ少し横へ避けて、獣のために場所を空けた。</p><p>雪の獣が、湯面を覗き込んだ。</p><p>最初に小さくなったのは、湯に映った輪郭の方だった。</p><p class="q">「あ」</p><p>湯面の中で、長すぎた足が、尾が、引き延ばされた影が、元の大きさへ畳まれていく。映った形に導かれるように、湯の外にいる獣の身体も、少し遅れてそれに従った。</p><p>尾が、一度だけ揺れた。</p><p>長すぎた足が縮む。体の形に合った、小さな足になる。</p><p>今度は、同じ場所を回らなかった。</p><p>まっすぐに、戸口へ向かっていく。</p><p class="q">「自分の形を、思い出した？」</p><p class="q">「そう呼んでいる。戻り湯だ」</p><p>小さな雪の獣は、戸口の外で立ち止まった。振り返る。湯屋の中を、それとも、こちらを。分からない。</p><p>それから、林の方へ走っていった。迷いのない、小さな足跡が、雪の上に点々と続いていた。</p><p>空いた戸口を、しばらく見ていた。</p><p>そして、ずっと考えていたことが、口から出た。</p><p class="q">「もっと早く、全部静かにできたら。欲がなくなれば、暴れなくて済むんじゃ」</p><p>笛で膨らむなら、膨らむものをなくせばいい。満月の夜も、窓の外の手招きも、全部。</p><p>月白先生が、採水瓶の蓋を閉めた。</p><p class="q">「全部抜けばいいと思ったか」</p><p>責める声ではなかった。ただ、今の考えを、そのままの形で台の上に載せられたような気がした。載せられてみると、思っていたより雑な形をしていた。</p><p class="q">「私も、一度はそう思った」</p><p>夜澄さんだった。</p><p>湯屋の入口から、一番遠い椅子。浴槽から離れたその場所に、夜澄さんは腰を下ろした。</p><p class="q">「私と長く傍にいた人が、ある朝、何も欲しがらなくなった」</p><p class="q">「楽になった？」</p><p class="q">「水も。食事も。帰ることも」</p><p>水音は、止まらなかった。湯口から落ちる音が、変わらない速さで続いている。その音の分だけ、夜澄さんは黙っていた。</p><p class="q">「静かだったよ。それを、よいことだと思いかけた」</p><p class="q">「その人は」</p><p class="q">「私から、離れた。他の者に世話を頼んだ。時間をかけて、欲しがるようになった」</p><p>夜澄さんの指先が、膝の上でゆっくりと閉じた。何かを握るのではなく、何も握らないために閉じるような閉じ方だった。</p><p class="q">「私が傍にいない方がいい時間を、私のほうが受け入れないといけなかった」</p><p>あの夕方の庭を思い出した。足跡から一歩、もう一歩と離れていったこの人を。離れたあと、言葉のない歌を歌い直していたこの人を。</p><p>あの距離は、ずっと前から、この人が自分で測って決めていたものだったのだ。</p><p class="q">「……なくすのではなくて、扱えるようにする？」</p><p>答えたのは、月白先生だった。</p><p class="q">「その方法を探している。穏やかになれば終わりじゃない」</p><p>穏やかになって、同じ場所を回り続けていた獣を思った。穏やかになって、水も食事も欲しがらなくなった誰かを思った。</p><p>夜澄さんが、ゆっくり顔を上げた。</p><p class="q">「帰りたいも、生きたいも欲だ。私が奪っていいものではなかった」</p><p>帰りたいも。</p><p>その言葉が、胸のどこかに引っかかった。帳場に置いたままの荷物。記録の紙に書いた一文字。</p><p class="q">「ここにいたいのと、帰りたいのが、両方あっても？」</p><p>夜澄さんは、首をかしげた。</p><p class="q">「君は、どちらかを消さないと椅子から立てないかい」</p><p>少し考えた。</p><p>それから、立った。</p><p>立てた。どちらも消さないまま。膝に力を入れて、足の裏で床を押しただけだった。</p><p class="q">「……食堂には行けそうです」</p><p class="q">「飯は欲しがっとけ」</p><p>湯屋の外から、雪鬼さんの声がした。道具を担いだまま、もう本館の方へ歩き出している。</p><p>夜澄さんが、声を出さずに笑った。月白先生は、採水瓶を三本、黒い手袋の手で抱えて、空いた戸口を後にした。</p><h3 class="sec" id="ch4-5"><span class="num">五</span><span class="name">閉じた木戸</span></h3><p>二つの道が開いた。</p><p>鎮め湯への道と、戻り湯への道。どちらも雪が除けられ、踏み固められて、道標が立て直されている。冴月さんの彫った矢印は、行きも帰りも、ちゃんと両側にあった。</p><p>その二本の先に、もう一つ、閉じたままの木戸があった。</p><p>夕方だった。木戸の前で、月白先生が図面を広げていた。黒い手袋の指が、三つ目の湯屋の横に小さな印をつける。</p><p class="q mark">《迎え湯》</p><p>帳簿の間から滑り出たあの図面で、一度引かれた線の上に引き直されていた道だ。</p><p class="q">「ここは、まだ？」</p><p class="q">「道だけなら開く。戻ってきたものを受け止める流れが、まだ足りない」</p><p>月白先生は、図面から目を上げなかった。その声は、湯の温度や流れの話をしていたときと同じだった。同じだったけれど、指はずっと、その印の上から動かなかった。</p><p class="q">「誰が戻ってくるんですか」</p><p>指が、止まった。</p><p>凍てつくような沈黙に、こちらの呼吸まで止まりそうだった。</p><p class="q">「長く眠っていたもの。境界の外へ離れていたもの」</p><p>それは、答えのようで、答えではなかった。誰かの名前を当てはめる前の、分類の言葉だった。この人は、話せないことを話せないと言う代わりに、話せるところまでを正確に言うのだと思った。</p><p class="q">「起きたら、それで終わりじゃないんですね」</p><p>戻り湯の獣を思い出していた。静まって、形を思い出して、それでもまだ、どこかへ帰っていく必要があった。</p><p class="q">「起きた後の安全を作らずに、起こせない」</p><p>帰ってきた後の場所。迎えるための湯。</p><p>雪を踏む音がして、冴月さんが交換用の札を抱えて来た。空の色は、もう青から藍に変わり始めている。</p><p class="q">「今日はここまで。暗くなる」</p><p>月白先生は、すぐには動かなかった。</p><p>冴月さんは、それ以上急かさなかった。札を抱えたまま、隣に立って同じ木戸を見た。</p><p class="q">「明日も、ここにあるよ」</p><p>長い間があった。少なくとも、そう感じた。</p><p>月白先生が、図面を畳んだ。折り目どおりに、丁寧に。</p><p class="q">「……分かってる」</p><p>その一言だけが、これまで聞いたこの人の声の中で、少しだけ温度が違った。</p><p>二人が歩き出す。</p><p>その後ろについていく前に、もう一度だけ、迎え湯の木戸を振り返った。</p><p>閉ざされた板の向こうから、細い水音がしていた。</p><p>気のせいではなかった。</p><h3 class="sec" id="ch4-6"><span class="num">六</span><span class="name">白い窓</span></h3><p>食堂の壁際には、濡れた手袋が乾かしてあった。</p><p>大きいのも小さいのも、一組ずつ並んでいる。その下に、片付けられた道具。縄は巻かれ、布は畳まれていた。</p><p>雪鬼さんが、卓の真ん中に大きな鍋を置いた。</p><p class="q">「作業した奴は食え。見てた奴も食え」</p><p class="q">「同じですね」</p><p class="q">「飯だからな」</p><p>そう言って、最初の一杯をこちらの前に置いた。言わなくても、汁が多めになっていた。</p><p>雪音さんが、乾いた湯籠を棚に戻していた。数えながら、一つずつ。最後の一つだけを、棚ではなく脇へ分けた。</p><p class="q">「それは？」</p><p class="q">「研究所へ。新しい布が要るそうです」</p><p>研究所。</p><p>その言葉を、この館で聞くのは初めてだった。月白先生の処置室とは別の場所らしい。迎え湯の木戸の前で、あの人がすぐには動かなかったことが、なぜか思い出された。</p><p>そこへ、雪鳥が飛び込んできた。</p><p>ぱすっ、と軽い音を立てて、分けられた籠の中に着地する。</p><p class="q">「おとどけ！」</p><p>雪音さんは籠を一度床へ下ろした。それから前掛けのポケットを探って小さな札を出し、持ち手に結びつける。</p><p class="q">「帰ったら、ここへ。数えるからね」</p><p>雪音さんは立ち上がって、廊下の連絡板の前へ行った。指で書き込みを辿る。</p><p class="q mark">《研究所・夜の待機補助／朝に帰館》</p><p>指がそこで止まり、小さく頷いた。</p><p class="q">「りょうかい！」</p><p>籠が、廊下を進み始めた。雪鳥が内側から押しているのか、引いているのか、よく分からない。入口で一度つっかえ、籠ごと向きを変えて、また進む。</p><p>笑ってしまった。雪音さんも、雪鬼さんも、ちょっとだけ笑っていた。</p><div class="sep" aria-hidden="true">◇</div><p>客室の文机に、今夜も紙が置いてあった。</p><p>筆を取る。今日は、書くことが最初から決まっていた。</p><p class="q mark">《鎮め湯。戻り湯。迎え湯は、まだ。》</p><p>書いてから、筆を置かずにいた。</p><p>戻り湯の椅子から立ったときのことを思い出していた。ここにいたい気持ちと、帰りたい気持ち。どちらも消さないまま、床を押した。</p><p>帰ったら、まず湯を沸かす。この前の夜にそう書いた。</p><p>そのあとのことも、ぼんやり考えてみた。</p><p>ここで過ごした日々は、ひどくゆっくりだった。朝になれば飯があって、午後には誰かが布巾を畳んでいて、夜には紙が置かれている。帰ったら、そのゆっくりを、全部なかったことにしなければいけないのだろうか。</p><p>たぶん、そうではない。</p><p>紙の端に、小さく書き足した。</p><p class="q mark">《帰った後にも、休む時間を残す。》</p><p>ここで休んだことを。帰ったら、なかったことにしなくてもいい。</p><p>そう書いてしまうと、当たり前すぎるような気もした。でも、山に来る前の自分には、書けなかった一行だった。</p><div class="sep" aria-hidden="true">◇</div><p>渡り廊下の灯りは、今夜も点いていた。</p><p>戸を叩く前に、鏡さんの方が戸口に立っていた。</p><p class="q">「お疲れ。湯、二つ戻ったって？」</p><p class="q">「迎え湯は、まだです」</p><p class="q">「二つ戻れば上出来。全部いっぺんに戻すと、誰かが倒れる」</p><p>鏡さんの目が、こちらの手で止まった。</p><p class="q">「手、冷えてる。はい」</p><p>膝の上に、毛布が一枚落ちてきた。</p><p>渡す手が、やけに早かった。こちらが冷えていると気づくより先に、もう毛布を持っていたような早さだった。</p><p class="q">「……どうして分かったんですか」</p><p class="q">「えー？見りゃ分かる」</p><p>鏡さんは、それ以上説明しなかった。鉄瓶の湯を、黒いマグに注いでいる。</p><p>戸口でこちらを見たのは、ほんの数秒だった。その数秒で、この人は、手袋を外したばかりの指の色まで見ていたらしかった。</p><div class="sep" aria-hidden="true">◇</div><p>客室に戻って、灯りを落とす前に、窓の外を見た。</p><p>雪の向こう、林をひとつ越えたあたりに、小さな灯りが点々と続いている。その先に、窓が一つ。</p><p>白く、明るかった。</p><p>食堂の灯りとも、帳場の灯りとも違う。蜂蜜色ではなく、雪の色に近い。夜の間ずっと、消えることを前提にしていないような灯りだった。</p><p>あの籠は、もう届いただろうか。</p><p>灯りを落とす。</p><p>暗くなった部屋からも、その窓だけは、まだ白く見えていた。</p><p class="end">（第四章　終）</p></template>
<template id="t-ch5" data-label="第五章" data-title="雪尾研究所"><header class="chap-head"><p class="chap-label">第五章</p><h2 class="chap-title">雪尾研究所</h2></header><h3 class="sec" id="ch5-1"><span class="num">一</span><span class="name">空の籠</span></h3><p>朝の喫茶席は、時計の音がよく聞こえた。</p><p>柱時計の振り子が、こつ、こつ、と刻む。いつもなら湯を沸かす音や、雪鳥たちの足音に紛れてしまう音だった。</p><p>カウンターの脇に、湯籠の置き場がある。棚に並んだ籠の中で、一つだけが空いていた。</p><p>雪音さんが、連絡板の前に立っていた。指で同じ欄を辿る。一度。それから、もう一度。</p><p class="q">「まだ、一羽」</p><p>小さな声だった。誰かに言ったのではなく、数えた数を口に出して確かめるような。</p><p class="q mark">《研究所・夜の待機補助／朝に帰館》</p><p>昨夜、雪音さんが指で辿っていた書き込みだ。その横の帰館欄には、印がなかった。</p><p class="q">「昨日、籠を運んだ……？」</p><p class="q">「はい。予定の時刻を過ぎました」</p><p>雪音さんは連絡板から目を離さずに答えた。声はいつもどおり丁寧だった。ただ、前掛けの裾を握った指に、力がこもっている。</p><p>帳場の方から、鈴の音がした。</p><p>冴月さんが呼び鈴を鳴らしている。館のあちこちで、雪鳥たちが顔を上げた。棚の上で、梁の上で、布団の山の隙間で。小さな返事が、あちこちから返ってくる。</p><p>一羽分だけ、返事が足りなかった。</p><p>それが、耳で分かった。</p><p class="q">「研究所の前室までは届いてる。月白に確認する」</p><p>冴月さんの声は落ち着いていた。けれど、もう外套を手に取っていた。</p><p class="q">「雪鳥なら、どこにいるか分かるんじゃ」</p><p class="q">「どこでも全部、ではないよ。向こうには別の結界もある」</p><p>短い連絡。返事を待つ間、冴月さんは外套の袖に腕を通した。待つことと、待ちながら準備することを、この人は区別していないらしかった。</p><p>連絡板の前に、別の雪鳥が降りてきた。いつもの、短い言葉しか話さない雪鳥とは、少し様子が違った。</p><p class="q">「前室の入館記録あり。退館記録なし。点検通路の確認をお願いします」</p><p>整った言葉が、引き写したように正確に並んでいた。誰かの言葉を、そのまま運んできたのだと分かった。</p><p class="q">「了解。僕が行く」</p><p>冴月さんが帳場を出ていこうとする。</p><p>空の籠を、もう一度見た。昨夜、廊下の入口で一度つっかえて、向きを変えて進んでいった籠。雪音さんが持ち手に札を結んで、数えるからね、と言った籠。</p><p class="q">「……一緒に探します」</p><p>冴月さんが振り返った。止める顔ではなかった。急ぐ顔でもなかった。</p><p class="q">「許可のある通路だけ。僕から離れないで」</p><p>頷く。雪音さんが、空いた籠を棚から下ろして、黙ってこちらに差し出した。</p><p class="q">「帰りに、うちの子が乗れるように」</p><p>籠の底には、乾いた布が一枚、折り畳んで敷いてあった。</p><h3 class="sec" id="ch5-2"><span class="num">二</span><span class="name">前室</span></h3><p>館の廊下より、白かった。</p><p>林をひとつ越えた先、昨夜窓から見えた白い灯りの建物。扉を開けると、温かい匂いがしなかった。出汁も、炊きたての米も、干した布団も。代わりに、澄んだ冷たい空気と、かすかな薬の匂いがあった。</p><p>灯りは低く、窓は高い。床には、足音がよく響いた。次の一歩を踏むより少し遅れて、一度だけ反響が返ってくる。</p><p>扉の端に、札が掛かっていた。</p><p class="q mark">《雪尾研究所》</p><p>その下に、もう一枚、古い札が残っていた。墨が薄れている。《雪尾Labo》と読めた。さらにその下に、測定器の細い線が壁に沿って張られている。</p><p class="q">「月白。前室に入った」</p><p>冴月さんが壁の連絡器に言う。少しして、低い声が返ってきた。</p><p class="q">「点検通路は開けてある。奥の結界は触るな」</p><p class="q">「今、そちらは？」</p><p class="q">「観測中。ここを離れられない」</p><p>通話が切れた。</p><p>離れられない。その一言が、白い廊下の奥へ吸い込まれていった。</p><div class="sep" aria-hidden="true">◇</div><p>点検通路は、思ったより狭かった。</p><p>最初に見つけたのは、床に落ちた布だった。昨日、雪音さんが籠に詰めていたのと同じ布。隅だけが濡れて、白い床に小さな水の跡をつけている。</p><p class="q">「落としたのかな」</p><p class="q">「重かったのかもしれない」</p><p>冴月さんは布を拾い上げて、黙って畳んだ。</p><p>少し先に、通用扉があった。</p><p>閉まっている。取っ手は、人の手の高さにしかなかった。そのずっと下、床に近いところに、小さな爪の跡がいくつもついている。</p><p>こつ。</p><p>扉の向こうから、音がした。</p><p>冴月さんが膝をついた。扉にではなく、その向こうにいるものの高さに、目を合わせるように。</p><p class="q">「そこにいるの？」</p><p>返事はなかった。</p><p>もう一度、こつ。</p><p>扉の横に、小さな点検窓があった。覗くと、隣の通路が見えた。</p><p>落ちた籠。その脇に、白い丸。</p><p>雪鳥は倒れていなかった。</p><p>閉じた扉に向かって、羽を伸ばしていた。取っ手には届かない。届かないと分かっているのか、いないのか。伸ばして、休んで。また伸ばして、休んで。</p><p>一晩じゅう、そうしていたのだと思った。</p><p>冴月さんが鍵を確かめて、扉を開けた。</p><p>雪鳥が、ゆっくりと顔を上げる。</p><p class="q">「……おとどけ」</p><p class="q">「うん。届いてるよ。帰ろう」</p><p>雪鳥は、冴月さんを見た。それから、扉の奥を見た。</p><p>まだ、来ようとしなかった。</p><p class="q">「あっち」</p><p>通路の先に、すりガラスの扉があった。</p><p>その向こうに、白い寝台の影が見える。寝台の周りだけ、雪のような光が静かに揺れていた。灯りの光ではなかった。表面に雪が降り積もって、それが月を返しているような光だった。</p><p>その光の中で、何かが、一瞬だけ動いた。</p><p>長いものが、いくつか。尾のような影が、ガラスの向こうを横切って消えた。数える暇はなかった。</p><p>息を止めていたことに、後から気づいた。</p><p class="q">「そこは、今は入れない」</p><p>冴月さんの声は、変わらなかった。</p><p>こちらの手から空の籠を受け取って、雪鳥の前へそっと置く。雪音さんが敷いた布が、底で白く見えている。</p><p class="q">「こっちは君の席。乗れる？」</p><p>雪鳥は、もう一度だけ、ガラスの向こうを見た。</p><p>それから、一歩ずつ戻ってきた。籠の縁を越えて、布の上で丸くなる。</p><p>止めていた息を、ようやく吐いた。</p><h3 class="sec" id="ch5-3"><span class="num">三</span><span class="name">観測窓</span></h3><p>説明室と呼ばれている部屋には、湯飲みがあった。</p><p>それだけで、呼吸がひとつ楽になった。白い壁に記録の棚が並び、片側の壁には、幕を下ろした大きな窓がある。寝台のある区画とは、壁一枚で分けられているらしかった。</p><p>月白先生が、湯を注いでいた。</p><p>それから黒い手袋を外して、籠の中の雪鳥に触れた。羽の付け根。足。目。一つずつ、急がずに確かめていく。雪鳥は布を握ったまま、おとなしくされるがままになっていた。</p><p class="q">「飛ぶな。今日は本館で休め」</p><p class="q">「おしごと」</p><p class="q">「休むこと」</p><p>雪鳥は、布の下へ潜った。白い布の端から、白い尾羽の先だけがはみ出している。</p><p>冴月さんが、点検通路の方を見た。</p><p class="q">「小さい出入口と、連絡の仕方を変えよう。あの扉では出られない」</p><p class="q">「遮断札も増やす。俺の確認が足りなかった」</p><p>月白先生はそう言って、点検票に何かを書き込んだ。誰かの名前を書く欄ではなく、処置の欄に。言い訳も、謝る言葉もなかった。ただ、足りなかったものを、足りなかったと書いた。</p><p>それから、観測窓の幕を上げた。</p><div class="sep" aria-hidden="true">◇</div><p>黒い髪だった。</p><p>寝台の上に、誰かが眠っていた。長い黒髪が、枕から床の方へ流れている。閉じた目。静かな呼吸。かすかに上下する寝具。</p><p>その周りだけ、雪の光が淡く揺れていた。</p><p>さっき、すりガラス越しに見た光だった。</p><p>窓の脇に、表示があった。</p><p class="q mark">《対象：雪狐（セツコ）》 《処置担当：月白》 《関係：伴侶》</p><p>セツコ。</p><p>食堂の奥の席。毎朝拭かれる床。冴月さんが「この家の大事な人」と呼んだ名前。死んだ人の話をする声でも、すぐに帰ってくる人の話をする声でもなかった、あの声。</p><p>そのどちらでもないところに、この人がいた。</p><p>表示の下に、もう一行。</p><p class="q mark">《月白への接近欲求を睡眠欲へ変換》</p><p>読んで、もう一度読んだ。</p><p>意味は、一度目で分かっていた。分かりたくなくて、もう一度読んだのだと思う。</p><p class="q">「……会いたいと思うと、眠るんですか」</p><p class="q">「そうだ」</p><p>月白先生の声は、平らなままだった。</p><p class="q">「あなたに会いたいと思うほど？」</p><p class="q">「そうなるように、俺が組んだ」</p><p>黙った。</p><p>冴月さんは、間に入って来なかった。言い添えもしなかった。湯飲みの湯気だけが、三人のあいだで細く昇っていた。</p><p>引っかかった言葉は、いくつもあった。閉じ込めている。眠らせている。だから来られない。でも、どれも口に出す前に、先に知りたいことが一つあった。</p><p class="q">「セツコさんは、これを望んだんですか」</p><p>月白先生が、初めてこちらを見た。</p><p>眼鏡の奥の青い目は、思っていたよりもずっと凪いでいた。</p><p class="q">「記録がある。俺の説明だけで済ませる話じゃない」</p><p>そう言って、棚から薄い綴りを三冊取り出した。表紙を伏せたまま、机に置く。</p><p class="q">「本人が共有を認めた範囲を出す。今日は読まなくてもいい」</p><p class="q">「読んだら、納得しないといけない？」</p><p class="q">「その必要はない」</p><p>即答だった。</p><p>冴月さんが立ち上がって、出口に近い椅子を一脚、引いた。</p><p class="q">「途中で休んでも、話はなくならないよ」</p><p>観測窓の向こうで、黒髪の人は、ただ眠っていた。</p><p>月白先生は、一度もそちらを振り返らなかった。</p><h3 class="sec" id="ch5-4"><span class="num">四</span><span class="name">三冊の記録</span></h3><p>その日は、読まなかった。</p><p>雪鳥を籠ごと抱えて本館へ戻り、雪音さんに渡した。</p><div class="sep" aria-hidden="true">◇</div><p>その夜、渡り廊下の戸の前に、鏡さんが座っていた。</p><p>仕事から戻ったばかりなのか、外套の肩に雪が残っている。こちらの足音に顔を上げて、少しだけ見た。</p><p class="q">「見ちゃった顔だな」</p><p>研究所の、と言わなくても、分かっているようだった。</p><p class="q">「……知ってたんですね」</p><p class="q">「うん」</p><p>何日か前の夜、離れで同じことを訊いた。セツコさんって、誰なんでしょう。あのとき、この人は、それは俺が言うと怒られるやつ、と言った。</p><p class="q">「言わなかったのは、怒られるからですか」</p><p>鏡さんは、少し考える顔をした。</p><p class="q">「言うのは、俺の役じゃなかったから」</p><p>段の上で、尾がゆっくり一度だけ揺れた。</p><p class="q">「話すのは冴月さんで、見せるのは先輩。俺は、待ってる役。……ごめんな」</p><p>謝られるとは、思っていなかった。</p><p>怒っていなかった。怒るところがどこにもなかった。知っていて、言わずに、近くで待っていた人に、何を怒ればいいのか分からなかった。</p><p class="q">「怖かった？」</p><p>最初の夜と、同じ訊き方だった。</p><p class="q">「……少し」</p><p class="q">「うん。それでいい」</p><p>鏡さんは立ち上がって、外套の雪を払った。</p><p class="q">「怖いって分かる人は、ちゃんと帰れる」</p><p>二度目に聞くその言葉は、最初の夜より、少しだけ意味が分かった。</p><p class="q">「今日は早く寝な。読むのは、明日でも明後日でもいい」</p><div class="sep" aria-hidden="true">◇</div><p>その夜は早く寝た。次の日も、研究所には行かなかった。行かなくてもいいと言われていたからではなく、行く前に、自分の中で引っかかっている言葉を数えておきたかった。</p><p>二日後の午後、説明室の机の前に座った。</p><p>伏せられたままの薄い綴りが、三冊。月白先生は観測窓の幕を下ろし、少し離れた椅子に座った。冴月さんは扉の近くで、立ったまま壁に背を預けている。</p><p>読む順番は、誰も決めなかった。</p><div class="sep" aria-hidden="true">◇</div><p>一冊目は、処置の前の確認書だった。</p><p>筆跡が二つあった。角の立った、整った字。それから、丸みのある字。</p><p>帳場の古い帳簿で、《宴》と書いてあった字だと、すぐに分かった。</p><p>処置対象の欄に、《雪狐》。その横に、小さく《セツコ》。</p><p>本文は短かった。</p><p class="q mark">《周囲の者が帰る意思を失う状態が続く場合、眠りによる抑制を受ける。》</p><p class="q mark">《意思を確かめられる時には、その都度、処置を続けるか尋ねること。》</p><p class="q mark">《起きて暮らす方法を探すことを、やめないこと。》</p><p class="q mark">《処置を行う者だけで、続行の判断を閉じないこと。》</p><p>下に、《月白》と、《立会・冴月》。立会の署名だけは、細くまっすぐな、冴月さんの字だった。</p><p>その下に別の欄があった。《帰還路の維持に関わる者へ、処置の目的と限界の説明を認める》。その隣の、もっと私的な話を書くための欄は、開かれていなかった。封のように、紙が折り返されたままになっている。</p><p>そこには、触れなかった。</p><p class="q">「……眠ることだけに、同意したわけじゃない」</p><p>冴月さんが、壁から背を離した。</p><p class="q">「起きて暮らすところまで、頼まれた」</p><div class="sep" aria-hidden="true">◇</div><p>二冊目は、覚醒を試みた記録だった。</p><p class="q mark">《反応確認。周囲の雪融解、増加。》</p><p class="q mark">《本人より中断の意思表示。》</p><p class="q mark">《覚醒試行中止。保護的な鎮静へ戻す。》</p><p>頁をめくる。別の日。</p><p class="q mark">《呼名への反応あり。意思確認に十分な応答なし。》</p><p class="q mark">《無応答を同意として扱わず。次段階への移行見送り。》</p><p>その次の頁。</p><p class="q mark">《湯の条件不足。覚醒後の維持を保証できず、実施せず。》</p><p>迎え湯の木戸を思い出した。起きた後の安全を作らずに、起こせない。あの一言は、この頁のことだったのだ。</p><p>余白に、小さな書き込みがあった。角の立った字の方だった。</p><p class="q mark">《急ぐ理由は、こちらにしかない。》</p><p class="q">「……失敗した記録も、残すんですね」</p><p>月白先生は、椅子から動かなかった。</p><p class="q">「消せば、また繰り返すからな」</p><div class="sep" aria-hidden="true">◇</div><p>三冊目は、薬の綴りだった。</p><p>中身は書いていなかった。何をどれだけ、ということは、どこにも。書かれているのは、その薬が何のために作られたかだけだった。</p><p>古い綴り。《睡眠維持／出力抑制》。</p><p>次の綴り。《覚醒試行補助／短時間の反応確認》。</p><p>新しい綴り。《覚醒中の出力調整／三湯との併用を検討》。</p><p>新しい方ほど、書き直しが多かった。線で消して、横に書き、また消して、欄外に書く。最後の頁には、まだ埋まっていない欄が一つ。</p><p class="q mark">《迎え湯での維持確認：未了》</p><p class="q">「眠らせる薬を、強くしてきたんじゃない」</p><p class="q">「眠らせるだけでは、ここから動けない」</p><p>月白先生は、観測端末の画面を見ていた。笑ってはいなかった。</p><div class="sep" aria-hidden="true">◇</div><p>三冊を、横に並べた。</p><p>閉じ込めている。</p><p>二日前、観測窓の前で喉まで出かかっていた言葉だ。その言葉は、今も消えていなかった。雪狐を閉じ込める働きは、確かにある。読んだからといって、それが別のものに変わるわけではない。</p><p>でも、もう、それだけではなかった。</p><p class="q">「同意と、見直しのある処置だった。でも、制限は今もある」</p><p>口に出してみると、どちらかを消さなくても、二つとも並べて置ける言葉になった。戻り湯の椅子から立ったときと、似ていた。</p><p class="q">「うん。だから、今も見直す」</p><p>冴月さんが言った。</p><p>まだ一つ、言いたいことが残っていた。</p><p class="q">「眠ることは選んだ。でも、眠ったままでいいとは、頼んでいない」</p><p>月白先生が、端末から目を離した。</p><p class="q">「ああ」</p><p>それだけだった。</p><p>けれどその一言は、確認書の最後の欄に、もう一つ名前を書き足したような響きをしていた。</p><h3 class="sec" id="ch5-5"><span class="num">五</span><span class="name">溶ける雪</span></h3><p>夕方、月白先生がもう一度、観測窓の幕を上げた。</p><p>高い窓から入る光が傾いて、白い部屋がうっすら橙色を帯びている。寝台の周りの雪の光だけが、その色に染まらずに、青白く揺れていた。</p><p>眠る人の顔は、この前よりもよく見えた。黒いまつ毛。薄く開いた唇。苦しそうではなかった。ただ、深く眠っている人の顔だった。食堂の写真で白く舞っていた影とは、髪の色がまるで違う。表示がなければ、同じ人だとは思わなかったかもしれない。</p><p class="q">「……セツコさんは、死んでいない」</p><p>確かめるためではなく、言葉にしておきたかった。</p><p class="q">「眠っている」</p><p class="q">「ずっと、ここで」</p><p>月白先生が、端末の画面を切り替えた。</p><p>横に長い表だった。満月の印が、等しい間隔で並んでいる。印のたびに、一本の線が高く跳ね上がり、またゆっくりと下がっていく。山のような形が、月の数だけ続いていた。</p><p class="q mark">《九尾化指数》</p><p>点検通路で、ガラスの向こうを横切って消えた長い影を思い出した。数える暇はなかった。</p><p class="q">「月が満ちると上がる。夜澄が滞在すると、いくらか下がる」</p><p>表のいくつかの山は、確かに他より低かった。</p><p>雪庭で、足跡から一歩ずつ離れていった夜澄さん。長く傍にいれば、それだけでは済まない。湯屋のいちばん遠い椅子に座っていた夜澄さん。</p><p class="q">「でも、ずっと欲を吸ってもらうわけにはいかない」</p><p>月白先生が、目だけでこちらを見た。</p><p class="q">「覚えていたか」</p><p>その声は、褒めるでもなく、驚くでもなかった。ただ、記録に一行書き足すような響きだった。</p><p>そのとき、小さな音がした。</p><p>ぽつ、と。</p><p>寝台の脇に、浅い受け皿が置いてあった。そこへ、水が一滴落ちた音だった。白い光の縁が、ひとつ、かすかに揺れる。</p><p>雪のような光が、溶けていた。</p><p class="q">「……雪なのに、溶けてる」</p><p class="q">「抱えた欲が、熱になる」</p><p>月白先生の声は、変わらなかった。</p><p class="q">「怒っているんですか」</p><p class="q">「怒りとは限らない。会いたいだけのこともある」</p><p>会いたい。</p><p>表示の一行を、思い出した。月白への接近欲求を、睡眠欲へ変換。</p><p>会いたいと思うたびに、眠りに沈む。沈みきれない分が、熱になって、雪を溶かす。そういうことなのだろうか。</p><p>受け皿に、また一滴。</p><p>月白先生の手は、端末の横にあった。</p><p>黒い手袋の手。点検票に書き込むときも、瓶の間隔を揃えるときも、雪鳥の羽の付け根に触れるときも、迷いのなかった手。</p><p>その手が、ガラスの方へは伸びなかった。</p><p>伸びないまま、観測値を書き留めている。一滴、書く。もう一滴、書く。</p><p>訊くべきではない気がした。訊かなければ、ずっと触れられないままになる気もした。</p><p class="q">「……セツコさんの、近くに行きたい？」</p><p>一拍。</p><p>ペンが止まった。止まっていたのは、なぜかそれだけだった。顔も、肩も、呼吸も、動かなかった。</p><p class="q">「それと、今行っていいかは別だ」</p><p>月白先生は、椅子に座り直した。</p><p>それから、また書き始めた。</p><p>受け皿に落ちる水の音と、ペンが紙を擦る音が、説明室に交互に響いた。どちらかが先に止むことは、その夜、なかった。</p><h3 class="sec" id="ch5-6"><span class="num">六</span><span class="name">小さな鈴</span></h3><p>翌日、研究所へ布を届けてほしいと頼まれた。</p><p>頼んだのは雪音さんで、行くかどうかは決めていいと言われた。湯籠に詰めた新しい布は、あの雪鳥が運び損ねたものと同じだった。</p><p>籠を抱えて、林の道を行った。</p><p>前室の奥、点検通路の手前で、冴月さんと月白先生が扉の前にしゃがみ込んでいた。</p><p>あの通用扉だった。取っ手は人の手の高さにあるままだ。けれどそのずっと下、床に近いところに、新しい木の札が一枚取り付けられていた。札の記しの横に、小さな鈴がぶら下がっている。</p><p>扉の内側から、声がした。</p><p class="q">「中からは？」</p><p class="q">「ぴ！」</p><p>ちりん、と鈴が鳴った。</p><p>扉の外側にある小さな表示が、変わる。冴月さんがそれを確かめてから、扉を開けた。</p><p>内側に、雪鳥がいた。あの雪鳥だった。札を嘴でつついた後らしく、少し得意そうに胸を張っている。</p><p class="q">「返事がなければ、隣の待機所へ。奥へ行くな」</p><p>月白先生が言った。言い聞かせるというより、手順を読み上げる声だった。</p><p class="q">「りょうかい！」</p><p>籠を差し出すと、冴月さんが受け取ってくれた。雪鳥がその縁に飛び乗って、布の中身を確かめるように覗き込む。</p><p class="q">「全部、作り直したんですか」</p><p class="q">「困ったままにしないためにね」</p><p>冴月さんが答えた。</p><p>月白先生が、手に持っていた点検票を冴月さんへ渡した。冴月さんはそれに目を通して、月白先生が書いたのとは別の欄に、自分の字で何かを書き足す。</p><p>確認書の、二つの筆跡を思い出した。処置を行う者だけで、続行の判断を閉じないこと。</p><p class="q">「……二人で確認する」</p><p>月白先生が、点検票から目を上げずに答えた。</p><p class="q">「俺だけでは、見落とす」</p><p>その言い方は、弱音のようには聞こえなかった。測った数字を読み上げるような声だった。</p><div class="sep" aria-hidden="true">◇</div><p>帰りがけに、廊下の奥を見た。</p><p>すりガラスの扉は、閉まっていた。光は、見えなかった。白い壁に扉が一枚、ただ閉じているだけだった。</p><p>その向こうに誰かがいることだけが、今は分かっている。</p><p>最初にここへ来たとき、あの扉の向こうは、息を止めて見るものだった。今は、見て見ぬふりもできない。</p><h3 class="sec" id="ch5-7"><span class="num">七</span><span class="name">まだ聞けていない注文</span></h3><p>その夜の食堂は、温かかった。</p><p>いつもの鍋。いつもの湯気。白い器が卓に並び、厨房の方からお玉の音がする。研究所の白さを見たあとだと、そのどれもが少しずつ色を持って見えた。</p><p>卓の端で、あの雪鳥が丸くなって眠っていた。</p><p>籠は使っていなかった。卓の木目の上に、そのまま。雪音さんがそこへ、小さな布を掛けてやっていた。</p><p class="q">「明日は、一緒に運びます」</p><p class="q">「ぴ……」</p><p>布の下から、半分眠ったような返事がした。</p><p class="q">「今日は寝かせとけ」</p><p>雪鬼さんが、鍋の前から言った。</p><p>食堂の奥を見た。</p><p>例の席。窓に近い、一番奥の席。椅子は今夜も卓へ寄せてある。その前に、小さな白い器が一つ、伏せて置かれていた。</p><p>最初の夜、この食堂で初めて夕飯を食べたときにも、そこにあった器だ。</p><p>雪鬼さんが、その器を手に取って、布巾で拭いていた。</p><p class="q">「そこへ戻れるように、取ってあるんですね」</p><p>雪鬼さんは器を拭く手を止めなかった。</p><p class="q">「戻ったら、何を食うか聞けるだろ」</p><p class="q">「いつものじゃなくて？」</p><p>器を光にかざして、拭き残しがないかを確かめる。それから雪鬼さんは、ようやくこちらを見た。</p><p class="q">「起きた時に食いたいもんなんか、起きなきゃ分からねえ」</p><p>拭かれた器が、棚へ戻された。</p><div class="sep" aria-hidden="true">◇</div><p>死んだ人の席だと思っていた。</p><p>最初の数日は、ずっとそう思っていた。毎朝拭かれる床も、伏せられた器も、誰かがいなくなった後の手入れのように見えていた。</p><p>そうではなかった。</p><p>まだ、聞けていない注文の席だった。</p><p>雪音さんの注文札を思い出した。表に前の欲しいもの。裏に今日の欲しいもの。</p><p class="q">「覚えていたら、変えちゃいけませんか？」</p><p>起きたら、その人の裏の欄に、何かが書かれるのだろうか。</p><div class="sep" aria-hidden="true">◇</div><p>食器を下げようとしたときだった。</p><p>冴月さんが、古い木箱を抱えて来た。卓の空いたところへ、そっと置く。表面の木が、手の脂で黒く艶めいている。何度も開け閉めされてきた箱だと分かった。</p><p class="q">「今度は、この家の話をしよう」</p><p>蓋が開く。</p><p>中には、小さな火箸が一膳、布に包まれていた。先の方に、焦げた跡がある。持ち手だけが、少し新しかった。</p><p>冴月さんは、その火箸をしばらく見ていた。懐かしむというより、数えているような目だった。あの夜から、どれだけの冬を、この火箸と越えてきたのかを。</p><p class="q">「宿になる前の夜から」</p><p>窓の外では、雪が音もなく降り始めていた。</p><p class="end">（第五章　終）</p></template>
<template id="t-ch6" data-label="第六章" data-title="最初の一夜"><header class="chap-head"><p class="chap-label">第六章</p><h2 class="chap-title">最初の一夜</h2></header><h3 class="sec" id="ch6-1"><span class="num">一</span><span class="name">火箸</span></h3><p>帳場の裏に、今は使われていない小さな暖炉があった。</p><p>石を積んだだけの、飾り気のない暖炉だ。灰はきれいに掃き出され、火床には薄く埃も積もっていない。使われていないのに、手入れだけは続いている。</p><p>冴月さんが、昨夜の木箱から火箸を取り出して、暖炉の縁へ置いた。</p><p>こと、と小さな音がした。</p><p>持ち手だけが新しい。先の焦げた跡は、何度も火に入れられて黒くなった色だった。</p><p class="q">「ここが、最初の？」</p><p class="q">「部屋は増えたけど、この石は残ってる」</p><p>縁を見る。片側だけ、少し低かった。積み直したのではなく、長いあいだ誰かがそこに腰を掛けて、すり減ったような低さだった。</p><p class="q">「僕も、休みに来ていたんだ。療養でね。宿を始めるつもりは、なかったのだけど」</p><p>冴月さんは、低い方の縁に、そっと指を置いた。</p><p>帳場にいるこの人しか知らなかった。道を確かめ、札を掛け、荷物を手の届くところに置いてくれる人。その人が、昔は客だった。休みに来た客。</p><p class="q">「休めました？」</p><p>冴月さんが、少し笑った。</p><p class="q">「最初の晩は、あまり」</p><div class="sep" aria-hidden="true">◇</div><p>雪の林だったと、冴月さんは言った。</p><p>今よりもっと木が密で、道と呼べるものはなかった。遠くに一軒だけ、灯りのついた小屋があった。療養のために借りていた、この暖炉のある小屋だ。</p><p>薪を集めに出た帰りだったという。</p><p>遠くで、雪が動いた。</p><p>白い狐がいた。</p><p>その足元に、白い蛇が倒れていた。雪と同じ色をしていて、狐がいなければ、そこに何かがいるとは思わなかっただろう。</p><p>狐も、立ち上がれていなかった。</p><p class="q">「……ねえ、こっち」</p><p>かすれた声だったと、冴月さんは言った。</p><p class="q">「倒れてる。お願い」</p><p>狐は、白い蛇の上に、自分の体を被せようとしていた。雪から守るように。自分の体温で、少しでも温めるように。けれど前足に力が入らず、うまくいかない。被さろうとしては、ずるりと滑って、また這い上がろうとする。</p><p class="q">「君もだね」</p><p>冴月さんは外套を脱いで、雪の上へ広げた。</p><p>白い二匹を、そのまま包んだ。</p><p>小屋の扉。薪。火が移る音。</p><p>鍋に水を張って、火にかけた。床に、毛布で寝床を二つ作った。どちらも、火へ近すぎないところに。冷え切った体を急に温めれば、かえって毒になる。療養の身で覚えたことだったという。</p><p>名前を聞く前に、湯が沸いた。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「薪を、思ったより使った」</p><p>冴月さんは、暖炉の縁の火箸を見ながら言った。</p><p class="q">「最初に覚えているのが、それですか」</p><p class="q">「足りなくなったら困るからね」</p><p>笑ってしまった。冴月さんも、つられて笑った。</p><p>木箱の底に、一枚の紙が折り畳まれていた。冴月さんがそれを広げて見せてくれる。黄ばんだ、かさかさの紙だった。</p><p>宿の名前はない。日付もない。</p><p class="q mark">《薪》《湯》《布》</p><p>必要だったものだけが、細く、まっすぐな、今と変わらない冴月さんの字で、並んでいた。</p><p>真宵家の帳簿の、いちばん最初の一頁は、おそらくこれなのだと思った。</p><h3 class="sec" id="ch6-2"><span class="num">二</span><span class="name">名前を知らなかった二匹</span></h3><p>夕方の回廊で、夜澄さんは窓を細く開けていた。</p><p>雪見格子の向こうに、庭が見える。冷たい空気が細く流れ込んで、回廊の暖かさと混ざらないまま、床の近くを漂っていた。</p><p>椅子は二脚、間を空けて置かれている。言われる前に、向こう側の椅子へ座った。</p><p>夜澄さんは、窓の外を見たまま言った。</p><p class="q">「私たちは、まだ互いの名前も知らなかった」</p><p>冴月さんの話の、続きだと分かった。</p><p class="q">「二人で、この山へ来たのでは？」</p><p class="q">「いや。別々に、捨てられた」</p><p>言葉を飾らなかった。</p><p>窓の外で、枝の雪が落ちた。どさりという重い音が、少し遅れて届く。</p><p class="q">「役に立つうちは呼ばれた。都合の悪いことが起きると、似たような力を恐れられた」</p><p>欲を吸う力。近くにいると、動きたがる力を少し吸ってしまう。長く傍にいれば、それだけでは済まない。</p><p>誰かにとってそれが役に立つ時期があって、そうでなくなる時期が来たのだと言われなくても分かった。</p><p class="q">「セツコさんも」</p><p class="q">「そう聞いている。私が目を覚ました時には、もう火のある部屋だったからね」</p><p>夜澄さんは、暖炉のある方を見なかった。見ないようにしているのか、見なくても分かっているのか。たぶん後の方だと思った。</p><p class="q">「助けられた方が、その翌朝には、誰かが道に迷っていないかと外を気にしていた」</p><p class="q">「まだ弱っていたのに」</p><p class="q">「冴月に座らされていたよ」</p><p>夜澄さんが、わずかに笑った。唇の端がかすかに動いて、すぐに戻る。その時のことを、ちょうどいい温度で覚えている人の笑い方だった。</p><p>冴月さんに座らされている白い狐を、思い浮かべた。立ち上がろうとするたびに、もう一度寝床へ戻されている。前の晩、雪の上で自分も立てないのに、誰かを包もうとしていた狐だ。</p><p class="q">「それから、雪狐が見つけ、私が気配を確かめ、冴月が寝床を増やすようになった」</p><p class="q">「役割ができた」</p><p class="q">「先に、毛布が足りなくなった」</p><p>そう言って、夜澄さんは膝の上の歌の帳面を開いた。頁をめくり、古い方の一頁で手を止めて、こちらへ向ける。</p><p>歌の帳面のはずなのに、その頁の端には、歌とは関係のない書き込みがあった。</p><p class="q mark">《布、二枚。毛布、一枚。冴月に頼む。》</p><p>歌を書きかけた行の横に、負けないくらいの大きさで。</p><p class="q">「立派な始まりではないよ」</p><p>夜澄さんは帳面をこちらへ向けたまま、そう言った。恥ずかしそうではなかった。ただ、本当のことを、本当の大きさで渡してくれているような言い方だった。</p><p>歌と、毛布の数が、同じ頁に並んでいる。</p><p class="q">「……その方が、ここらしいです」</p><p>夜澄さんが、こちらを見た。長い黒髪の内側で、灰桜の色がふっと揺れた。</p><p class="q">「君も、ずいぶんここの客になった」</p><p>それが褒め言葉なのかどうか、すぐには分からなかった。</p><p>でも、住人、とは言わなかった。客、と言った。その一言の選び方に、この人が測っている距離があるような気がした。</p><h3 class="sec" id="ch6-3"><span class="num">三</span><span class="name">柱の傷</span></h3><p>処置室の脇に、一本の柱がある。</p><p>診察を受けた日、処置室を出たところで、この柱を見た。月白先生も一瞬だけそちらへ目をやったことを、なぜか覚えていた。</p><p>低いところから、細い傷が続いている。小刀で横に引いたような、短い線が。一番下は、こちらの膝より少し高いくらいだった。</p><p>冴月さんが、古い記録を一冊持って来ていた。</p><p class="q">「月白に許可をもらった頁だけね」</p><p>開かれた頁には、細く、まっすぐな冴月さんの字が並んでいた。</p><p class="q mark">《雪豹の怪異、幼生。本人の申告、五歳。名前、月白。》</p><p class="q mark">《保温。食事。帰還先の照会を継続。》</p><p>頁をめくる。</p><p class="q mark">《帰還先を確認できず。当館で暮らす。》</p><p>五歳。</p><p>柱の一番下の傷を、もう一度見た。</p><p class="q">「この高さから……」</p><p>処置室の扉が開いた。</p><p>月白先生が出てきたところだった。手には、交換する布を持っている。柱の前に立っているこちらと、冴月さんが開いている記録とを、順に見た。</p><p>それから、柱の一番下を見た。</p><p class="q">「一番下は、背伸びした」</p><p class="q">「……ずるい」</p><p>冴月さんが、笑いを含んだ声で言った。</p><p class="q">「測り直された」</p><p>言われて見ると、一番下の短い線の、さらに少し下に、もう一本線があった。心もち浅く、心もち短い線。</p><p>つま先で立って、できるだけ高いところに線を引いてもらおうとした雪豹の子。それを見逃さず、踵をつけさせて、測り直した誰か。</p><p>その誰かが、引き直した線だけでなく、背伸びした線も消さずに残した。</p><p class="q">「それも残したんだよね」</p><p>冴月さんが言った。</p><p class="q">「消す方が目立つ」</p><p>月白先生はそう言って、布を棚へ置いた。表情は変わらなかった。でも、眼鏡を掛けた横顔の、雪豹の斑のある側頭部のあたりで、耳がぴくりと動いた気がした。</p><p class="q">「帰る場所がなかったから、ここに？」</p><p class="q">「ああ」</p><p class="q">「でも、ここは帰す家で」</p><p>言いかけて、自分でも何を訊きたいのか分からなくなった。</p><p>帰す家。道標には帰りの矢印が彫ってあって、帳場には出発する人の荷物が置いてある。でも、帰る先のない子は、どこへ帰されるのだろう。</p><p>冴月さんが、記録を閉じずに言った。</p><p class="q">「帰る場所がない子を、雪へ戻すところではないよ」</p><p>当たり前のことを、当たり前の声で言った。それで、さっきの問いの答えになっていた。</p><p>柱の傷を、上へ辿っていく。</p><p>次の傷。その次。少しずつ、間隔が開いていく。毎年同じ頃に測っていたのだとしたら、この子は、この館で、ずいぶん長い時間を過ごしたことになる。</p><p>そして、あるところから先は、長く間が空いていた。</p><p class="q">「ここを出た。勉強して、研究して、自分で暮らした」</p><p>月白先生が言った。</p><p class="q">「それから、戻ってきた？」</p><p class="q">「そうだ」</p><p>冴月さんが、別の年代の頁を開く。紙の色が、前の頁とは少し違っていた。</p><p class="q mark">《帰館・月白。》</p><p class="q mark">《研究棟の使用相談。》</p><p>最初の記録から、長い年月が流れていた。</p><p class="q">「セツコさんと、伴侶になったのは」</p><p>訊いていいことなのか、言ってから少し迷った。</p><p>月白先生は、迷わずに答えた。</p><p class="q">「戻ってきてからだ」</p><p>それから、柱の上の方の傷へ目をやった。</p><p class="q">「子どもの頃は、姉のようなものだった。遊んでもらった覚えしかない」</p><p>冴月さんが、記録の頁を押さえたまま言った。</p><p class="q">「育てたのは僕だよ。測り直したのもね」</p><p>背伸びを見逃さなかった誰か。それが誰だったのか、ようやく分かった。</p><p class="q">「戻ったら、見上げていたはずの相手を、見下ろしていた」</p><p class="q">「……それで？」</p><p class="q">「物品を客に配って、自分の分を忘れる。踊り出したら、倒れるまでやめない。前からそうだったのに、子どもの目には分からなかった」</p><p>月白先生は、柱から目を離した。</p><p class="q">「放っておけなかった。大人になってから、互いに選んだ」</p><p>互いに選んだ。</p><p>その言葉の選び方が、この人らしいと思った。最初から決まっていたわけではない。外で暮らして、自分の足で立って、戻ってきて、昔と同じ人を、昔とは違う高さから見た。それから、二人で選んだ。</p><p>冴月さんが、頁を閉じた。</p><p>それより先の話は、誰も続けなかった。月白先生は棚の布を整えて、処置室へ戻っていった。</p><p>扉が閉まる前に、一度だけ、柱の一番下の傷を見たように見えた。</p><h3 class="sec" id="ch6-
