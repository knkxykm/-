4"><span class="num">四</span><span class="name">取り分</span></h3><p>厨房の棚には、器が何層にも重ねられている。</p><p>雪鬼さんがその前で腕を組んでいた。昨夜の宿泊客の数と、今朝の天気と、何か別のものを数えている顔だった。やがて手を伸ばして、一番奥から小さな白い器を一つ取り出した。</p><p>食堂の奥の席に伏せてあるのと、同じ形の器だった。</p><p>裏返すと、高台のところに、欠けを継いだ跡があった。金ではなく、ひかえめな銀色の線。</p><p class="q">「それも、昔から？」</p><p class="q">「俺が知ってる頃には、もうあった」</p><p>雪鬼さんは器を光にかざし、継ぎ目にひびがないかを確かめるように回した。</p><p class="q">「セツコさん、どんな食べ方をしていたんですか」</p><p class="q">「客に配って、自分の分を忘れる」</p><p>即答だった。</p><p class="q">「……月白先生も、同じことを言ってました」</p><p>雪の上で、自分も立てないのに誰かを包もうとした狐。助けられた翌朝に、もう外の迷い人を気にしていた狐。その狐が、卓いっぱいの客に汁を配って回って、最後に自分の器が空のままだと気づくところまで、すぐに思い浮かんだ。</p><p class="q">「だから最後の一杯は、俺が取っておいた」</p><p>雪鬼さんはそう言って、器を布巾で拭いた。</p><p class="q">「帳簿もあいつがつけてた。満月の前の日だけ、字が走るんだ。楽しみで、指が先に行くらしい」</p><p>帳場の棚の、丸みのある字を思い出した。ところどころで走っている、書くことより先の何かを待ちきれなかったような字。《宴》と書かれた文字。それから、研究所の確認書に残っていた、もう一つの筆跡。</p><p>同じ手だったのだ。</p><p>宴を楽しみに字を走らせていた手が、自分を眠らせるための確認書に名前を書いた。</p><div class="sep" aria-hidden="true">◇</div><p>少しして、喫茶席の方から雪音さんが来た。</p><p>カウンターの向こうに立つと、雪音さんの肩は天板からやっと出るくらいだった。水色の前掛けの紐が、小さな背中で蝶結びになっている。踏み台に乗って、雪鬼さんの手の中の器を覗き込んだ。</p><p>それから、手に持っていた布を、その継ぎ目にそっと当てた。拭くのではなく、ただ当てるだけだった。</p><p class="q">「僕、その話を聞いてから、数えるようになりました。配る人の分も」</p><p>雪音さんが、湯籠を一つずつ数えていたことを思い出した。雪鳥の入った籠も、ちゃんと数に入れていたことも。</p><p class="q">「雪音さんが見た話ではないんですね」</p><p class="q">「古い宴は、見ていないです。でも、今ここで困ることなら分かります」</p><p>雪音さんは布を器から離して、小さな手で丁寧に畳んだ。</p><p class="q">「配った後で、誰かだけ飲み物がないとか」</p><p>雪鬼さんが、黙って湯飲みを一つ、雪音さんの前に置いた。踏み台に乗った雪音さんの手が、ちょうど届くところに。</p><p class="q">「お前のだ」</p><p>雪音さんが、少し黙った。</p><p>湯飲みの湯気が、小さな顔の前で立ち昇っている。</p><p class="q">「……ありがとうございます」</p><p>両手で包み込むようにして、雪音さんは湯飲みを持ち上げた。</p><div class="sep" aria-hidden="true">◇</div><p>その夜、記録の紙に一行書き足した。</p><p class="q mark">《空席の人にも、取り分があった。》</p><h3 class="sec" id="ch6-5"><span class="num">五</span><span class="name">撮られなかった次の動き</span></h3><p>夕暮れの雪庭で、ヒノエが敷石の上に立っていた。</p><p>丸い敷石だった。鳥の形をした細い足の指が、石の縁をしっかりとつかんでいる。</p><p>笛は、まだ吹いていなかった。懐にも入れず、手に持ったまま、ただ握っている。</p><p>冴月さんが、古い舞扇を持って来ていた。閉じたままの白い扇。一度修繕された跡が、要のあたりに残っている。帳簿の《舞扇、修繕》の一行を思い出した。</p><p class="q">「ここに、いたんだ」</p><p>ヒノエが言った。扇を見ずに、庭の真ん中を見ていた。</p><p class="q">「ぼくが吹いて、あのひとが一歩出る。すると、みんなも出てくる」</p><div class="sep" aria-hidden="true">◇</div><p>月が満ちていた、とヒノエは言った。</p><p>赤い袖が、笛を口元へ運ぶ。</p><p>最初の一音で、雪の庭の真ん中に、白い影が一歩進み出た。</p><p>白い髪だった。</p><p>月の光を集めたような長い白髪が、歩くたびに弧を描いて揺れる。頭の上には尖った狐の耳があり、裾からは、ふっくらとした白い尾がこぼれている。髪に挿された冬薔薇が、月を返して白く光った。</p><p>雪狐は、白い舞扇を開いた。</p><p>足を運ぶ。雪の上で、半円を描くように。</p><p>その周りを、小さな狐たちが回りはじめた。林の方から、雪の中から、屋根の陰から。鳥が降りてくる。雪の獣が走ってきて、勢いあまって行き過ぎ、雪の中に転んだ。</p><p class="q">「早い、早い」</p><p>笛を吹きながら、ヒノエが笑っている。</p><p>雪狐も笑った。肩を揺らして、声を出して。それから、足を止めた。</p><p>半円の、ちょうど終わりで。</p><p>狐たちが、止まった。鳥も止まった。転んだ雪の獣が、起き上がりかけた姿勢のまま、じっとした。</p><p>一拍、空いた。</p><p>その間に、歌が入った。</p><p class="q">「月の夜、狐は舞い、紅鸞が笛を吹く」</p><p>庭の端、少し離れた石灯籠の影から。夜澄さんの声だった。</p><div class="sep" aria-hidden="true">◇</div><p>ここまでは、食堂の写真と同じだった。</p><p>白く舞う影。赤い笛吹き。弧を描く袖。その弧の先を見ている、笛吹きの目。</p><p>ヒノエの話は、その先へ続いた。</p><p>写真には撮られなかった、次の動きへ。</p><p>雪狐が、舞扇を閉じた。</p><p>閉じた扇を、ゆっくりと下へ下ろしていく。水面を撫でるように。眠っている子の背中に、毛布を掛けるように。</p><p>狐たちが、その場に座り込んだ。鳥が羽を畳んだ。転んでいた雪の獣が、起き上がるのをやめて、雪の上で丸くなった。</p><p>笛の音が、小さくなっていく。歌が、それに合わせて低くなる。</p><p>集めるだけではなかったのだ。集めて、踊って、それから休ませて帰していた。満月の夜の、それが一度きりの完成した形だった。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「続きを、待ってた」</p><p>ヒノエが言った。敷石の上で、笛を握る指に力が入っている。</p><p>思わず、口に出していた。</p><p class="q">「セツコさんが眠っても、笛を吹いたんですね」</p><p class="q">「吹いたら、来ると思ったんだ」</p><p class="q">「でも、来たのは、雪の獣たちだけだった」</p><p>ヒノエが、頷いた。</p><p class="q">「何度吹いても、次の足が来なかった」</p><p>雪庭の、あの半円のあった場所を見た。</p><p>もう、ほとんど見えなかった。何日も雪が降って、上から平らに覆い隠している。それでも、どこにあったかは分かった。</p><p>呼ばれて集まってきたものたち。その先で、扇を下ろしてくれるはずの誰かが、いなかった。止まる合図も、帰る合図もないまま、笛の音だけが膨らんでいった。</p><p>責める言葉は、いくつも思いついた。でも、どれも厨房や見回りで、もう口にした言葉だった。見回りの夕方に、この人は一度言葉に詰まって、自分で笛を差し出した。</p><p>だから、訊いたのは別のことだった。</p><p class="q">「……次は、待ち方を変えられますか」</p><p>ヒノエが、手の中の笛を見た。</p><p>それから、冴月さんを見た。冴月さんは、閉じた舞扇を持ったまま、何も言わずに待っていた。</p><p class="q">「……合図を、見ようか」</p><p>冴月さんが、小さく頷いた。</p><p class="q">「次の満月は、勝手に始めないでほしい」</p><p class="q">「吹くな、じゃなくて？」</p><p class="q">「始める時も、止める時も、一緒に決めよう」</p><p>ヒノエは、少し不満そうに息を吐いた。白い息が、夕暮れの空気へゆっくりとほどける。</p><p>それから、頷いた。</p><p class="q">「ぼくの音だけじゃ、足りないんだね」</p><p>敷石から降りて、ヒノエは笛を懐へしまった。</p><h3 class="sec" id="ch6-6"><span class="num">六</span><span class="name">四つの記録</span></h3><p>帳場の机に、四つのものを並べた。</p><p>《薪》《湯》《布》の紙の写し。</p><p>柱の傷を写し取った紙。</p><p>食堂の壁から外してきた宴の写真。</p><p>処置確認書の、共有を許された部分の写し。</p><p>冴月さんが、帳場の奥で宿帳をつけている。夜澄さんは、窓辺の、机から一番遠い椅子にいた。月白先生は、観測記録を一枚持って、帳場の入口に立っている。</p><p>順番を、決めなければいけなかった。</p><p>最初は、写真をいちばん左に置いた。いちばん古そうに見えたからだ。色が褪せて、月と雪の区別がつかなくなっている。</p><p>でも、火箸の夜には、まだ宿の名前もなかった。宴の帳簿には、満月の印が何年分も並んでいた。</p><p>写真を、右へ動かした。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「最初に、二匹と、火を焚いた人」</p><p>《薪》《湯》《布》の写しを、左端に置いた。名前を聞く前に、湯が沸いた夜。</p><p class="q">「次に、帰る先のなかった子が、ここで育った」</p><p>柱の傷の写しを、その隣に。背伸びした線と、測り直された線が、二本とも写し取られている。</p><p>入口の方で、月白先生がすっと視線を外したのが分かった。</p><p class="q">「長い時間があって。宿が続いて、満月には宴があった」</p><p>写真を置く。白髪の狐が弧を描いて、赤い笛吹きがその先を見ている。写真の外には、扇を下ろす、撮られなかった次の動きがある。</p><p class="q">「そして、セツコさんの欲が、周りの人まで留めるようになった」</p><p>最後に、確認書の写しを置いた。</p><p class="q mark">《起きて暮らす方法を探すことを、やめないこと。》</p><p>宴の帳簿と同じ、丸みのある字の横に。</p><div class="sep" aria-hidden="true">◇</div><p>窓辺から、夜澄さんの声がした。</p><p class="q">「助けたかった。失いたくなかった。一緒にいたかった。初めの気持ちまで嘘になったわけではない」</p><p>雪の上で自分を被せようとした狐。客に配って自分の分を忘れる狐。満月の前の日に、字を走らせていた狐。</p><p>全部、同じ狐だった。</p><p class="q">「でも、帰りたい人まで帰れなくなる」</p><p class="q">「うん。それは、止めなければならなかった」</p><p>夜澄さんは、それを言うときも声を変えなかった。止める側に立った者として、ずっとその声で言い続けてきたのだと思った。</p><p>月白先生が入ってきて、写真の横に観測記録を一枚置いた。</p><p>満月の印のたびに跳ね上がる線。九尾化指数。</p><p class="q">「眠りで出力を抑えた。眷属とのつながりまで、すべて消えたわけじゃない」</p><p>帳場の奥から、冴月さんが顔を上げた。</p><p class="q">「そこで笛が鳴る。集まる。でも、迎えて整える相手がいない」</p><p>筆を取った。</p><p>写真と観測記録の間に、紙を一枚置く。宴の帳簿を見つけた夜に、客室で書いた二つの見出しを、もう一度書いた。</p><p class="q mark">《宴》</p><p class="q mark">《魔障鎮静》</p><p>その間に、一本、線を引いた。</p><p>あの夜は、何も書けなかった。折り込まれたままのものを、無理に広げれば、大事なことを見落としてしまいそうだった。今は、その折り目の内側に何があったのかが、半分ほど分かる。</p><p>壊れた宴。</p><p>呼ばれて、集まって。帰ってきた先が、空いていた。</p><p>最初の夜、窓の外で手招きしていた白い影を思い出した。庭の雪の上、館へ向かって点々と続いていた足跡も。</p><p>おいで、と言っていたのだと思っていた。誘い込むために。</p><p>そうではなかったのかもしれない。あの影もまた、呼ばれて来て、扇を下ろす手を探していたのかもしれない。帰る場所を、そこしか知らなかったのかもしれない。</p><p class="q">「襲うつもりじゃなくても、危なくなるんですね」</p><p>月白先生が、写真から目を離さずに答えた。</p><p class="q">「そう。だからこそ、戻せる方法が要る」</p><div class="sep" aria-hidden="true">◇</div><p>四つの記録を重ねて、紐で綴じた。</p><p>表紙には、何も書かなかった。火箸の夜から今日までが何年なのか、数えようとすれば数えられるのかもしれない。でも、その数字は、この綴りには要らない気がした。</p><h3 class="sec" id="ch6-7"><span class="num">七</span><span class="name">朝、開ける</span></h3><p>夜の帳場は、灯りが落とされていた。</p><p>玄関の土間に、乾いた靴が揃えてある。その中に、自分の靴もあった。札が表になった朝、つま先をこちらへ向けて置かれていた靴。今も、同じ向きで並んでいる。</p><p>しゃがみ込んで、紐を見た。雪はついていなかった。誰かが、毎晩拭いてくれているのかもしれない。</p><p class="q">「何か忘れ物？」</p><p>帳場の奥の暗がりから、冴月さんの声がした。灯りを落とした帳場で、まだ宿帳を閉じていなかったらしい。</p><p class="q">「忘れていないか、見に来ました」</p><p class="q">「靴を？」</p><p class="q">「帰れることを」</p><p>冴月さんが、帳場から出てきた。上がり框に腰を下ろして、靴の横に座る。何も訊かずに、ただ座った。</p><p>しばらく、何も言えなかった。</p><p>火箸の夜。柱の傷。宴の写真。確認書。四つを並べて、一本の線でつないだ。この家がどうしてこうなったのか、少しずつ分かってきた。次の満月に何が起きるのかも。迎え湯の木戸の向こうで、何が待っているのかも。</p><p>最後まで、知りたかった。</p><p>それと同じくらい、怖かった。</p><p class="q">「ここで起きていること、最後まで知りたいです。でも、それで、帰らなくていい理由ができたみたいに思うのは」</p><p>そこで、言葉が途切れた。</p><p>続きを言えば、それが本当になってしまいそうだった。</p><p>冴月さんは、続きを促さなかった。玄関の戸を見ていた。閉ざされた戸の下の隙間から、夜の冷気が細く入ってきている。</p><p class="q">「明日、また道を確かめるよ」</p><p>冴月さんを見た。</p><p class="q">「話が大きくなっても、その仕事は変わらない」</p><p>何も変わらない声だった。道標の裏に帰りの矢印を彫っていたときとも。荷物を手の届くところに置いてくれたときとも。火箸の夜に、薪の数を数えていたときとも、たぶん同じ声。</p><p>眠る人の話を聞いても。壊れた宴の話を聞いても。この人の手元には、明日の朝の道がある。</p><p>それで、途切れた言葉の続きが、少し形を変えて出てきた。</p><p class="q">「……帰った先で、どう過ごすか、考えたいです」</p><p>帰るかどうかではなく。帰った先で。</p><p>言ってから、その違いに自分で驚いた。</p><p>帰ったら、まず湯を沸かす。帰った後にも、休む時間を残す。記録の紙に書いてきた小さな一行たちが、いつの間にか、帰った先の日々の形を少しずつ作っていた。</p><p>冴月さんは、目を細めた。</p><p class="q">「うん。そのための時間も、ここで使っていい」</p><div class="sep" aria-hidden="true">◇</div><p>廊下の奥から、小さな足音が来た。</p><p>雪鳥が一羽、戸締まりの札をくわえていた。自分の体より少し小さいくらいの木の札だ。冴月さんの足元まで来て、それを差し出す。</p><p>表には、《夜間閉鎖》。</p><p>冴月さんがそれを受け取って、裏を返して見せてくれた。</p><p class="q mark">《朝、開ける》</p><p>冴月さんは、表をこちらへ向けて、玄関の戸に掛けた。</p><p>夜間閉鎖。</p><p>でも、その札の裏側に何が書いてあるのか、もう知っている。閉ざされた戸の向こうで、朝が来れば、誰かがそれを裏返す。</p><p>靴をもう一度だけ見て、立ち上がった。</p><p class="q">「おやすみなさい」</p><p class="q">「おやすみ」</p><p>廊下を歩きながら、後ろで帳場の宿帳が閉じられる音を聞いた。</p><div class="sep" aria-hidden="true">◇</div><p>渡り廊下の戸が、少しだけ開いていた。</p><p>その隙間から、鏡さんの顔がのぞいた。</p><p class="q">「帰れることを、見に行ったんだって？」</p><p class="q">「……冴月さんから？」</p><p class="q">「雪鳥から。あいつら、口が軽い」</p><p>鏡さんは戸に寄りかかって、腕を組んだ。</p><p class="q">「いいね、それ」</p><p class="q">「いいんですか」</p><p class="q">「帰れるか確かめに行くのは、帰りたい人だけじゃない。帰れるって知ってて、ここにいたい人もやる」</p><p>尾が、廊下の床をゆっくり一度だけ撫でた。</p><p class="q">「どっちでもいいんだよ。知ってれば」</p><p>どっちなのか、とは訊かれなかった。</p><p>訊かれないまま、離れの灯りの下で、少しだけ立ち話をした。何を話したのかは、あとから思い出そうとしても、よく思い出せなかった。たぶん、大したことではなかった。</p><p>部屋へ戻る廊下で振り返ると、鏡さんはまだ戸口に立っていた。</p><p>こちらが角を曲がるまで、そこにいた。</p><p class="end">（第六章　終）</p></template>
<template id="t-ch7" data-label="第七章" data-title="帰るための準備"><header class="chap-head"><p class="chap-label">第七章</p><h2 class="chap-title">帰るための準備</h2></header><h3 class="sec" id="ch7-1"><span class="num">一</span><span class="name">三つの水盤</span></h3><p>迎え湯の木戸が、開いていた。</p><p>半月ほど前の夕方、月白先生が図面を広げたまま動かなかった、あの木戸だ。蝶番には新しい油が差されて、閉ざされていたことが嘘のように、音もなく開く。</p><p>向こう側には、古い図面と同じ水路が走っていた。</p><p>雪鬼さんが、最後の木の蓋を持ち上げる。雪鳥が灯りを差し出して、その下を照らした。途中で塞がれていたはずの湯路が、先へ、林の向こうへと続いている。</p><p class="q">「こっちは、研究所の方？」</p><p class="q">「そう。古い流れを、もう一度つないだ」</p><p>冴月さんが答えた。</p><div class="sep" aria-hidden="true">◇</div><p>研究所の一番奥に、小さな部屋があった。</p><p>床に、浅い石の水盤が三つ並んでいる。それぞれに、壁の向こうから細い湯路が引かれていた。鎮め湯から。戻り湯から。そして、今朝のいちばん最後につながった、迎え湯から。</p><p>月白先生が、水盤の前に立っていた。</p><p class="q">「湯を混ぜるな。三つ、別々に確認する」</p><p>鎮め湯の水盤に、湯が満ちる。水面の小さな揺れが、すっと静まる。</p><p>戻り湯の水盤に、湯が満ちる。天井の灯りが水面に映り、ぶれていた輪郭がひとつの形になる。</p><p>そして、迎え湯。</p><p>湯が水盤の底に届き、縁まで昇っていく。水盤の底に刻まれた線が、下から光りはじめた。途切れていた線が、少しずつ、向こう側へ伸びていく。</p><p>つながった。</p><p>それから、少し揺れて、また途切れた。</p><p class="q">「……駄目？」</p><p>月白先生が、首を横に振った。駄目ではない、というより、まだ結論を出すところではない、という振り方だった。</p><p class="q">「戻りの流れが速い。湯口を一段絞れ」</p><p>雪鬼さんが、壁際の弁に手をかける。冴月さんが、水盤の脇の札を少しずらす。雪音さんが、踏み台に乗って壁の時計を見上げ、帳面に時刻を書き留める。</p><p>全員の手が、同時に動いていた。誰も、誰かの指示を待たなかった。</p><p>自分にできることが、思いつかなかった。だから一歩下がって、道具を渡す人が通れるように、壁際を空けた。それだけは、できた。</p><p>もう一度。</p><p>湯が水盤を満たす。底の線が光り、伸びて、つながる。</p><p>消えなかった。</p><p>誰も、すぐには喜ばなかった。水盤に落ち続ける湯の音を、全員が、息を潜めて聞いていた。一度途切れたものが、もう一度途切れないか。数えるように待った。</p><p>十。二十。</p><p class="q">「……維持している」</p><p>月白先生の声は、低かった。測った数字を読み上げる声。</p><p>でも、黒い手袋の指が、水盤の縁にそっと触れていた。触れて、そのまま、しばらく離れなかった。</p><p class="q">「今の状態、記録しました」</p><p>雪音さんが、踏み台の上から言った。</p><p>雪鳥が、足元で札を一枚裏返した。表には《通行止》。裏には《通行可》。それを嘴にくわえて、高く掲げる。</p><p class="q">「できた！」</p><p>冴月さんが、その札を見た。</p><p class="q">「うん。札の向きだけ、もう一度」</p><p>札は、上下が逆さまだった。</p><h3 class="sec" id="ch7-2"><span class="num">二</span><span class="name">未使用の処置票</span></h3><p>説明室の机の上に、小さな箱が一つ置かれていた。</p><p>白い箱だった。蓋の端に、角の立った字で日付が書かれている。その横に、まだ何も書き込まれていない処置票が一枚。欄の線だけが、きっちりと引かれていた。</p><p>月白先生が、箱の蓋を閉めた。</p><p class="q">「起こす準備だ。眠らせないための準備でもある」</p><p>薬の綴りの、最後の頁を思い出した。書き直しばかりの、新しい綴り。《迎え湯での維持確認：未了》という空欄。</p><p>その欄は、今朝、埋まったのだ。</p><p class="q">「完成したんですか」</p><p class="q">「今回の処方はな。起きて暮らせるかは、本人の反応を見て確かめる」</p><p>完成した、とは言わなかった。この人は、水が出たことと使えることを、最後まで混ぜないのだと思った。</p><p>冴月さんが、椅子を引いて座った。</p><p class="q">「途中で止める場合も、確認しよう」</p><p>月白先生が、机の上に二枚の紙を並べた。</p><p>一枚は、古い確認書の写し。二つの筆跡。《意思を確かめられる時には、その都度、処置を続けるか尋ねること。》</p><p>もう一枚は、新しい計画。角の立った字が、行ごとに番号を振られて並んでいる。</p><p class="q">「最初は、返事ができるところまで。答えが取れなければ、先へ進めない」</p><p class="q mark">《無応答を同意として扱わず。》</p><p>二冊目の記録にあった一行を、思い出した。この人は、何度もそこで止まってきたのだ。</p><p class="q">「全員で準備したのに、そこで止めることも？」</p><p>訊いてから、意地の悪い訊き方だったかと思った。でも、訊かずにはいられなかった。湯路を開けた雪鬼さんの手も、時刻を書き留めた雪音さんの帳面も、札を逆さまに掲げた雪鳥も、全部見ていたから。</p><p class="q">「準備した側の都合だ」</p><p>月白先生は、即答した。</p><p>短い間があった。</p><p class="q">「中止しても、湯も記録も残る。次に使える」</p><p>余白の書き込みを思い出した。急ぐ理由は、こちらにしかない。</p><p>冴月さんが、計画の紙の端に、自分の字で確認の印を付けた。処置を行う者だけで、続行の判断を閉じないこと。その一行のために、この人の字がそこにある。</p><p class="q">「満月にするのは、どうしてですか」</p><p>九尾化指数の表を思い出していた。満月のたびに跳ね上がる線。一番危ない夜に、なぜ。</p><p class="q">「九尾化の反応が強い。負担も大きいが、眠りの術式と本人の反応を分けて観測しやすい」</p><p>分けて観測する。分けて確認する。この人の言葉は、いつもそこへ戻ってくる。</p><p class="q">「だから、館の方は全員で守る。月白を呼び戻さずに済むように」</p><p>冴月さんが言った。</p><p>呼び戻さずに。</p><p>それは、処置の途中でこの人を離れさせないということだった。観測窓の前で、離れられない、と連絡器越しに言っていた声を思い出した。その夜だけは、誰もこの人を呼んではいけない。</p><p>月白先生が、計画の紙を閉じた。</p><p class="q">「その夜しかない、とは思うな。条件が崩れたら見送る」</p><p>それは、誰に向けた言葉だったのだろう。</p><p>こちらに。冴月さんに。それとも、この人自身に。</p><p>白い箱の脇で、未使用の処置票は、まだ空欄のままだった。</p><h3 class="sec" id="ch7-3"><span class="num">三</span><span class="name">持ち場</span></h3><p>次の朝、館の音が、いつもより速かった。</p><p>急いでいるのではなかった。誰も走っていない。ただ、いつもの音の拍が、くっきりしている。足音の間隔。扉を開け閉めする音。器が重なる音。</p><div class="sep" aria-hidden="true">◇</div><p>帳場では、冴月さんが館の見取り図を広げていた。</p><p>赤い印と、青い印。閉ざす扉と、開けておく扉。最初の満月の夜に、数十秒で宿が防衛の構えに変わったとき、その裏側にはこの図があったのだと分かった。</p><p class="q">「西を閉めても、東は残す。荷物を扉の前へ置かないで」</p><p class="q">「りょうかい！」</p><p>梁の上から、棚の隙間から、雪鳥たちの返事がいっせいに返ってくる。今度は、一羽分も足りなくはなかった。</p><div class="sep" aria-hidden="true">◇</div><p>厨房では、雪鬼さんが大鍋の蓋を開けていた。</p><p>湯気が、天井まで一気に昇る。小さな器が、左の台に数十。蓋つきの入れ物が、右の台に数十。</p><p class="q">「運ぶ分と、ここで食う分。間違えるなよ」</p><p>雪鳥が一羽、左の台へ跳び乗った。</p><p class="q">「たべるぶん！」</p><p>雪鬼さんは、その雪鳥の前に小さな器を一つ置いた。</p><p class="q">「それはお前のだ」</p><div class="sep" aria-hidden="true">◇</div><p>喫茶席では、雪音さんが看板を裏返していた。</p><p>踏み台に乗って、扉の横の釘に手を伸ばしている。小さな背中が、つま先立ちで一生懸命伸びていた。</p><p class="q mark">《本日夜・休み》</p><p class="q">「飲み物はこちらで渡します。いつもの席は、休憩用に空けます」</p><p>踏み台から降りながら、雪音さんは言った。いつもの席。布巾の落ちた、あの窓際の席だ。</p><div class="sep" aria-hidden="true">◇</div><p>廊下の外から、歌が聞こえた。</p><p>言葉のない、短い歌。窓の外の雪の上で、夜澄さんが歌っていた。歌い終えてから、玄関の方へ回って館に入ってくる。</p><p class="q">「戻ってきたんですね」</p><p class="q">「約束の夜だからね。吸いすぎないよう、離れる場所も用意した」</p><p>離れる場所。湯屋のいちばん遠い椅子。庭の端の石灯籠の影。この人は、どこへ行っても、まずそれを探すのだと思った。</p><div class="sep" aria-hidden="true">◇</div><p>雪庭では、ヒノエが笛を持って立っていた。</p><p>懐にはしまっていない。でも、口元にも運んでいない。</p><p class="q">「まだ吹かない。分かってる」</p><p>訊かれる前に、ヒノエはそう言った。</p><p>冴月さんが、庭の灯りを一つずつ指す。</p><p class="q">「うん。合図は、見える？」</p><p>ヒノエは灯りの位置を確かめて、それから自分で一歩、立つ場所をずらした。灯りと、冴月さんの立つ場所が、両方とも見える場所へ。</p><div class="sep" aria-hidden="true">◇</div><p>東の廊下では、鏡さんが毛布を畳んで積んでいた。</p><p>客室の並ぶ側の、いちばん奥。最初の夜、白い影が手を上げた窓の近くだった。</p><p class="q">「今日は、お仕事は」</p><p class="q">「休み取った。満月の前の日だから」</p><p>鏡さんは、畳んだ毛布をもう一枚、山の上に載せた。</p><p class="q">「鏡さんの持ち場は？」</p><p class="q">「俺？　ここ」</p><p>鏡さんは、畳んだ毛布の山を手のひらで叩いた。</p><p class="q">「客室側の戻り道。迷子になった人を、連れて帰る係」</p><p class="q">「迷子」</p><p class="q">「満月の夜は、館の中でも迷うから」</p><p>鏡さんは、毛布の山の向こうから、こちらを見た。</p><p>いつもの軽い声だった。でも、目は笑っていなかった。笑っていないのに、少しも怖くなかった。</p><div class="sep" aria-hidden="true">◇</div><p>帳場へ戻ると、冴月さんが見取り図を畳んでいた。</p><p class="q">「どこへ行けばいいですか」</p><p class="q">「三つから選べる。途中で変えてもいい」</p><p>冴月さんは、指を三本立てた。</p><p>境界の内側で、札と鎮めの灯りを持って守りを手伝う。館の中で、伝令と物資の受け渡しをする。守られた客室で、待つ。</p><p>どれを選んでも、この人の声は変わらないのだろうと思った。</p><p>最初の満月の夜、守られながら廊下の隅で震えていた自分を思い出した。あの夜は、何が起きているのか分からなかった。今は、分かっている。</p><p>分かっているから、手の届くところだけでも、何かを運びたかった。</p><p class="q">「……館の中で、運ぶ仕事をしたいです」</p><p>言ってから、ひとつ訊きたくなった。</p><p class="q">「札は、先に全部の窓へ貼っておけないんですか」</p><p class="q">「全部の窓に貼れば、この家ごと眠る。開いていていい窓まで、閉じてしまう」</p><p>冴月さんは、畳んだ見取り図の上に手を置いた。墨の匂いがした。昨夜、遅くまで書いていたのだと思った。</p><p class="q">「鎮めの札は、眠りを保つためのものだから。ここに住んでいるのは、ほとんどが怪異だよ。束で持てば、持った手から鈍っていく」</p><p>冴月さんは、自分の袖を軽く叩いた。</p><p class="q">「……僕は、少し慣れているけどね」</p><p class="q">「だから、呼ばれた窓に一枚ずつ」</p><p class="q">「そう。貼るのは一瞬でいい。でも、束を預かって、番号どおりに渡す手は、鈍らない方がいい」</p><p>冴月さんが、こちらを見た。</p><p class="q">「君の手なら、鈍らない」</p><p>頼む、とは言わなかった。</p><p>冴月さんは、後ろを振り返った。</p><p>雪音さんが、いつの間にか帳場の入口にいた。小さな手に、行き先を書いた紙札の束を握っている。術の入っていない、ただの紙だった。その一枚を、こちらへ差し出した。</p><p class="q">「分からなくなったら、止まって聞いてください。走らなくて大丈夫です」</p><p>札を受け取る。</p><p>雪音さんの字だった。いつもの注文札と同じ、小さくてきちんとした字。</p><h3 class="sec" id="ch7-4"><span class="num">四</span><span class="name">明るいうちの道</span></h3><p>夕方、玄関に呼ばれた。</p><p>土間の隅に、下山用の道具が揃えてあった。杖。小さな灯り。雪よけの外套。その横に、自分の靴が並べられている。</p><p>冴月さんが、玄関の戸を開けた。</p><p>冷たい空気が、足元から入ってくる。外はまだ明るかった。遠くの山の稜線が、薄い橙色の空を背にして、はっきりと見えている。最初に迷った雪の夜には、一度も見えなかった稜線だった。</p><p class="q">「明るいうちなら送れる」</p><p>冴月さんは、戸の外を見たまま言った。</p><p class="q">「明日の満月をここで迎えるとしても、手伝いの約束じゃない」</p><p class="q mark">《下山路・通行可》の札。帳場のこちら側に置かれた荷物。冴月さんは、あの日から一度も、ここに留める理由を作らなかった。湯を直したときも。研究所へ行ったときも。確認書を読んだときも。</p><p>そして今も、明日が満月だというのに、戸を開けている。</p><div class="sep" aria-hidden="true">◇</div><p>帰れる。</p><p>あの朝、喉の奥で引っかかったものが、今は引っかからなかった。その代わりに、別のものが喉のあたりにあった。もっと静かで、もっとはっきりした形をしているもの。</p><p>明日の夜、この館で何が起きるのか。</p><p>研究所の一番奥で、白い箱が開けられる。空欄の処置票に、何かが書き込まれる。黒髪の人が、返事をするかもしれないし、しないかもしれない。雪庭で、ヒノエが合図を待つ。</p><p>それを見届けたかった。見届けたいと思う自分を、止める理由はなかった。</p><p>でも、その後で。</p><p class="q">「……満月を越えたら、帰りたいです」</p><p>言ってから、それが自分の声だったことに、少し驚いた。</p><p>迷っている声ではなかった。決めた声だった。でも、何かを切り捨てて決めた声でもなかった。ここにいたい気持ちも、明日の夜を見たい気持ちも、全部そのままにして、その上にもう一つ、帰る日を載せただけだった。</p><p>戻り湯の椅子から立ったときと、同じだと思った。</p><p>冴月さんが、こちらを見た。</p><p>驚いた顔ではなかった。喜んだ顔でも、寂しそうな顔でもなかった。ただ、帳場で宿帳に一行書き足すときのような、落ち着いた顔だった。</p><p class="q">「分かった。その朝の道も確認する」</p><p>それだけだった。</p><p>冴月さんは戸を閉めなかった。閉める前に、外の稜線をもうしばらく見せてくれるように、扉に手を掛けたまま、待っていた。</p><p>橙色が、少しずつ藍に変わっていく。</p><p>その空の端に、ほとんど円い月が、白く浮かびはじめていた。</p><h3 class="sec" id="ch7-5"><span class="num">五</span><span class="name">自分の分</span></h3><p>夕食の後、客室へ戻る廊下で、雪鳥が小さな札をくわえて待っていた。</p><p>雪音さんの字だった。</p><p class="q mark">《もしよかったら、喫茶席へ。休みたければ、そのままで。》</p><p>札の裏には、何も書いていなかった。来なくても、誰も困らない書き方だった。</p><div class="sep" aria-hidden="true">◇</div><p>喫茶席の灯りは、半分だけ落とされていた。</p><p>看板は今朝裏返したままだ。《本日夜・休み》。片付けの済んだカウンターの上に、盆が一つ。湯飲みが一つ、湯気を立てている。</p><p>雪音さんは、カウンターの向こうで踏み台に乗っていた。そうしてようやく、こちらと目の高さが合う。</p><p class="q">「来てくださったんですね」</p><p class="q">「札、もらったので」</p><p>雪音さんが、盆をこちらへ押し出した。</p><p>湯飲みの中身は、お湯だった。最初に頼んだ飲み物ではなく、注文札の裏に書かれた方。</p><p class="q">「……覚えてるんですね」</p><p class="q">「表も裏も、消してないので」</p><p>雪音さんはそう言って、はにかんだ。</p><p>しばらく、二人とも黙っていた。湯飲みを両手で包む。熱すぎず、ぬるすぎず。この温度を、帰ったら自分で作ろうと書いた夜があった。</p><p class="q">「一つ、聞いてもいいですか」</p><p>雪音さんが言った。</p><p>踏み台の上で、前掛けの裾を小さな手でつまんでいる。連絡板の前で、雪鳥の帰りを待っていた朝と同じつまみ方だった。</p><p class="q">「はい」</p><p class="q">「次に会った時、ちゃんと覚えていてもいいですか。飲み物だけじゃなくて、一緒に数えた籠とか」</p><p>一緒に数えた籠。</p><p>鎮め湯の軒下で、山を二つに分けて、雪鳥の入った籠まで数に入れた。帳簿の数と、ちょうど揃った。布巾の落ちた午後も、空の籠に布を敷いてくれた朝も。</p><p>次に会った時。</p><p>その言葉は、帰ることを前提にしていた。帰って、それから、また。夕方に玄関で言ったことを、この子はもう知っているのかもしれない。それとも、最初からずっと、そういうつもりで面倒を見てくれていたのかもしれない。</p><p class="q">「……友達として、覚えていてほしいです」</p><p>雪音さんの手が、前掛けの裾から離れた。</p><p class="q">「はい」</p><p>返事は短かった。でも、その一言のあとで、雪音さんは踏み台の上でしゃんと背筋を伸ばした。</p><p class="q">「じゃあ、次は僕が数え間違えないところも見てください」</p><p>笑ってしまった。雪音さんも笑った。声を出さずに、肩を小さく震わせて。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「一緒にいてくれて、ありがとうございました」</p><p>雪音さんが、律儀に頭を下げた。</p><p>顔を上げたとき、もう一度カウンターの上を見た。</p><p>盆の上には、湯飲みが一つだけだった。</p><p>配った後で、誰かだけ飲み物がないとか。厨房で、この子がそう言っていた。客に配って、自分の分を忘れる狐の話を聞いてから、配る人の分も数えるようになった、と。</p><p class="q">「……自分の分は？」</p><p>雪音さんは、一瞬きょとんとした。</p><p>それから、踏み台の上で身を屈めて、カウンターの向こう側の低い棚へ手を伸ばした。こちらからは見えない高さだった。</p><p>小さな両手で、もう一つの湯飲みを持ち上げる。</p><p>湯気が、小さな顔の前で立ち昇った。</p><p class="q">「あります」</p><p>湯飲みを持ち上げたまま、雪音さんは、どこか得意そうな顔をしていた。</p><p>二つの湯飲みが、カウンター越しに並んだ。</p><div class="sep" aria-hidden="true">◇</div><p>客室へ戻る途中、渡り廊下の戸が開いていた。</p><p>鏡さんが、戸口の段に腰を下ろしていた。黒いマグを両手で持って、林の上の月を見ている。ほとんど円い月だった。</p><p>足音で気づいたのか、鏡さんが顔を上げた。</p><p class="q">「お」</p><p>こちらの顔を、少しだけ見る。</p><p class="q">「もう温まってる顔だ。じゃ、今日は何も出さない」</p><p>雪音さんの喫茶席にいたことを、話してはいなかった。</p><p>隣に、少し間を空けて座った。段の板が冷たかった。鏡さんが何も言わずに、自分の座っていた毛皮を半分こちらへずらした。</p><p>しばらく、二人で月を見ていた。</p><p class="q">「……満月を越えたら、帰ります」</p><p>言うつもりはなかった。気づいたら、言っていた。</p><p>鏡さんの耳が、一度だけ動いた。</p><p class="q">「うん」</p><p>それだけだった。</p><p>驚いた声ではなかった。夕方の玄関で冴月さんが言った、分かった、と同じ温度だった。もしかすると、この人はもう、どこかで聞いていたのかもしれない。それとも、聞かなくても、分かっていたのかもしれない。</p><p class="q">「行ってこい、って言うのは、明後日の朝にとっとく」</p><p>鏡さんは、マグの中を見たまま言った。</p><p class="q">「明日の夜は、東の廊下にいるから。何かあったら、振り返って」</p><p class="q">「振り返るだけでいいんですか」</p><p class="q">「それだけでいい。あとは俺が行く」</p><p>月が、雲の端にかかった。</p><p>鏡さんは、それ以上何も言わなかった。訊きもしなかった。帰る理由も、帰った後のことも。</p><p>ただ、隣にいた。</p><div class="sep" aria-hidden="true">◇</div><p>立ち上がって、部屋へ戻る廊下を歩いた。</p><p>角を曲がる手前で、振り返った。</p><p>鏡さんは、まだ戸口の段に座っていた。月ではなく、こちらを見ていた。</p><p>目が合うと、マグを持った手を、少しだけ上げた。</p><p>見られている、と思った。</p><p>最初の夜からずっと、そうだったのかもしれない。廊下で震えていた夜も、布巾の落ちる席でも、毛布が膝に落ちてきた夜も。この人は、近づきすぎない場所から、ずっとこちらを見ていた。</p><p>怖くはなかった。</p><p>見られていることが、こんなに温かいものだとは、知らなかった。</p><h3 class="sec" id="ch7-6"><span class="num">六</span><span class="name">開いたままの袋</span></h3><p>夜が更けていく館を、最後の灯りが一つずつ渡っていった。</p><div class="sep" aria-hidden="true">◇</div><p>帳場では、冴月さんが最後の戸締まりを確かめていた。</p><p>見取り図の赤い印を一つずつ指で辿り、そのたびに対応する札を裏返す。最後に東の廊下の青い印を辿って、そこだけは裏返さなかった。</p><div class="sep" aria-hidden="true">◇</div><p>厨房では、雪鬼さんが、明日の朝に使う鍋まで並べていた。</p><p>満月の夜の、その先の朝。小さな白い器が一つ、鍋の横に伏せて置かれていた。</p><div class="sep" aria-hidden="true">◇</div><p>喫茶席では、雪音さんが、いつもの席の椅子を壁際へ寄せていた。明日の夜、休む人が使えるように。小さな体で、椅子を引きずらないように抱え上げて運んでいた。</p><div class="sep" aria-hidden="true">◇</div><p>回廊では、夜澄さんが窓を閉めて、喉を休めていた。歌の帳面は、膝の上で閉じたままだった。</p><div class="sep" aria-hidden="true">◇</div><p>雪庭の端の小屋では、ヒノエが笛の手入れを終えたところだった。布で拭いて、光にかざして、懐にしまう。口元へは、運ばなかった。</p><div class="sep" aria-hidden="true">◇</div><p>渡り廊下では、鏡さんが、離れの灯りを一つだけ残して戸を閉めた。いつもと同じ灯り。最初の夜から、一晩も消えたことのない灯り。</p><div class="sep" aria-hidden="true">◇</div><p>廊下の梁の上で、雪鳥が一羽、自分の寝床に潜り込んだ。研究所の扉の前で一晩じゅう羽を伸ばしていた、あの雪鳥だった。</p><div class="sep" aria-hidden="true">◇</div><p>研究所。</p><p>説明室の机に、月白先生が突っ伏しかけていた。</p><p>目の前には、白い箱。空欄の処置票。新しい計画の紙。観測端末の画面では、九尾化指数の線が、明日の満月に向かってゆっくりと昇り始めている。</p><p>髪が、肩から滑り落ちた。</p><p>その感触で、顔が上がった。眼鏡の位置を直して、画面を見る。計画の紙を見る。幕の下りた観測窓を、見ない。</p><p>しばらく、そのまま迷っていた。</p><p>それから、端末に一行だけ入力した。</p><p class="q mark">《休憩》</p><p>椅子を少し引いて、背もたれに体を預ける。黒い手袋の手を、膝の上で組む。</p><p>目を閉じた。</p><div class="sep" aria-hidden="true">◇</div><p>客室。</p><p>荷物の袋が、床の上で口を開けていた。</p><p>帳場から返してもらった荷物だった。冴月さんが「出発する人の荷物」と呼んで、毎夜帳場のこちら側に置いてくれていた荷物。満月を越えたら帰ると言った夕方に、客室まで運ばれてきた。</p><p>袋の前に座って、中を見た。</p><p>山に来た日に詰めたものが、詰めたままの順番で入っている。底の方に、電源を落としたままの携帯電話があった。</p><p>手に取った。</p><p>電源を入れる。画面が明るくなる。圏外の表示。残り少ない電池の表示。それだけを確かめて、また電源を切った。</p><p>袋の底へは、戻さなかった。</p><p>一番上に置いた。袋の口を開けたら、最初に手が届くところに。</p><p>ここへ来る前とは、しまう場所が少し違った。</p><p>その横に、毎晩書いてきた記録の紙を重ねて入れた。《湯》とだけ書いた紙。《帰った後にも、休む時間を残す。》と書き足した紙。《空席の人にも、取り分があった。》と書いた紙。</p><p>袋の口は、閉じなかった。</p><p>まだ明日がある。明日の夜があって、その先の朝がある。それまでは、開けておいていい。</p><div class="sep" aria-hidden="true">◇</div><p>窓の外を見た。</p><p>月は、ほとんど真円だった。</p><p>欠けているのは、片端のほんのわずかだけ。明日の夜には、そこも埋まる。</p><p>灯りを落とす。</p><p>暗くなった部屋の中で開いたままの袋の口が、月の光を薄く受けていた。</p><p class="end">（第七章　終）</p></template>
<template id="t-ch8" data-label="第八章" data-title="満月鎮静夜行"><header class="chap-head"><p class="chap-label">第八章</p><h2 class="chap-title">満月鎮静夜行</h2></header><h3 class="sec" id="ch8-1"><span class="num">一</span><span class="name">同じ言葉</span></h3><p>満月の日の昼も、食堂には湯気が立っていた。</p><p>雪鬼さんが、こちらの前に椀を置く。汁が多めで、ご飯が少し。言わなくても、そうなっていた。</p><p class="q">「こんな日も、普通なんですね」</p><p class="q">「普通に食えるうちに食え」</p><p>雪鬼さんは、もう次の椀に汁を注いでいた。</p><p>雪音さんが、湯飲みを運んできた。</p><p class="q">「今日は、同じもので大丈夫ですか」</p><p>昨日の注文を、そのまま決めつけなかった。覚えていても、毎回聞くのだ。</p><p class="q">「温かいお湯を」</p><p class="q">「はい」</p><p>注文札には、何も書き足されなかった。もう書いてあるから。</p><div class="sep" aria-hidden="true">◇</div><p>夕方。</p><p>玄関で、冴月さんが札を確かめていた。戸の外は、薄い藍色に変わり始めている。林の向こう、山の端が、少しずつ白く明るんでいた。</p><p>冴月さんが、館の奥へ向かって言った。</p><p class="q">「全館、満月対応」</p><p>最初の夜と、同じ声だった。</p><p>雪鳥たちが、いっせいに飛び立つ。羽音が廊下を抜けていく。窓が、一つずつ閉まっていく。</p><p>あの夜は、何が起きているのか分からなかった。数十秒で宿が別の場所になるのを、廊下の隅でただ見ていた。</p><p>今は、どの扉を閉めているのかが分かる。西。赤い印のついた扉。東の廊下は、開いたまま。</p><p>帳場の梁から、雪鳥が一羽降りてきた。</p><p class="q">「西側閉鎖。東側避難路、通行できます」</p><p>低く、よく通る声だった。あの小さな白い丸から、落ち着いた大人の声が出てくる。伝令のときだけ、雪鳥はそういう声で話すらしい。</p><p class="q">「休憩所、開きました」</p><p>雪音さんの声が、喫茶席の方からした。</p><p class="q">「飯は残してある。戻った順に食え」</p><p>雪鬼さんの声が、厨房の方からした。</p><div class="sep" aria-hidden="true">◇</div><p>廊下の奥から、足音が来た。</p><p>月白先生だった。白い箱を抱えている。その上に、三湯の確認票。研究所へ向かう途中なのだと分かった。</p><p class="q">「処置に入る」</p><p class="q">「こちらは任せて」</p><p>冴月さんが答えた。</p><p>それだけのやりとりだった。引き継ぎの言葉は、もう昨日のうちに全部済んでいるのだろう。</p><p>月白先生が、玄関の戸へ向かう。</p><p>その背中に、声をかけていた。</p><p class="q">「月白先生も、終わったら食べてください」</p><p>月白先生の足が、止まった。</p><p>振り返らなかった。月白色の長い髪の結び目が、背中で少し揺れただけだった。</p><p class="q">「……冷ますな、と言っておけ」</p><p>厨房の方から、雪鬼さんの声が返ってきた。</p><p class="q">「聞こえてる」</p><p>玄関の戸が開き、閉まった。</p><div class="sep" aria-hidden="true">◇</div><p>冴月さんが、帳場の前に立った。</p><p class="q">「持ち場は、昨日のままでいい？」</p><p>変えてもいい、という訊き方だった。変えても、誰も落胆しないという訊き方だった。</p><p>懐の札を、指で確かめた。雪音さんの字。分からなくなったら、止まって聞いてください。</p><p class="q">「はい。館の中で、運びます」</p><p>窓の外で、月が昇っていた。</p><p>欠けているところは、もうどこにもなかった。</p><h3 class="sec" id="ch8-2"><span class="num">二</span><span class="name">外周</span></h3><p>月が林の上に出たとき、雪を踏む音がした。</p><p>一つではなかった。いくつも。林の奥から、雪の下から、少しずつ。</p><p>東の廊下の窓から、外が見えた。閉ざされていない最後の窓だ。冴月さんに、外を見てもいいのはここだけ、と言われていた。</p><p>白い影が、木々の間から現れた。</p><p>狐のようなもの。鳥のようなもの。どれも、形が少しずつ長すぎた。見回りの夕方に、笛の一音で足が伸びたあの雪の獣と同じ落ち着かなさが、何十も並んでいる。</p><p>笛は、まだ鳴っていなかった。</p><p>庭の灯りの内側で、ヒノエが笛を持ったまま立っている。冴月さんが、手のひらで「まだ」と示していた。ヒノエは、笛を口元へ持っていかなかった。</p><p class="q">「笛の前から、起きているね」</p><p>冴月さんの声が、窓越しにかすかに聞こえた。</p><p>満月が昇るだけで、集まってくる。誰かに呼ばれる前に。昔、この夜には宴があったから。体の方が、それを覚えているのだと思った。</p><p>玄関の前に、雪鬼さんが出た。</p><p>手に、巨大な出刃包丁を提げている。厨房で使っているのと同じ形で、大きさだけがまるで違う。</p><p>雪の獣が一体、月の光を横切って突っ込んできた。</p><p>雪鬼さんは、刃ではなく、出刃の背でそれを受け流した。切りつけない。半歩だけ横へずれて、獣の逃げ道が空くように。獣は勢いのまま雪の中へ滑っていき、転んだ。</p><p class="q">「こっちを通すな。追うなよ」</p><div class="sep" aria-hidden="true">◇</div><p class="q">「西の三番、札をお願いします」</p><p>雪音さんの声だった。</p><p>喫茶席の入口。踏み台に乗った雪音さんが、壁に貼った見取り図の前で、指を一つの窓の上に置いている。その足元に、札の束が窓番号ごとに分けて置かれていた。</p><p>西の三番。</p><p>束の一つを拾い上げ、そこから一枚抜いて、待っていた雪鳥の嘴へ渡す。</p><p>雪鳥が、札をくわえたまま、こちらを見上げた。</p><p class="q">「西の……二番？」</p><p>手の中の札を見た。番号が、一つずれていた。</p><p class="q">「……ごめん、三番」</p><p>渡し直す。雪鳥は正しい札をくわえ直して、飛んでいった。誰も、責める言葉を言わなかった。</p><p>雪音さんが、見取り図から目を離さずに言った。</p><p class="q">「合っています。次の分は、ここで待ちましょう」</p><p>走らなくていい。止まって聞けばいい。手の届くところに、次の束がある。</p><p>雪鳥がくわえていくのは、いつも一枚だけだった。束を抱えたこちらの手は、最後まで鈍らなかった。</p><div class="sep" aria-hidden="true">◇</div><p>喫茶席の入口からは、東の廊下の窓が見えた。その窓から、外周の三つの窓が見えていた。</p><p>西の三番。外側から、白い指のような影が硝子を撫でていた。</p><p>そこへ、雪鳥が札を届ける。冴月さんがそれを受け取って、窓枠に貼る。その指先が、一枚ごとに少しずつ、雪の色に近づいていった。</p><p>影が、硝子から離れた。</p><p>次の窓でも。その次の窓でも。雪音さんが番号を言い、こちらが束を渡し、雪鳥が運び、冴月さんが貼る。その繰り返しの中で、三つの窓の揺れが、少しずつ収まっていった。</p><p>手のひらに、札の角の感触が残っている。</p><p>最初の満月の夜には、何も持っていなかった手だった。</p><div class="sep" aria-hidden="true">◇</div><p>最後の窓の揺れが止まったとき、東の窓の向こうで、大きなものが動いた。</p><p>熊のような形だった。雪の塊をいくつも積み上げたような、重たい影。それが、館ではなく、庭の奥へ向かっていく。</p><p>湯路のある方だった。</p><p>冴月さんの声が、外から届いた。</p><p class="q">「外周は、ここまで。湯路へ回る」</p><h3 class="sec" id="ch8-3"><span class="num">三</span><span class="name">最初の札</span></h3><p class="cross">――同じ刻限。雪尾研究所、最奥。</p><p>寝台の周りに、札が張られていた。</p><p>長い年月のあいだに、何度も貼り替えられてきた札だ。眠りを保つための術式が、一枚ずつに分けて書かれている。床には三つの水盤。鎮め湯、戻り湯、迎え湯。迎え湯の底の線は、今朝から途切れずに光っている。</p><p>寝台の上で、雪狐が眠っていた。</p><p>黒い髪が、枕から床の方へ流れている。閉じたまぶた。静かな呼吸。寝台の脇の受け皿には、今夜も、溶けた雪が少しずつ落ちていた。</p><p>月白は、白い箱を机に置いた。</p><p>蓋を開ける前に、計画の紙を一度だけ見た。番号を振った行。冴月の確認の印。そして、古い確認書の写し。二つの筆跡。</p><p class="q mark">《意思を確かめられる時には、その都度、処置を続けるか尋ねること。》</p><p>黒い手袋の指が、寝台の頭の側に張られた札の一枚に触れた。</p><p>一番外側の札。外から届く音や気配を遮るための札だった。</p><p>それだけを、外した。</p><p>残りの札には、触れなかった。</p><p>端末の画面で、一本の線が昇り始めた。</p><p class="q mark">《九尾化指数・上昇》</p><p>今までの満月の山が、画面の左に並んでいる。そのどの山よりも、今夜の線は高く昇っていった。越えた。越えて、まだ昇っていく。</p><p>月白は、数値を見た。</p><p>それから、雪狐を見た。</p><p>髪の色は、まだ黒いままだった。</p><p class="q">「セツコ。始める」</p><p>返事はなかった。</p><p>返事がないことを、月白は記録した。一行。後にも先にも、解釈は書き足さなかった。</p><p>白い箱の蓋を開ける。新しい処方を、計画の紙の番号どおりに使う。手順は、何度も書き直した綴りの、最後の頁にあるとおりだった。</p><p>待つ。</p><p>鎮め湯の水盤の縁から、白い光が立ち上っていた。九尾化の熱を受けて、湯気のように。その光の丈が、わずかに縮んだ。</p><p>戻り湯の水盤。途切れ途切れだった水面の映り込みに、指先が一つ、映った。</p><p>雪狐の指だった。</p><p>寝具の上の本物の指は、まだ動いていない。水面の指だけが、先に形を取り戻していた。戻り湯で、雪の獣の輪郭が、湯面の中から先に小さくなっていったのと同じように。</p><p>月白の手が、次の札へ伸びかけた。</p><p>止まった。</p><p class="q">「……急がない」</p><p>誰かを励ます声ではなかった。自分の手を止めるための声だった。</p><p>手を、膝へ戻す。</p><p>端末に記録する。</p><p class="q mark">《覚醒導入。呼びかけへの反応を確認中》</p><p>外の音は、札の向こうで、まだ遠かった。</p><h3 class="sec" id="ch8-4"><span class="num">四</span><span class="name">湯路</span></h3><p>帳場の梁で、雪鳥が顔を上げた。</p><p class="q">「研究所より連絡。覚醒導入開始。外の反応を知らせてください」</p><p>低く、落ち着いた声だった。その声が、館じゅうの雪鳥に順に渡っていく。梁から梁へ、廊下から庭へ。</p><p>始まったのだ。</p><p>東の窓の向こうで、冴月さんが手を上げるのが見えた。指を揃えた手のひらを、庭の灯りの方へ向けている。</p><p>合図だった。</p><div class="sep" aria-hidden="true">◇</div><p>笛が鳴った。</p><p>一音ではなかった。昔の曲だった。見回りの夕方に途切れた、雪庭の半円のところで止まった、あの曲の頭から。</p><p>館の壁を通しても、それと分かる音だった。高く、細く、遠くまで伸びていく。</p><p>東の窓の向こうで、白い影たちがいっせいに顔を上げた。</p><p>林の中のものも。庭の端のものも。さっき雪鬼さんに受け流されて転んだ獣も。全部が、同じ方向を向く。庭の真ん中へ。集まってくる。雪が盛り上がる。</p><p>分かっていても、怖かった。</p><p>窓の前から、動けなくなっていた。足の裏が床に貼りついたように。最初の満月の夜、廊下の隅でそうだったように。</p><p class="q">「……ここ。止まっていい」</p><p>水色の前掛けが、視界の端に入った。</p><p>雪音さんが、隣に立っていた。踏み台は持っていなかった。見上げるようにして、こちらの顔ではなく、手の中の札の束を指している。</p><p class="q">「次は、固定札です。湯路の蓋の。それと、予備の灯り」</p><p>怖かった。でも、手の中には、次に渡すものがあった。</p><p>束を分けて、一枚ずつ、待っていた雪鳥たちへ渡していく。番号を読み上げながら。今度は、間違えなかった。</p><div class="sep" aria-hidden="true">◇</div><p>湯路のある山道は、東の窓からは半分しか見えなかった。</p><p>見えたのは、熊の形の影が、湯路の木蓋を跨ごうとしているところだった。迎え湯の水盤へと続く、今朝つながったばかりの湯路。</p><p>蓋が軋む音が、ここまで聞こえた気がした。</p><p class="q">「こっちだ」</p><p>雪鬼さんの声。</p><p>熊の影の側面へ、大きな影が回り込む。月の光に、巨大な出刃の平たい面が白く光った。そこへ、雪の塊が重たくぶつかる。</p><p>雪鬼さんの影が、半歩、押し戻された。</p><p class="q">「……重てえな」</p><p>そのとき、歌が入った。</p><p>庭の端の石灯籠の影から。夜澄さんの声。言葉のない歌だった。</p><p>熊の影の動きが、わずかに遅くなった。欲しがる力が、少し吸われているのだ。</p><p class="q">「今のうちに、蓋を」</p><p>雪鳥が、さっき渡した固定札をくわえて、湯路へ飛んでいくのが見えた。撫でつけるように蓋の縁に札が貼られ、軋みが止まる。</p><p>しばらくして、梁の上から低い声が降ってきた。</p><p class="q">「湯路の補強が済みました。後退路も保持しています」</p><p>渡した札だった。番号を読み上げて、間違えずに渡した札。それが今、あの蓋の縁にある。</p><div class="sep" aria-hidden="true">◇</div><p>歌が、半音だけ乱れた。</p><p>それから、止んだ。</p><p class="q">「夜澄、離れて」</p><p>冴月さんの声が、庭から届いた。</p><p class="q">「……もう少し」</p><p class="q">「こちらは持つ。今、離れて」</p><p>間があった。</p><p>少しして、喫茶席の扉が開いた。</p><p>夜澄さんが入ってきた。黒紫の衣の裾に、雪がついている。喉に手を当てていた。誰にも引き留められず、自分の足で、休憩の灯りのところまで歩いてきたのだ。</p><p>いつもの窓際の席。布巾の落ちた席。夜澄さんはそこに腰を下ろした。</p><p>雪音さんが、その前に水を一杯置いた。飲むようにとは言わなかった。置いて、そのまま離れた。</p><p>夜澄さんは、しばらくその水を見ていた。それから、手に取った。</p><div class="sep" aria-hidden="true">◇</div><p>笛の音が、膨らんでいた。</p><p>東の窓の向こうで、別の影が、大きくなり始めていた。狐の形のもの。足が伸び、尾が伸び、輪郭が揺らぐ。</p><p>冴月さんが、上げていた腕を下げた。</p><p>笛が、止まった。</p><p class="q">「……止めた」</p><p>ヒノエの声だった。小さくて、でも、はっきりしていた。</p><p class="q">「見ていたよ。次の合図まで待って」</p><p>膨らんだ影は、すぐには消えなかった。笛が止んでも、元通りにはならない。見回りの夕方に、冴月さんがそう言っていた。</p><p>それでも影は、札と灯りのあいだへ、ゆっくりと戻されていった。</p><p>ヒノエは、止めた。合図を見て、自分で。</p><h3 class="sec" id="ch8-5"><span class="num">五</span><span class="name">起きたい</span></h3><p class="cross">――同じ刻限。雪尾研究所、最奥。</p><p>笛の音が止んでいた。</p><p>札の向こうから薄く届いていた曲が途切れて、部屋には水音だけが残った。三つの水盤に落ちる湯の音。受け皿に落ちる、溶けた雪の音。</p><p>寝具の上で、指が動いた。</p><p>水面の映り込みではなかった。本物の指だった。人差し指の先が、寝具の布をわずかに引いた。</p><p>月白は、すぐには手を握らなかった。</p><p>手は、膝の上にあった。黒い手袋の指を組んだまま。</p><p class="q">「聞こえるか」</p><p>指が、小さく動いた。</p><p class="q">「聞こえたら、もう一度」</p><p>間を空けた。水盤に湯が落ちる音を、十、数えた。</p><p>もう一度、指が動いた。さっきより、はっきりと。</p><p>月白は、端末に記録した。《呼名への反応あり。二度。》それから、雪狐の方へわずかに身を屈めた。</p><p class="q">「起きて暮らすための、続きだ。止めることもできる」</p><p>確認書の一行と、同じことを言った。何年も前に二人で書いたことを、今、声で。</p><p>雪狐の唇が、動いた。</p><p class="q">「……ここ」</p><p>かすれた声だった。長いあいだ使われていなかった喉の、乾いた声。</p><p class="q">「研究所だ。俺は、傍にいる」</p><p class="q">「……音、止まった」</p><p>月白は、一瞬だけ黙った。</p><p>笛のことだと分かった。眠りの底でも、あの曲は届いていたのだ。届いていて、止まったことにも気づいている。</p><p class="q">「外も待っている。だが、待たせたことを理由に続けなくていい」</p><p>急ぐ理由は、こちらにしかない。</p><p>記録の余白にそう書いた手が、今は膝の上で組まれていた。</p><p>雪狐は、しばらく、呼吸だけをしていた。</p><p>長い間だった。受け皿に、溶けた雪が三滴落ちた。四滴。</p><p>月白の手が、次の札の方へ、わずかに動きかけていた。</p><p>それに気づいて、手を膝へ戻した。指を組み直す。さっきより、少し強く。</p><p>返事がなければ、先へは進めない。それは最初から決めていたことだった。決めていたから、待てた。</p><p class="q">「……起きたい」</p><p>月白は、顔を上げた。</p><p>雪狐のまぶたは、まだ閉じていた。けれど唇が、もう一度動いた。</p><p class="q">「続けて。苦しくなったら、言う」</p><p class="q">「分かった」</p><p>端末に、続行の意思を記録する。</p><p class="q mark">《本人より続行の意思表示。苦痛時は申告と。》</p><p>書いた記録を、冴月へ送る。処置を行う者だけで、続行の判断を閉じないこと。</p><p>迎え湯の水盤を見る。底の線は、途切れていなかった。</p><p class="q mark">《維持：安定》</p><div class="sep" aria-hidden="true">◇</div><p>そのとき、連絡器が短く鳴った。</p><p>警報ではなかった。月白は、寝台の前から動かずにそれを受けた。</p><p class="q">「本館へ寄っている。こちらで戻す。処置を続けて」</p><p>冴月の声だった。</p><p>月白の手が、止まった。</p><p>体が、扉の方へ向きかけた。膝の上で組んでいた指がほどけて、椅子から腰が浮きかける。</p><p>本館。客室のある、東の廊下。</p><p>座り直した。</p><p class="q">「……任せる」</p><p>寝台の上で、雪狐の髪の一房が、枕の上で、ひそかに色を薄くしていた。</p><p>黒から、灰へ。</p><h3 class="sec" id="ch8-6"><span class="num">六</span><span class="name">窓</span></h3><p>最初に気づいたのは、音だった。</p><p>食器の触れ合う音。小さく、軽く、すぐ耳元で鳴っているような近さで。厨房からは遠いはずの、東の廊下だった。</p><p>次の札の束を取りに、客室の前を通りかかったところだった。</p><p>廊下が、暖かかった。</p><p>食堂のように。湯気の立つ鍋の前のように。</p><p>窓が、白く光っていた。</p><p>最初の夜と同じ窓だった。東の廊下の、客室に一番近い窓。閉ざされていない、最後の窓。</p><p>その向こうに、椅子があった。</p><p>食堂の奥の席のような、卓へ寄せられた椅子。その前に、小さな白い器。湯気が立っている。</p><p>本当は、雪しかない場所だった。</p><p>分かっていた。分かっているのに、目が離せなかった。</p><p>窓の向こうで、白い影が、手を上げた。</p><p class="q">「――おいで」</p><p>最初の夜と同じだった。</p><p>でも、今度は、怖いだけではなかった。</p><div class="sep" aria-hidden="true">◇</div><p>ここは、温かい。</p><p>好きな飲み物を、覚えていてくれる。表も裏も、消さずに。</p><p>話さなくても、席がある。布巾の落ちる席が。離れて座っても、隣に座ってもいい席が。</p><p>飯がある。言わなくても、汁が多めになっている。</p><p>ずっと。</p><p>足が、一歩前へ出た。</p><p class="q">「――床を見て」</p><p>冴月さんの声だった。</p><p>廊下の向こうから。走っていない。道標の裏に帰りの矢印を彫っていたときと同じ声。</p><p>床を見た。</p><p>廊下の板。木目。自分の靴の先。</p><p>床は、窓の向こうへは続いていなかった。窓枠の下で、木の板はきっちりと終わっている。その先にあるのは、硝子と、雪と、夜だけだった。</p><p class="q">「それは、入口じゃない」</p><div class="sep" aria-hidden="true">◇</div><p>今日、自分で選んだものを、思い出した。</p><p>汁が多めの椀。温かいお湯。館の中で、運ぶ仕事。</p><p>玄関で言ったこと。満月を越えたら、帰りたい。</p><p>袋の一番上に置いた携帯電話。</p><p>どれも、自分で選んだ。</p><p>窓は、選んでいなかった。</p><p>混ぜるな、と月白先生は言っていた。ここにいる理由と、外へ帰れない理由を。</p><p class="q">「……窓は、選んでない」</p><p>声に出した。出してみると、それは思っていたより静かな声だった。</p><p>一歩、下がった。</p><div class="sep" aria-hidden="true">◇</div><p>冴月さんが、廊下の帰路の側に立っていた。灯りを手にして、それを守るように。</p><p>雪鬼さんが、廊下の入口の戸を支えていた。湯路から戻ってきたばかりなのか、肩が雪で白い。</p><p>雪音さんが、足元に灯りを置いた。こちらが進む側を、空けるように。</p><p>そして、見上げて言った。</p><p class="q">「今日は何が欲しいか、戻ってから聞きます」</p><p>少し得意そうな声だった。</p><p class="q">「……はい」</p><div class="sep" aria-hidden="true">◇</div><p>肩に、何かが掛けられた。</p><p>毛布だった。</p><p>顔を向けると、鏡さんがいた。持ち場の毛布の山から、いつの間にかここまで来ていた。</p><p>窓の方は、一度も見ていなかったのだと思う。この人は、窓ではなく、ずっとこちらを見ていた。</p><p>振り返ったら、来てくれる。そう言っていた。</p><p>振り返るより先に、肩に毛布があった。</p><p>鏡さんは何も言わなかった。毛布の端を、こちらの肩の上で一度だけ整えて、それから、廊下の端の持ち場へ戻っていった。</p><div class="sep" aria-hidden="true">◇</div><p>庭の方から、歌が聞こえた。</p><p>短い歌だった。休憩を終えた夜澄さんが、庭に戻っていた。</p><p>笛は鳴らなかった。ヒノエが、まだ吹かずに待っているのだ。</p><p>窓に映っていた椅子が、雪に戻った。湯気も、白い器も、廊下の暖かさも。全部が、月の光の中へ、ゆっくりと溶けていく。</p><p class="q">「ここを好きでも。窓から出なくていい」</p><p>冴月さんが、頷いた。</p><p class="q">「うん」</p><p>窓の向こうの白い影は、壊れた顔にはならなかった。怒った形にもならなかった。</p><p>手を下ろして、少しずつ小さくなっていく。小さな白い輪郭になり、窓枠から離れて、庭の雪の上へ降りていった。</p><p>庭の真ん中の方へ。</p><p>呼ばれて来たものが、帰る場所を探していたのかもしれない。四つの記録を並べた日に、そう思った。</p><p>今は、その影の行く先に、帰る場所があるといいと思った。</p><h3 class="sec" id="ch8-7"><span class="num">七</span><span class="name">最後の札</span></h3><p class="cross">――同じ刻限。雪尾研究所、最奥。</p><p>三つの水盤が、それぞれの仕事をしていた。</p><p>鎮め湯が、熱を抑えている。寝台の周りの白い光は、もう湯気のようには立ち昇っていなかった。受け皿に落ちる雪の雫の間隔が、少しずつ開いている。</p><p>戻り湯が、輪郭を保っている。水面に映る雪狐の姿は、もう途切れなかった。</p><p>迎え湯が、こちら側へつないでいる。底の線が、光ったままだった。</p><p>月白は、端末の記録を見た。</p><p class="q mark">《覚醒中の出力調整》</p><p>何度も書き直した綴りの、一番新しい行。それが今、画面の上で、動いている数値と並んでいた。</p><p>寝台の周りに残った札は、一枚だけだった。</p><p>枕元の、一番内側の札。他の札よりも古く、何度も書き足されて、文字が重なっている。</p><p class="q mark">《月白への接近欲求を睡眠欲へ変換》</p><p>月白の指が、その札に触れた。</p><p class="q">「ここを外す」</p><p class="q">「うん」</p><p>返事があった。さっきより、声がいくらか潤っていた。</p><p class="q">「会いたいと思っても、眠りへ落とさない」</p><p>寝具の上で、雪狐の指が開いた。握るのではなく、開いた。何かを受け取るように。</p><p class="q">「……会いたかった」</p><p>札の文字が、淡く光った。</p><p>その一言だけで、術式が反応したのだ。会いたいという欲を、眠りへ変えようとする。何年も、そうしてきたように。雪狐のまぶたが、重く沈みかける。</p><p>月白は、札を急いで引き剥がさなかった。</p><p>鎮め湯の水盤を見る。熱は抑えられている。戻り湯を見る。輪郭は保たれている。迎え湯を見る。線は、つながっている。</p><p>分けて確認する。一つずつ。</p><p>それから、雪狐の顔を見た。</p><p class="q">「ああ。俺もだ」</p><p>最後の結び目を、一つずつ解いていく。</p><p>光が、札から離れて、水盤へ移っていった。迎え湯の水面が、それを受け止める。受け止めて、沈めずに、浮かべたままにする。</p><p>連絡器から、雪鳥の低い声が届いた。</p><p class="q">「全館、帰路を保持しています」</p><p>月白は、雪狐を見た。</p><p class="q">「……もう、起きていい」</p><div class="sep" aria-hidden="true">◇</div><p>まぶたが、上がった。</p><p>赤い瞳だった。寝台の周りの白い光が、その瞳の中に映っていた。</p><p>枕の上で、髪が色を変えていった。</p><p>さっき、一房だけ灰色になっていた髪から。黒から灰へ。灰から、雪の色へ。水に垂らした墨がにじむのとは逆の向きに、根元から毛先へと、白が広がっていく。宴の写真の中で弧を描いていた、あの白へ。</p><p>全部が白くなりきる前に、変化は途中で止まった。毛先に、淡い灰色が残っている。</p><p>九尾化指数は、ゼロにはなっていなかった。維持範囲の線の内側で、静かに揺れていた。</p><p>雪狐は、月白を見た。</p><p>それから、自分の手を見た。開いたままの指を。動かしてみる。一本ずつ。</p><p class="q">「起きてる」</p><p>月白が、頷いた。</p><p class="q">「今、そう記録する」</p><p>端末ではなく、紙に書いた。白い箱の脇の、あの未使用の処置票に。角の立った字で。</p><p>ペンが紙に触れる。</p><p>一文字目だけ、筆圧が強かった。</p><h3 class="sec" id="ch8-8"><span class="num">八</span><span class="name">宴</span></h3><p>梁の上で、雪鳥が顔を上げた。</p><p class="q">「研究所より連絡。覚醒を確認。応答あり。維持を継続中」</p><p>その声が、館じゅうの雪鳥へ渡っていく。</p><p>喫茶席で、雪音さんが、手に持っていた帳面を落とした。拾わなかった。踏み台の上で、両手で口元を押さえていた。</p><p>窓際の席で、夜澄さんが顔を上げた。それから、目を閉じた。</p><div class="sep" aria-hidden="true">◇</div><p>東の廊下の窓から、庭が見えた。</p><p>冴月さんが、ヒノエを見ていた。手は上げていなかった。まだとも、始めてとも示していない。</p><p>一拍、待っていた。</p><p>梁の雪鳥が、もう一度顔を上げた。</p><p class="q">「本人より、曲の続きを希望」</p><p>冴月さんが、頷いた。</p><p>ヒノエが、息を吸った。鳥の形の足が、敷石の縁をしっかりとつかむのが、ここからでも分かった。</p><p>笛が鳴った。</p><p>さっきまでとは、違う音だった。</p><p>呼び集める音ではなかった。煽る音でもなかった。一音ごとに、少しずつ間が空いている。その間に、誰かの一歩が入れるように。</p><p class="q">「……ここ、待ってたんだよ」</p><p>笛の合間に、ヒノエがそう言ったのが聞こえた。小さな声だった。誰に向けたのでもない声。</p><p>笛が、続く。</p><div class="sep" aria-hidden="true">◇</div><p>林の向こう、研究所の窓が、白く明るんでいた。</p><div class="sep" aria-hidden="true">◇</div><p class="cross">――同じ刻限。雪尾研究所、最奥。</p><p>寝台の上で身を起こした雪狐が、座ったまま、指先を動かした。</p><p>膝の上で、半円を描くように。</p><p>そして、そこで一度、止めた。</p><div class="sep" aria-hidden="true">◇</div><p>雪庭の、大きな狐の影が、足を止めた。</p><p>熊の形の影が、その場に座り込んだ。</p><p>鳥の形のものの、長すぎた翼が、柔らかく畳まれていく。</p><p>いっせいに消えはしなかった。一体ずつ。波打っていた尾が静まり、伸びていた足が縮み、引き延ばされていた影が、元の大きさへ畳まれていく。</p><p>小さな狐になる。小さな鳥になる。小さな雪の獣になる。</p><p>鎮静の札は、まだ外されなかった。</p><p class="q">「……おい。小さくなったの、踏むなよ」</p><p>雪鬼さんが、巨大な出刃を肩に担いだまま、足元を見て歩いていた。</p><p>雪音さんが、喫茶席から庭へ出て、灯りを低くしていた。小さな足元が、誰にも見えるように。</p><div class="sep" aria-hidden="true">◇</div><p>歌が、入った。</p><p>庭の端。夜澄さんが、喫茶席から庭へ戻って、石灯籠の影に立っていた。</p><p class="q">「月の夜、狐は舞い、紅鸞が笛を吹く」</p><p>雪庭で、最初に聞いた歌だった。最後の音が、行き先を探すように残って、途切れた歌。続きを聞いても？と訊いたとき、覚えているから少し難しい、とこの人は言った。</p><p>その先が、あった。</p><p class="q">「夜の輪をほどき、朝の道をあけて」</p><p>笛が、その歌に寄り添って、低くなっていく。</p><p>庭の真ん中で、小さくなった狐たちが座り込んでいた。鳥が、羽を畳んでいた。転んでいた雪の獣が、起き上がるのをやめて、雪の上で丸くなった。</p><p>ヒノエの話の中で、写真に撮られなかった次の動き。</p><p>それが今、目の前にあった。</p><div class="sep" aria-hidden="true">◇</div><p>梁の上で、雪鳥が、最後の伝令を読み上げた。</p><p class="q">「帰路、保持」</p><p class="q">「眷属、帰着」</p><p class="q">「館内、休息へ」</p><p>鎮めた数は、誰も数えなかった。数えるものが、なかったから。</p><div class="sep" aria-hidden="true">◇</div><p>同じ笛だった。</p><p>同じ庭だった。</p><p>終わらせ方を、思い出した夜だった。</p><h3 class="sec" id="ch8-9"><span class="num">九</span><span class="name">半円</span></h3><p>研究所と本館をつなぐ林の道には、安全の確認が済んだところから、灯りが入れられていた。</p><p>雪音さんが、こちらを見上げて言った。</p><p class="q">「会いに行きますか。朝にすることもできます」</p><p>少し考えた。</p><p>食堂の奥の席。伏せられた白い器。観測窓の向こうの黒髪。宴の写真の白髪。丸みのある字。</p><p>ずっと、その人の痕跡だけを見てきた。</p><p class="q">「……短く、挨拶だけ」</p><div class="sep" aria-hidden="true">◇</div><p>廊下の奥に、椅子が二脚あった。</p><p>庭の舞曲が、遠くからかすかに聞こえている。</p><p>片方の椅子に、雪狐が座っていた。肩に布を掛けている。雪音さんが研究所へ送った、あの湯籠の布だと思った。</p><p>白い髪だった。毛先だけが、薄く灰色を残している。頭の上には尖った狐の耳。椅子の下から、白い尾が床へこぼれていた。</p><p>もう片方の椅子に、月白先生が座っていた。同じ高さの椅子に。立ってはいなかった。</p><p>戸口で、足が止まった。二人の声が、聞こえていたから。</p><p class="q">「少し、踊ってもいい？」</p><p class="q">「今日は、座ったまま」</p><p class="q">「足、一歩だけ」</p><p class="q">「その一歩が、十歩になる」</p><p>雪狐が、少し考える顔をした。</p><p>それから、膝の上で、指先を動かした。小さな弧を描くように。</p><p>半円。</p><p>雪庭でヒノエが足先で描いて、途中で止めた弧。次の足を待って、ずっと半分のままだった弧。</p><p class="q">「じゃあ、これ」</p><p class="q">「それなら」</p><p>月白先生の声が、少しだけ低くなった。測った数字を読み上げる声ではなかった。</p><div class="sep" aria-hidden="true">◇</div><p>雪狐が、こちらに気づいた。</p><p>赤い瞳が、こちらを見た。</p><p class="q">「お客さま？」</p><p>名前を名乗った。</p><p>雪狐は、一度だけ、その名前を繰り返した。口の中で、確かめるように。宿帳に名前を書き込むときのように。</p><p class="q">「……泊まってくれて、ありがとう」</p><p class="q">「……こちらこそ」</p><p>それしか、言えなかった。</p><p>言いたいことは、たくさんあった。汁が多めの椀のこと。湯籠の数のこと。確認書の二つの筆跡のこと。でも、どれも、起きて最初の夜の人に渡すには、重すぎる気がした。</p><p>雪狐が、こちらへ手を伸ばしかけた。</p><p>指先に、白い熱のような光が、かすかに宿っていた。</p><p>そこで、雪狐は自分で気づいた。</p><p>手を、膝へ戻す。</p><p>髪の毛先が、ほんのわずか、灰色を濃くした。</p><p class="q">「近くに、いてほしくなるね」</p><p>一拍。</p><p class="q">「今は、ここでいい？」</p><p>戸口と椅子のあいだの距離を、雪狐は測るように見ていた。湯屋のいちばん遠い椅子を選んで座っていた夜澄さんの、あの目と同じだと思った。</p><p class="q">「はい。ここから、話せます」</p><p>雪狐が、頷いた。</p><p>寂しそうだった。けれど、椅子を近づけなかった。</p><div class="sep" aria-hidden="true">◇</div><p>客室へ戻る途中、背中で二人の声を聞いた。</p><p class="q">「欲がなくなったわけじゃない」</p><p class="q">「うん」</p><p class="q">「また、確かめる」</p><p>少し間があった。</p><p class="q">「明日も？」</p><p class="q">「明日も」</p><p>廊下の角を曲がる前に、一度だけ振り返った。</p><p>同じ高さの椅子が、二脚並んでいた。月白先生の黒い手袋の手は、自分の膝の上にあった。</p><p>その手に、雪狐の白い尾の先が、そっと触れていた。</p><h3 class="sec" id="ch8-10"><span class="num">十</span><span class="name">明日の器</span></h3><p>食堂には、夜食の湯気が立っていた。</p><p>雪鬼さんが椀を並べている。庭から戻った順に、一つずつ。最初の朝と同じ白い器と、出汁の匂い。</p><p>雪音さんが、配る側の人数まで数えていた。指を折りながら、小さな声で。数え終わって、自分の分の湯飲みを、ちゃんと一つ、手元に引き寄せた。</p><p>夜澄さんは、窓際の席で汁をひと口飲んで、黙った。喉を休めているのか、味わっているのか。たぶん両方だと思った。</p><p>ヒノエは、笛を卓には置かなかった。玄関脇の、あの棚へ、自分でしまってから席に着いた。椅子を後ろ向きにはしなかった。</p><p>雪鳥たちは、籠ではなく、小さな座布団の上で丸くなっていた。研究所の扉の前で一晩じゅう羽を伸ばしていたあの雪鳥も、その中にいた。</p><div class="sep" aria-hidden="true">◇</div><p>冴月さんが、玄関の札を確かめて、食堂へ戻ってきた。</p><p>こちらの席の前で、足を止める。</p><p class="q">「朝、もう一度下山路を見る」</p><p>満月の夜を越えても、この人の手元には、明日の朝の道がある。玄関で言ったことを、ちゃんと覚えている。</p><p class="q">「はい」</p><div class="sep" aria-hidden="true">◇</div><p>客室へ戻る渡り廊下で、足を止めた。</p><p>離れの戸の前に、鏡さんがいた。手ぬぐいを二本、肩に掛けている。</p><p class="q">「眠い？」</p><p class="q">「……まだ、少し」</p><p class="q">「だよね。満月のあとは、身体だけ先に起きてる」</p><p>鏡さんは、戸の外を顎で示した。</p><p class="q">「五分だけ。冷えたままだと、寝つけないから」</p><div class="sep" aria-hidden="true">◇</div><p>離れの裏手は、雪が浅かった。</p><p>石の縁に囲まれた、小さな湯溜まりがあった。三つの湯屋のどれとも違う。札も、屋根もない。湯気だけが、月の方へ昇っていた。</p><p class="q">「三つの湯から戻ってくる、余りの湯。名前はない」</p><p class="q">「……つけないんですか」</p><p class="q">「つけたら、誰かが管理しなきゃいけなくなる」</p><p>鏡さんは縁に腰を下ろして、裾を膝までたくし上げた。足を、湯へ下ろす。</p><p class="q">「これは、俺がたまに足を冷やさないための湯」</p><p>人ひとり分、間を空けて座った。</p><p>足先を入れる。熱すぎず、ぬるすぎず。</p><p>足首まで沈めると、今夜ずっと身体のどこかに張っていたものが、湯の方へほどけていった。</p><p class="q">「誰にも、内緒ですか」</p><p class="q">「冴月さんには言ってある。言ってないのは、雪鳥だけ」</p><p class="q">「どうして」</p><p class="q">「あいつら、口が軽いから」</p><p>笑ってしまった。笑ったら、肩が下りた。</p><p>湯気の向こうに、月が出ていた。さっきまで、あれほど怖かったはずの月。今は、ただ丸いだけだった。</p><p>鏡さんは、何も訊かなかった。今夜のことも、明日のことも。</p><p>手ぬぐいを一本、こちらの膝に置いた。</p><p class="q">「頑張った人の分も、ちょっとだけある」</p><p class="q">「……頑張れて、ましたか」</p><p class="q">「見てたよ」</p><p>それだけだった。</p><p>毛布を掛けてくれたときと同じだ、と思った。この人は、窓ではなく、ずっとこちらを見ていた。</p><p>足の先まで温まるまで、そこにいた。</p><div class="sep" aria-hidden="true">◇</div><p>立ち上がると、足の裏まで温かかった。</p><p>客室の前で、鏡さんは手ぬぐいを受け取って、片手を上げた。</p><p class="q">「おやすみ。ちゃんと寝な」</p><p class="q">「おやすみなさい」</p><p>戸を閉める。部屋の空気が、さっきより柔らかかった。</p><div class="sep" aria-hidden="true">◇</div><p>客室の文机に、今夜も紙が置いてあった。</p><p class="q mark">《今日の記録》。この宿に来てから、毎晩置かれていた紙。書けと言われたことは、一度もなかった。</p><p>筆を取った。</p><p>書くことは、決まっていた。決まっていたのに、手が止まった。</p><p>まだ、ここで知りたいことがある。起きた雪狐が、朝に何を食べるのか。月白先生が、冷めた夜食をちゃんと食べたのか。ヒノエの次の曲が、どんな曲なのか。</p><p>それを残したまま、帰ってもいい。</p><p>廊下の床は、窓の向こうへは続いていなかった。でも、玄関の向こうへは続いている。冴月さんが、毎朝そこを確かめてくれている。</p><p>紙に書いた。</p><p class="q mark">《明日は、自分の生活へ帰ろう。》</p><p>書いてから、それをしばらく眺めていた。</p><p class="q mark">《湯》とだけ書いた夜から、ずいぶん遠くまで来た気がした。でも、あの一文字がなければ、この一行は書けなかった。</p><p>紙を畳んで、開いたままの袋の一番上に、携帯電話の隣に入れた。</p><div class="sep" aria-hidden="true">◇</div><p>食堂。</p><p>片付けの終わった卓の、一番奥の席。</p><p>雪鬼さんが、小さな白い器を置いた。高台に銀色の継ぎ目のある、あの器。</p><p>今夜は、伏せなかった。</p><p>明日の注文は、まだ聞いていない。</p><div class="sep" aria-hidden="true">◇</div><p class="cross">――雪尾研究所。</p><p>月白は、記録を保存した。</p><p class="q mark">《覚醒を維持。翌朝、再確認》</p><p>寝台の雪狐は、眠る前に自ら目を閉じた。</p><p>札は、もう張られていなかった。術式で落とされる眠りではなかった。疲れて、暖かくて、月白が傍にいて、それで自分で選んだ。ただの眠りだった。</p><p>月白は、その呼吸を、しばらく確かめていた。</p><p>枕の上の髪は、白いままだった。毛先に、灰色のひと刷けを残して。</p><p>灯りを落とす。</p><div class="sep" aria-hidden="true">◇</div><p>玄関。</p><p>戸に掛かった札の表には、《夜間閉鎖》。</p><p>夜風が、戸の隙間から細く入ってきて、札を揺らした。</p><p>裏側が、ちらりと見えた。</p><p class="q mark">《朝、開ける》</p><p class="end">（第八章　終）</p></template>
<template id="t-epilogue" data-label="終章" data-title="また来るよ"><header class="chap-head"><p class="chap-label">終章</p><h2 class="chap-title">また来るよ</h2></header><h3 class="sec" id="epilogue-1"><span class="num">一</span><span class="name">温かいもの</span></h3><p>湯の沸く音で、目が覚めた。</p><p>廊下を行き来する足音。食器の触れ合う音。最初の朝と同じ、いつもの朝の音だった。</p><p>昨夜、窓の向こうにあった暖かさとは、少し違う。こちらは、足の裏で床を踏んで、扉を開けて、廊下を歩いていかないと辿り着けない暖かさだった。</p><p>窓の外は、晴れていた。</p><div class="sep" aria-hidden="true">◇</div><p>食堂には、もうほとんど全員が揃っていた。</p><p>冴月さん。夜澄さん。ヒノエ。雪音さん。座布団の上の雪鳥たち。雪鬼さんは、いつもどおり鍋の前にいる。</p><p>そして、月白先生が座っていた。</p><p>食堂の卓に。眼鏡を掛けて、黒い手袋を外して、器を持っている。前には、温め直されたらしい汁と、ご飯。昨夜の夜食だと、すぐに分かった。</p><p>冷ますな、と言っておけ。</p><p>雪鬼さんは、ちゃんと聞いていたのだ。</p><div class="sep" aria-hidden="true">◇</div><p>その奥。</p><p>窓に近い、一番奥の席。</p><p>椅子が、卓から引かれていた。</p><p>そこに、雪狐が座っていた。</p><p>白い髪が、椅子の背もたれから床の近くまで流れている。毛先に、かすかな灰色。朝の光の中で、狐の耳が、食堂の音の一つ一つに小さく動いていた。汁を注ぐ音。雪鳥の寝息。椅子を引く音。全部を、久しぶりに聞く音のように。</p><p>前には、小さな白い器。高台に銀色の継ぎ目。</p><p>毎朝拭かれていた床の上に、今朝は、誰かの足があった。</p><div class="sep" aria-hidden="true">◇</div><p>雪鬼さんが、鍋の前から顔だけそちらへ向けた。</p><p>いつかの朝、こちらにそうしたように。</p><p class="q">「何、食う」</p><p>雪狐は、少し考えた。</p><p>器を見て、鍋を見て、それから首を傾けた。狐の耳が、一緒に傾いた。</p><p class="q">「……温かいもの」</p><p class="q">「俺の飯は、だいたい温かい」</p><p>雪鬼さんは即答した。</p><p>雪狐が、きょとんとした。</p><p>それから、肩を揺らして笑った。声を出して。ヒノエの話の中で、宴の夜に雪狐が笑ったときも、たぶんこんな声だったのだろうと思った。</p><p class="q">「じゃあ、汁。多めに」</p><p class="q">「おん」</p><p>雪鬼さんが、小さな白い器を手に取った。</p><p>汁が、なみなみと注がれる。その器が、雪狐の前へ戻る。</p><p>雪狐は、両手で器を包んだ。湯気が、赤い瞳の前で立ち昇った。しばらく、飲まずに、ただその温度を手のひらで確かめていた。</p><p>それから、一口すすった。</p><p class="q">「……おいしい」</p><p>雪鬼さんは返事をしなかった。鍋の前へ向き直して、次の椀に汁を注ぎ始めた。その背中が、心なしか丸くなっていた。</p><div class="sep" aria-hidden="true">◇</div><p>雪音さんが、踏み台を持って来て、雪狐の席の横に置いた。</p><p>乗って、前掛けのポケットから、新しい注文札を一枚出す。まだ何も書いていない札だった。</p><p class="q">「飲み物は、何にしますか」</p><p>雪狐が、雪音さんを見た。それから、その小さな手の中の、白い札を見た。</p><p class="q">「……決めてなかった」</p><p class="q">「じゃあ、後でも大丈夫です」</p><p>雪音さんは、白いままの札を、器の横にそっと置いた。</p><p>まだ、何も書いていない札。表も、裏も。これから欲しいものが、いくつでも書き足せる札。</p><h3 class="sec" id="epilogue-2"><span class="num">二</span><span class="name">一歩だけ</span></h3><p>朝食の器が下げられ始めた頃、雪狐が立ち上がった。</p><p>椅子を引く音が、食堂に小さく響いた。白い尾が、床からふわりと持ち上がる。</p><p>そのまま、卓と卓のあいだの広いところへ、足を運びかけた。</p><p>一歩目が、床の上で弧を描きかける。</p><p class="q">「――セツコ」</p><p>月白先生の声だった。</p><p>大きな声ではなかった。それでも、雪狐の足は、弧の途中でぴたりと止まった。</p><p class="q">「一歩だけ」</p><p class="q">「昨夜も、そう言った」</p><p class="q">「昨夜は、指だけだった」</p><p class="q">「その一歩が、十歩になる」</p><p>雪狐は、唇を尖らせた。</p><p>干し札の前で、冴月さんに「仕事が終わってからね」と言われたときのヒノエと、同じ尖らせ方だった。</p><p>ヒノエが、卓の向こうで小さく吹き出した。すぐに口元を手で押さえた。笛は、玄関脇の棚にしまったままだ。</p><div class="sep" aria-hidden="true">◇</div><p>月白先生が、器を置いて立ち上がった。</p><p class="q">「踊る前に、湯だ」</p><p class="q">「……どの湯？」</p><p class="q">「迎え湯。その後で、足の具合を見る」</p><p>迎え湯。</p><p>半月あまり前の夕方、閉ざされた木戸の前で、月白先生が動かなかった。明日も、ここにあるよ、と冴月さんが言って、ようやく図面を畳んだ。</p><p>その湯へ、今朝は、起きた人が歩いていく。</p><p class="q">「……温かい？」</p><p class="q">「湯温の確認は済んでいる」</p><p>雪狐が、上目づかいに月白先生を見た。</p><p>それから、肩を揺らして笑った。</p><p class="q">「そういうところ、変わってない」</p><p>月白先生は、何も言わなかった。黒い手袋をはめ直して、食堂の扉を開けた。</p><p>でも、月白色の髪の、雪豹の斑のあるあたりで。</p><p>耳が一つ、ぴくりと動いたのが見えた。</p><p>雪狐が、その後ろについていく。扉を出るとき、白い尾が月白先生の外套の裾を、そっと撫でていった。</p><div class="sep" aria-hidden="true">◇</div><p>扉が閉まってから、雪鬼さんが、月白先生の器を下げに来た。</p><p>空だった。一粒も残っていなかった。</p><p>雪鬼さんは、その器をしばらく見ていた。</p><p class="q">「……食ったな」</p><p>それだけ言って、満足そうに厨房へ戻っていった。</p><h3 class="sec" id="epilogue-3"><span class="num">三</span><span class="name">荷札</span></h3><p>客室の袋は、まだ口を開けていた。</p><p>携帯電話。毎晩の記録の紙。昨夜の一行。一番上に置いたものは、そのままだった。</p><p>袋の口を、閉じた。</p><p>札が表になった朝、帳場のこちら側に置かれた荷物。</p><p>出発する人の荷物、と冴月さんは呼んだ。まだ出発していないのに。</p><p>今朝こそは、本当にそうなる。</p><div class="sep" aria-hidden="true">◇</div><p>帳場では、冴月さんが小さな札に筆を走らせていた。</p><p>荷札だった。紐を通す穴のある、薄い木の札。冴月さんは、書き終えた札を、こちらへ差し出した。</p><p>名前が書いてあった。細く、まっすぐな、冴月さんの字で。宿帳に書き込まれているのと、同じ大きさで。</p><p>その下に、もう一行。</p><p class="q mark">《帰路、確認済み》</p><p class="q">「道は、今朝も見てきたよ」</p><p>荷札を、袋の紐に結んだ。</p><div class="sep" aria-hidden="true">◇</div><p>厨房の入口で、雪鬼さんが包みを一つ、こちらの手に押しつけた。</p><p>竹の皮に包まれた、握り飯だった。温かい。</p><p class="q">「腹減ったら食え。途中で落とすなよ」</p><p>小さい方だった。</p><p>鎮め湯への道の途中、荷物を下ろして休んだときに選んだのと同じ、小さい方。</p><p class="q">「……覚えてたんですね」</p><p class="q">「聞いたからな」</p><div class="sep" aria-hidden="true">◇</div><p>回廊の窓辺で、夜澄さんが静かに座っていた。</p><p>椅子は二脚、間を空けて置かれている。向こう側の椅子に、浅く腰を下ろした。</p><p class="q">「帰るのだね」</p><p class="q">「はい」</p><p>夜澄さんは、窓の外を見たままだった。</p><p class="q">「君の欲は、口より少し正直だった。最初に会った日はね」</p><p>帰りたくなかったのかい。</p><p>傘を閉じながら、この人はそう言った。</p><p class="q">「今は？」</p><p>夜澄さんが、横目でこちらを見た。</p><p class="q">「今は、口と同じことを言っているように見える」</p><p>それから、聞き覚えのある歌――「見えない花の音」を口ずさんだ。</p><p>夜の輪をほどき、朝の道をあけて。</p><p>昨夜、はじめて言葉になった、あの先の旋律だった。</p><div class="sep" aria-hidden="true">◇</div><p>雪庭では、ヒノエが敷石の上に立っていた。</p><p>こちらに気づくと、ゆらゆら手を振った。</p><p class="q">「窓のひと。帰るの？」</p><p class="q">「はい」</p><p class="q">「そっか」</p><p>ヒノエは、敷石の上で足先を動かした。雪の上に弧が描かれる。半円。</p><p>そこで止めなかった。</p><p>弧が、そのまま続いていく。残りの半分を描いて、最初の一点へ戻る。</p><p>円になった。</p><p class="q">「……次の足、来たからね」</p><p>ヒノエは、そう言って笑った。前に見たどの笑い方より、愉快そうな笑い方だった。</p><div class="sep" aria-hidden="true">◇</div><p>喫茶席の前を通り過ぎようとしたとき、雪音さんが踏み台から降りてきた。</p><p>手に、小さな包みを持っている。布に包まれた、湯飲みぐらいの大きさのもの。</p><p class="q">「道中の分です。お湯です」</p><p>受け取ると、布越しに温かかった。熱すぎず、ぬるすぎず。</p><p class="q">「……表も裏も、消してないんですね」</p><p>雪音さんが、得意そうにこくりと頷いた。</p><p>それから、前掛けの裾を、小さな手でつまんだ。</p><p class="q">「次に会った時。数え間違えないところ、見てくださいね」</p><p class="q">「はい。友達として」</p><p>微笑む雪音さんの手が、裾から離れた。</p><div class="sep" aria-hidden="true">◇</div><p>渡り廊下の入口で、鏡さんが待っていた。</p><p>手に、布で包んだ水筒を持っている。</p><p class="q">「寒いから、ココア。冷めにくいやつ」</p><p>受け取ると、ずしりと重かった。布越しに、まだ熱い。</p><p class="q">「……ありがとうございます」</p><p>鏡さんは、こちらを上から下まで、ゆっくり見た。最初の夜に、ほんの一瞬で全部見ていったときとは違う。一つずつ、確かめるように。</p><p class="q">「顔色、よし。靴、よし。荷物、軽い。よし」</p><p>指を一本ずつ折って、最後に、こちらの顔を見た。</p><p class="q">「行ってこい」</p><p>明後日の朝にとっておく、と言っていた言葉だった。</p><p>何か言おうとした。</p><p>言葉には、ならなかった。ありがとう、でも、さようなら、でもない何かが、喉のあたりで形にならないまま止まっていた。</p><p>鏡さんは、それでいい、という顔で笑った。</p><p>それから、渡り廊下の方を振り返って、指さした。</p><p class="q">「あれ、点けとくから」</p><p>離れの灯りだった。朝の光の中で、もう要らないはずの灯りが、まだ点いていた。</p><h3 class="sec" id="epilogue-4"><span class="num">四</span><span class="name">玄関</span></h3><p>玄関の土間に、靴が一足だけ並んでいた。</p><p>自分の靴だった。札が表になった朝と同じ、つま先をこちらへ向けて。雪は、ついていなかった。</p><p>靴に足を入れて、紐を結ぶ。</p><p>顔を上げると、玄関に全員がいた。</p><p>冴月さんは帳場の前に。</p><p>雪鬼さんは廊下の柱に肩を預けて。</p><p>雪音さんは、踏み台を持たずに、雪鬼さんの隣に。</p><p>夜澄さんは、少し離れた廊下の奥に。</p><p>ヒノエは、玄関脇の棚の前に。笛は、棚に置いたままだった。</p><p>鏡さんは、玄関の端に立って。</p><p>梁の上に、雪鳥がずらりと並んでいた。</p><p>そして、廊下の奥から、二人が来た。</p><p>月白先生と、雪狐。</p><p>雪狐の髪は、湯で温まったせいか、朝よりも白く見えた。毛先の灰色が、ほとんど分からないくらいに。月白先生は、雪狐の歩く速さに合わせて、半歩遅れて歩いていた。</p><p>雪狐が、玄関の上がり框の手前で止まった。</p><p>赤い瞳が、こちらを見た。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「ずっと、ここにいてよ♡」</p><p>明るい声だった。</p><p>笑っていた。狐の耳が、心もち前へ倒れている。白い尾が、ゆっくりと左右に揺れていた。</p><p>冗談のように聞こえた。</p><p>冗談ではないことも、分かった。</p><div class="sep" aria-hidden="true">◇</div><p>ここにいたい気持ちは、あった。</p><p>汁が多めの椀。表も裏も消さない注文札。布巾の落ちる席。毎晩置かれる記録の紙。帳場の蜂蜜色の灯り。雪庭の半円。</p><p>みんな、優しかった。残っても、誰も怒らないだろう。雪鬼さんは翌朝の飯を聞き、雪音さんはいつもの席を空けておいてくれる。</p><p>でも、昨夜、窓の前で分かったことがあった。</p><p>ここを好きでも。窓から出なくていい。</p><p>ここを好きなままでも。玄関から、帰っていい。</p><p>帰りたいも、欲だ。夜澄さんがそう言った。帰りたいも、生きたいも。消すには大切すぎる。</p><p>ここにいたい気持ちも、消さなくていい。消さないまま、その上に、帰る日を載せればいい。戻り湯の椅子から立ったときのように。</p><p>それに、もう一つ。</p><p>帰った先からでも、ここへは来られる。</p><p>道標には、行きの矢印と帰りの矢印が、両方彫ってある。</p><div class="sep" aria-hidden="true">◇</div><p class="q">「……また来るよ」</p><p>声は、思っていたより小さく響いた。</p><p>迷っている声ではなかった。何かを切り捨てた声でもなかった。</p><p>雪狐の尾が止まった。</p><p>狐の耳が、ぺたりと下がった。</p><p>髪の毛先が、ほんのわずか灰色を濃くした。</p><p>寂しいのだと思った。隠そうともしない、そのままの寂しさだった。</p><p>月白先生は、何も言わなかった。雪狐の隣に立ったまま、黒い手袋の手を、ただそこに置いていた。雪狐の手の、すぐ横に。触れてはいなかった。触れようと思えば、すぐに触れられるところに。</p><p>雪狐は、しばらく黙っていた。</p><p>玄関の空気が、ひとつ息をした。</p><p>それから、小さく頷いた。</p><p class="q">「……うん」</p><div class="sep" aria-hidden="true">◇</div><p>冴月さんが、玄関の戸に手を掛けた。</p><p>戸には、札が掛かっていた。昨夜は《夜間閉鎖》の面をこちらへ向けていた札。</p><p>冴月さんが、それを裏返した。</p><p class="q mark">《朝、開ける》</p><p>戸が、開いた。</p><h3 class="sec" id="epilogue-5"><span class="num">五</span><span class="name">朝へ</span></h3><p>外は、朝だった。</p><p>雪が、光っていた。最初の夜に迷った雪と同じ雪のはずなのに、朝の光の中では、まったく別のものに見えた。遠くの山の稜線が、青い空にくっきりと、どこまでも続いている。</p><p>一歩、外へ出た。</p><p>雪を踏む音がした。</p><p>きゅっ、と小さく。</p><p>振り返った。</p><p>玄関に、全員がいた。</p><p>冴月さんが、戸に手を掛けたまま。雪鬼さんと、その隣の小さな雪音さん。廊下の奥の夜澄さん。棚の前のヒノエ。玄関の端の鏡さん。梁の雪鳥たち。</p><p>鏡さんは、手を振らなかった。ただ、こちらを見ていた。最初の夜から、ずっとそうしていたのと同じ目で。</p><p>上がり框の手前に、雪狐と月白先生。</p><p>雪狐は、手を振っていなかった。尾だけが小さく、一度だけ揺れた。</p><p>月白先生が、雪狐の手のすぐ横に置いていた手を、そっと動かしたのが見えた。</p><p>雪狐の指が、その手袋の指に絡んだ。</p><div class="sep" aria-hidden="true">◇</div><p>冴月さんが、道標のところまで送ってくれた。</p><p>最初に迷った分かれ道だった。今朝は、下へ続く道が、はっきりと見えている。</p><p>道標には、矢印が彫ってあった。表にも、裏にも。</p><p class="q">「この先は、道標がある。連絡も、ここなら試せる」</p><p>袋の一番上から、携帯電話を取り出した。</p><p>電源を入れる。</p><p>画面に、電波の印が一本だけ立った。それから、通知がいくつか届いた。一か月分の通知。</p><p>中身は、まだ開かなかった。</p><p>帰ってから、湯を沸かして、それから読もうと思った。</p><p class="q">「ありがとうございました」</p><p class="q">「どういたしまして」</p><p>冴月さんは、天気を告げるのと同じ声で言った。</p><p>それから、ひと呼吸置いた。</p><p class="q">「また来る時も、道は見ておくよ」</p><div class="sep" aria-hidden="true">◇</div><p>歩き出した。</p><p>道は、下りだった。雪は踏み固められていて、靴が沈まなかった。乾いた靴の中で、足先が温かい。</p><p>袋の中で、雪音さんのお湯が布越しに、まだ温かかった。</p><p>雪鬼さんの握り飯は、小さい方。荷札には、冴月さんの字。</p><p>途中で、一度だけ立ち止まった。</p><p>遠くで、笛の音がした気がした。</p><p>呼び集める音ではなかった。煽る音でもなかった。誰かの一歩のために、間を空けた音。朝の空気の中で、すぐに溶けて、聞こえなくなった。</p><p>そのとき、頭の上の枝から、小さな声が降ってきた。</p><p class="q">「ぴ！」</p><p>見上げると、白くて丸いものが一羽、雪の積もった枝の上にとまっていた。</p><p>黒い目が、当然のようにこちらを見下ろしている。</p><p>荷物には、入っていなかった。</p><p class="q">「……乗らないよ」</p><p class="q">「ぴ……」</p><p>笑ってしまった。</p><p>雪鳥は、枝の上で一度だけ胸を張ってから、羽を広げて来た道の方へ飛んでいった。</p><p>館の方へ。</p><p>その白い影を目で追って、振り返った。</p><div class="sep" aria-hidden="true">◇</div><p>真宵家は、もう見えなかった。</p><p>雪の林があって、青い空があって、来た道があった。それだけだった。</p><p>見られている気がした。</p><p>林の向こうの、もう見えない渡り廊下で、灯りが一つ、点いたままになっている気がした。</p><p>怖くはなかった。振り返らなくても、そこにあると分かっていた。</p><p>でも、道は、あった。</p><p>道標の裏には、帰りの矢印が彫ってある。そして表には行きの矢印が。</p><p>前を向いて、また歩き出した。</p><p>木々の間から、朝の音が聞こえはじめていた。</p><p>遠くの車の音。</p><p>雪かきの音。</p><p>誰かの家の、湯の沸く音。</p><p>帰ったら、まず、湯を沸かそう。</p><p>それから、</p><p class="card">『また、雪の降る日に』</p><p class="end">（雪の真宵家　終）</p></template>

'use strict';
const META=[{"id": "prologue", "label": "序章", "title": "月の夜、宿を見つける", "secs": [["prologue-1", "一", "圏外"], ["prologue-2", "二", "右へ一歩"], ["prologue-3", "三", "真宵家"], ["prologue-4", "四", "空席"], ["prologue-5", "五", "満月対応"], ["prologue-6", "六", "おいで"], ["prologue-7", "七", "渡り廊下の灯り"]]}, {"id": "ch1", "label": "第一章", "title": "空席のある宿", "secs": [["ch1-1", "一", "朝の足跡"], ["ch1-2", "二", "白飛びの写真"], ["ch1-3", "三", "処置室"], ["ch1-4", "四", "覚えている場所"], ["ch1-5", "五", "足跡の向き"], ["ch1-6", "六", "亡くなったとは"]]}, {"id": "ch2", "label": "第二章", "title": "欲のある人", "secs": [["ch2-1", "一", "帳場の札"], ["ch2-2", "二", "傘"], ["ch2-3", "三", "湯気の食堂"], ["ch2-4", "四", "布巾の落ちる席"], ["ch2-5", "五", "古い歌"], ["ch2-6", "六", "今日の記録"]]}, {"id": "ch3", "label": "第三章", "title": "赤い笛吹き", "secs": [["ch3-1", "一", "小鉢"], ["ch3-2", "二", "干し札"], ["ch3-3", "三", "半円"], ["ch3-4", "四", "一音"], ["ch3-5", "五", "記録棚"], ["ch3-6", "六", "二つの見出し"]]}, {"id": "ch4", "label": "第四章", "title": "三つの湯", "secs": [["ch4-1", "一", "採水瓶"], ["ch4-2", "二", "数え直し"], ["ch4-3", "三", "鎮め湯"], ["ch4-4", "四", "戻り湯"], ["ch4-5", "五", "閉じた木戸"], ["ch4-6", "六", "白い窓"]]}, {"id": "ch5", "label": "第五章", "title": "雪尾研究所", "secs": [["ch5-1", "一", "空の籠"], ["ch5-2", "二", "前室"], ["ch5-3", "三", "観測窓"], ["ch5-4", "四", "三冊の記録"], ["ch5-5", "五", "溶ける雪"], ["ch5-6", "六", "小さな鈴"], ["ch5-7", "七", "まだ聞けていない注文"]]}, {"id": "ch6", "label": "第六章", "title": "最初の一夜", "secs": [["ch6-1", "一", "火箸"], ["ch6-2", "二", "名前を知らなかった二匹"], ["ch6-3", "三", "柱の傷"], ["ch6-4", "四", "取り分"], ["ch6-5", "五", "撮られなかった次の動き"], ["ch6-6", "六", "四つの記録"], ["ch6-7", "七", "朝、開ける"]]}, {"id": "ch7", "label": "第七章", "title": "帰るための準備", "secs": [["ch7-1", "一", "三つの水盤"], ["ch7-2", "二", "未使用の処置票"], ["ch7-3", "三", "持ち場"], ["ch7-4", "四", "明るいうちの道"], ["ch7-5", "五", "自分の分"], ["ch7-6", "六", "開いたままの袋"]]}, {"id": "ch8", "label": "第八章", "title": "満月鎮静夜行", "secs": [["ch8-1", "一", "同じ言葉"], ["ch8-2", "二", "外周"], ["ch8-3", "三", "最初の札"], ["ch8-4", "四", "湯路"], ["ch8-5", "五", "起きたい"], ["ch8-6", "六", "窓"], ["ch8-7", "七", "最後の札"], ["ch8-8", "八", "宴"], ["ch8-9", "九", "半円"], ["ch8-10", "十", "明日の器"]]}, {"id": "epilogue", "label": "終章", "title": "また来るよ", "secs": [["epilogue-1", "一", "温かいもの"], ["epilogue-2", "二", "一歩だけ"], ["epilogue-3", "三", "荷札"], ["epilogue-4", "四", "玄関"], ["epilogue-5", "五", "朝へ"]]}];
const $=id=>document.getElementById(id);
const pane=$('pane'),text=$('text');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cur=0,saveT=0;

function maxScroll(){return Math.max(1,pane.scrollWidth-pane.clientWidth)}
function ratio(){return Math.min(1,Math.abs(pane.scrollLeft)/maxScroll())}
function setRatio(r){const s=pane.style.scrollBehavior;pane.style.scrollBehavior='auto';pane.scrollLeft=-r*maxScroll();pane.style.scrollBehavior=s}

function render(i,r){
  cur=Math.max(0,Math.min(META.length-1,i));
  const m=META[cur],t=document.getElementById('t-'+m.id);
  text.replaceChildren(t.content.cloneNode(true));
  const foot=document.createElement('div');foot.className='chap-foot';
  if(cur<META.length-1){
    const n=META[cur+1];const b=document.createElement('button');b.type='button';b.className='next-ch';b.id='next-ch';
    b.textContent='次の章へ　'+n.label;b.onclick=()=>go(cur+1,0);foot.append(Object.assign(document.createElement('span'),{className:'lamp'}),b);
  }else{
    foot.append(Object.assign(document.createElement('span'),{className:'lamp'}),Object.assign(document.createElement('p'),{className:'fin',textContent:'渡り廊下の灯りは、点けておきます。'}));
  }
  text.append(foot);
  $('where').textContent=m.label+'　'+m.title;
  document.querySelectorAll('#toc-list .ch').forEach((li,k)=>li.setAttribute('aria-current',k===cur?'true':'false'));
  requestAnimationFrame(()=>{setRatio(r||0);update();});
}
function go(i,r){render(i,r);save();}
function page(dir){ // dir=1 → 次（左へ）
  const step=pane.clientWidth*0.92;
  const atEnd=ratio()>=0.999, atStart=ratio()<=0.001;
  if(dir>0&&atEnd&&cur<META.length-1){go(cur+1,0);return}
  if(dir<0&&atStart&&cur>0){go(cur-1,1);return}
  pane.scrollBy({left:-dir*step});
}
function update(){
  const r=ratio();
  $('fill').style.width=(r*100)+'%';$('dot').style.right=(r*100)+'%';
  $('next').disabled=r>=0.999&&cur===META.length-1;
  $('prev').disabled=r<=0.001&&cur===0;
}
function save(){store.set('mayoiga-novel-pos',JSON.stringify({c:cur,r:ratio()}))}

pane.addEventListener('scroll',()=>{update();clearTimeout(saveT);saveT=setTimeout(save,250)},{passive:true});
pane.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();const s=pane.style.scrollBehavior;pane.style.scrollBehavior='auto';pane.scrollLeft-=e.deltaY;pane.style.scrollBehavior=s}
},{passive:false});
$('next').onclick=()=>page(1);$('prev').onclick=()=>page(-1);
document.addEventListener('keydown',e=>{
  if(!$('toc').hidden){if(e.key==='Escape')closeToc();return}
  if(e.key==='ArrowLeft'||e.key==='PageDown'||(e.key===' '&&!e.shiftKey)){e.preventDefault();page(1)}
  else if(e.key==='ArrowRight'||e.key==='PageUp'||(e.key===' '&&e.shiftKey)){e.preventDefault();page(-1)}
});

// font size
function setFs(px){
  const r=ratio();document.documentElement.style.setProperty('--fs',px+'px');
  document.querySelectorAll('.sizes .btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.fs==px)));
  store.set('mayoiga-novel-fs',String(px));requestAnimationFrame(()=>{setRatio(r);update()});
}
document.querySelectorAll('.sizes .btn').forEach(b=>b.onclick=()=>setFs(b.dataset.fs));

// contents
const list=$('toc-list');
META.forEach((m,i)=>{
  const li=document.createElement('li');li.className='ch';
  const a=document.createElement('a');a.href='#'+m.id;a.innerHTML='<span class="l"></span><span class="t"></span>';
  a.querySelector('.l').textContent=m.label;a.querySelector('.t').textContent=m.title;
  a.onclick=e=>{e.preventDefault();closeToc();go(i,0)};
  li.append(a);
  const ul=document.createElement('ul');
  m.secs.forEach(([sid,num,name])=>{const sl=document.createElement('li');const sa=document.createElement('a');sa.href='#'+sid;sa.textContent=num+'　'+name;
    sa.onclick=e=>{e.preventDefault();closeToc();if(cur!==i)render(i,0);requestAnimationFrame(()=>requestAnimationFrame(()=>{const el=document.getElementById(sid);if(el){el.scrollIntoView({block:'start',inline:'nearest'});setTimeout(save,400)}}))};
    sl.append(sa);ul.append(sl)});
  li.append(ul);list.append(li);
});
function openToc(){$('toc').hidden=false;const c=list.querySelector('[aria-current="true"] a');(c||$('close-toc')).focus()}
function closeToc(){$('toc').hidden=true;$('open-toc').focus()}
$('open-toc').onclick=openToc;$('close-toc').onclick=closeToc;
$('toc').addEventListener('click',e=>{if(e.target===$('toc'))closeToc()});

// start
let start=0,r0=0;
const h=location.hash.replace('#','');
const hi=META.findIndex(m=>m.id===h);
if(hi>=0){start=hi}else{try{const p=JSON.parse(store.get('mayoiga-novel-pos')||'null');if(p&&p.c>=0&&p.c<META.length){start=p.c;r0=+p.r||0}}catch(e){}}
const fs=store.get('mayoiga-novel-fs');setFs(fs&&['16','18','21'].includes(fs)?fs:'18');
render(start,r0);
window.addEventListener('resize',()=>{const r=ratio();requestAnimationFrame(()=>{setRatio(r);update()})});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const r=ratio();setRatio(r);update()});
})();
</script>

</body></html>
